<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Painel do responsável: o que a criança estudou no portal, provas e roteiro da escola.">
<style>
/* ---------- painel do responsável: base (cores do portal, claro e escuro) ---------- */
:root{
  --bg:#E4F2F6;--surface:#FFFFFF;--surface-2:#F2F8FA;--ink:#16304A;--muted:#4E6577;--line:#C9DDE5;
  --sea:#1C8DA3;--sea-2:#9FD3DE;--sun:#FFB627;--coral:#C23D27;--leaf:#2B8F4E;--leaf-soft:#DDF3E3;--coral-soft:#FCE4DF;--hl:#FFE7A8;
  --cal0:#E3ECEF;--cal1:#B5DDE6;--cal2:#7CC3D2;--cal3:#3FA2B7;--cal4:#1C6F82;
  color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1C29;--surface:#172A3B;--surface-2:#1D3447;--ink:#EAF4F8;--muted:#A9BFCC;--line:#2C4559;
  --sea:#4CC0D4;--sea-2:#2A6878;--sun:#FFC24D;--coral:#FF7A66;--leaf:#5BD08A;--leaf-soft:#173B2A;--coral-soft:#3E2220;--hl:#5A4A1C;
  --cal0:#22394C;--cal1:#21566A;--cal2:#2B7D93;--cal3:#3FA6BE;--cal4:#7FD6E6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1C29;--surface:#172A3B;--surface-2:#1D3447;--ink:#EAF4F8;--muted:#A9BFCC;--line:#2C4559;
  --sea:#4CC0D4;--sea-2:#2A6878;--sun:#FFC24D;--coral:#FF7A66;--leaf:#5BD08A;--leaf-soft:#173B2A;--coral-soft:#3E2220;--hl:#5A4A1C;
  --cal0:#22394C;--cal1:#21566A;--cal2:#2B7D93;--cal3:#3FA6BE;--cal4:#7FD6E6;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{line-height:1.2}
code{background:var(--surface-2);border-radius:6px;padding:1px 5px;overflow-wrap:anywhere}
.app{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));min-width:0}

/* ---------- painel do responsável: telas ---------- */
.peq{font-size:14px;color:var(--muted)}
.semdados{color:var(--muted);font-style:italic;margin:4px 0}
.erro{background:var(--coral-soft);border:2px solid var(--coral);border-radius:12px;padding:8px 12px;margin:0}
.ok{background:var(--leaf-soft);border-radius:12px;padding:8px 12px;margin:0}
.aviso{background:var(--hl);border-radius:12px;padding:10px 14px;margin:0;display:grid;gap:6px}
.urg{background:var(--coral-soft);border:2px solid var(--coral);border-radius:12px;padding:10px 14px;margin:0}
.msg{min-height:1.2em;margin:0;font-size:15px}
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bt{min-height:44px;padding:8px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600}
.bt:disabled{opacity:.55;cursor:default}
.bt.prim{background:var(--sea);border-color:var(--sea);color:var(--surface)}
.bt.perigo{border-color:var(--coral);color:var(--coral)}
.bt.larga{width:100%;display:grid;text-align:left;gap:2px}
.lk{display:inline-flex;align-items:center;min-height:44px;font-weight:700;color:var(--sea);text-underline-offset:3px;overflow-wrap:anywhere}
.campo{width:100%;min-height:46px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface);font-size:16px}
.campo.mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.rot{display:grid;gap:4px;font-weight:600;font-size:15px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px;min-width:0;align-content:start;overflow-wrap:anywhere}
.card h3{margin:0;font-size:17px}
.sub-card{background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;min-width:0}
.perigo-box{border-color:var(--coral)}
.sub{margin:6px 0 0;font-weight:700;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.lista{margin:0;padding-left:20px;display:grid;gap:6px}

/* login */
.login{max-width:520px;margin:0 auto;padding-top:24px;display:grid;gap:14px}
.lg-top,.t-tit{display:flex;align-items:center;gap:10px;min-width:0}
.lg-top h1{margin:0;font-size:24px}
.logo{font-size:28px}

/* topo, seletor e abas */
.topo{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:14px 0 6px}
.t-tit h1{margin:0;font-size:22px}
.t-conta{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.t-conta .peq{overflow-wrap:anywhere}
.sel{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.sel-um{margin:4px 0;font-size:17px}
.chip{min-height:44px;border:2px solid var(--line);background:var(--surface);border-radius:22px;padding:6px 14px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--surface)}
.abas{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0}
.aba{min-width:0;min-height:46px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px;font-weight:700;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aba[data-aba="revisao"]{grid-column:span 2;white-space:normal}
.aba[aria-selected="true"]{background:var(--sea);border-color:var(--sea);color:var(--surface)}
@media (max-width:800px){.abas{grid-template-columns:repeat(3,minmax(0,1fr))}.aba{font-size:14px}.aba[data-aba="revisao"]{grid-column:1/-1}}
.conteudo{display:grid;gap:14px;min-width:0;padding-top:6px}
.conteudo:focus{outline:none}

/* revisão */
.revisao-opcoes{min-width:0;margin:0;padding:0;border:0;display:grid;gap:8px}
.revisao-opcoes legend{padding:0 0 8px;font-weight:700}
.revisao-opcao{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:10px;padding:10px 12px;min-height:44px;border:2px solid var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer}
.revisao-opcao input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--sea)}
.revisao-dados{display:block}
.revisao-previa{display:grid;gap:8px;min-width:0}
.revisao-previa textarea{resize:vertical;min-width:0;scroll-margin-top:165px}
.revisao-instrucao{margin:6px 0 0;padding:6px 10px;border-inline-start:3px solid var(--line);background:var(--surface-2)}

/* números */
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
@media (max-width:420px){.nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
.num{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:2px;min-width:0;align-content:start}
.n-rot{font-size:13px;color:var(--muted);font-weight:600}
.n-val{font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.n-val .semdados{font-size:15px;font-weight:400}
.n-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tend{font-size:16px;color:var(--muted)}
.tend.sobe{color:var(--leaf)}.tend.desce{color:var(--coral)}
.duas{display:grid;gap:14px}
@media (min-width:800px){.duas{grid-template-columns:1fr 1fr}}
.card.bem{border-color:var(--leaf)}
.card.reforco{border-color:var(--coral)}
.card.ia{border-color:var(--sea);background:var(--surface-2)}
.rever{background:var(--hl);border-radius:10px;padding:6px 10px;margin:0}

/* matérias, assuntos, rotina */
.grade-m,.grade-a,.grade-r,.grade-c{display:grid;gap:14px;min-width:0}
@media (min-width:900px){.grade-m,.grade-r,.grade-c{grid-template-columns:1fr 1fr}.grade-a{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:600px) and (max-width:899px){.grade-a{grid-template-columns:1fr 1fr}}
.m-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.nivel{font-size:13px;font-weight:700;border-radius:20px;padding:2px 10px;border:2px solid var(--line)}
.n-otimo{border-color:var(--leaf);color:var(--leaf)}
.n-bom{border-color:var(--sea);color:var(--sea)}
.n-reforco{border-color:var(--coral);color:var(--coral)}
.n-sem_dados{color:var(--muted)}
.card.nv-reforco{border-color:var(--coral)}
.ia-f{background:var(--surface-2);border-radius:12px;padding:8px 12px}
.ia-f ul{margin:2px 0;padding-left:20px}
.barras{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.barras li{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,34%) auto;gap:8px;align-items:center;font-size:14px}
.barras li>span:first-child{overflow-wrap:anywhere}
.med{display:block;height:10px;border-radius:6px;background:var(--cal0);overflow:hidden}
.med>span{display:block;height:100%;background:var(--sea)}
.med.otimo>span{background:var(--leaf)}.med.reforco>span{background:var(--coral)}.med.bom>span{background:var(--sea)}.med.sem_dados>span{background:var(--muted)}
.medalha{font-size:14px}
.emp{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--cal0)}
.emp span{display:block;height:100%}
.e-p,.leg .lp::before{background:var(--leaf)}
.e-i,.leg .li::before{background:var(--sun)}
.e-e,.leg .le::before{background:var(--coral)}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0;font-size:13px;color:var(--muted)}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.erradas{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.erradas li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:14px;border-top:1px solid var(--line);padding-top:6px}
.vezes{font-weight:700;color:var(--coral)}

/* gráficos SVG */
.graf{display:block;width:100%;max-width:560px;height:auto}
.graf.calor{max-width:420px}
.g-grade{stroke:var(--line);stroke-width:1}
.g-eixo{fill:var(--muted);font-size:10px;font-family:system-ui,sans-serif}
.g-linha{fill:none;stroke:var(--sea);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.g-ponto{fill:var(--surface);stroke:var(--sea);stroke-width:2}
.g-barra{fill:var(--sea-2)}
.g-barra.dest{fill:var(--sea)}
.g-cal.n0{fill:var(--cal0)}.g-cal.n1{fill:var(--cal1)}.g-cal.n2{fill:var(--cal2)}.g-cal.n3{fill:var(--cal3)}.g-cal.n4{fill:var(--cal4)}

/* escola */
.itens{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.itens li{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:3px;min-width:0}
.itens li:first-child{border-top:none;padding-top:0}
.itens li.urg{background:var(--coral-soft);border:2px solid var(--coral);border-radius:12px;padding:8px 10px}
.itens li.passou{opacity:.6}
.itens li.acao{border-left:4px solid var(--sun);padding-left:8px}
.i-top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.i-top span{color:var(--muted);font-weight:600;font-size:14px}
.tag{border:2px solid var(--line);border-radius:20px;padding:0 8px}
.tag.pede{background:var(--hl);color:var(--ink)!important}
.agenda{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.agenda li{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:3px;min-width:0;overflow-wrap:anywhere}
.agenda li:first-child{border-top:none;padding-top:0}
.agenda li.ag-urgente{background:var(--coral-soft);border:2px solid var(--coral);border-radius:12px;padding:8px 10px}
.agenda li.ag-importante{border-left:4px solid var(--sun);padding-left:8px}
.tag.selo-urgente{background:var(--coral-soft);border-color:var(--coral);color:var(--ink)!important}
.tag.selo-importante{background:var(--hl);color:var(--ink)!important}
.ag-estudar{min-width:0;overflow-wrap:anywhere}
.ag-estudar summary{cursor:pointer;font-weight:700;padding:6px 0;min-height:32px}
.ag-estudar p{margin:2px 0}
.ag-conteudos{margin:4px 0 0;padding-left:20px;display:grid;gap:3px}
.cm-grupo{margin:12px 0 6px;font-size:1rem}
.cm-grupo:first-of-type{margin-top:0}
.cm-grupo.cm-imp{color:var(--ink)}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px}

/* configurar */
.cris{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cri{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.cri:first-child{border-top:none;padding-top:0}
.cri-b{font-size:28px}
.cri-n{display:grid}
.cri-bt{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.bichos{display:flex;flex-wrap:wrap;gap:6px}
.bicho{width:48px;height:48px;font-size:26px;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.bicho[aria-pressed="true"]{border-color:var(--sea);background:var(--surface-2);box-shadow:0 0 0 2px var(--sea)}
.duas-c{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.figgrade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:320px}
.figbtn{min-height:52px;font-size:26px;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.figcasas{display:flex;gap:8px}
.figcasa{width:52px;height:52px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;font-size:26px}
.figcasa.cheia{border-style:solid;border-color:var(--sea)}
.figcasa.vez{border-color:var(--sun)}
.passos{padding-left:20px;display:grid;gap:4px}
.card.comecar{border-color:var(--sea);background:var(--surface-2)}
.cform.chave .campo.mono{min-width:0;overflow:hidden;text-overflow:ellipsis}
.cri-bt .bt{flex:1 1 auto}
[hidden]{display:none!important}
/* entrada com e-mail e senha (15/11): duas abas grandes, "Manter conectado" e links-botão */
.lg-card{min-width:0}
.lg-tit{margin:0;font-size:20px}
.lg-abas{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:4px}
.lg-aba{min-height:50px;border:none;border-radius:10px;background:transparent;font-size:17px;font-weight:700;color:var(--muted)}
.lg-aba[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 2px var(--sea)}
.lg-form{display:grid;gap:10px;min-width:0}
.lg-form .rot{min-width:0}
.lg-lembrar{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.lg-lembrar input{width:22px;height:22px;flex:none;margin:0}
.lg-aviso{margin:-6px 0 0}
.lk-bt{justify-self:start;background:none;border:none;padding:8px 2px;min-height:44px;font-size:15px;color:var(--sea);text-decoration:underline;font-weight:600}

.revisao-videos ul{overflow-wrap:anywhere;margin:0 0 .75rem;padding-inline-start:1.5rem}
.revisao-videos .revisao-grupo{border:1px solid var(--line,#d6dfd9);border-radius:12px;padding:.75rem;background:#fff}
.revisao-videos .revisao-grupo>label{display:flex;align-items:flex-start;gap:.6rem}
.revisao-videos .revisao-grupo li{margin:.55rem 0}
.revisao-videos .revisao-grupo small{display:block;margin:.2rem 0 .2rem 1.5rem}
.revisao-videos video{display:block;width:100%;max-width:30rem;max-height:65vh;margin:.75rem auto;background:#171717}
.revisao-videos .sub-card{margin-block:.75rem}

</style>

selfportrait:0":{"e":"Which picture could be a self-portrait?","c":"autorretrato","t":"escolha","p":"Qual desenho pode ser um autorretrato?"},"b:selfportrait:0~v":{"e":"True or false?","c":"autorretrato","t":"vf","p":"Verdadeiro ou falso?"},"b:selfportrait-how:0":{"e":"Which face shows a happy expression?","c":"autorretrato-como","t":"escolha","p":"Qual rosto mostra uma expressão feliz?"},"b:selfportrait-how:0~v":{"e":"Which face shows a surprised expression?","c":"autorretrato-como","t":"escolha","p":"Qual rosto mostra uma expressão de surpresa?"},"decisao-p1":{"e":"Task 1: a Zentangle heart. It has three empty parts. How do you fill them?","c":"padroes","t":"decisao","p":"Tarefa 1: um coração Zentangle. Ele tem três partes vazias. Como preencher?"},"decisao-p1-conserto":{"e":"The heart is still empty. Think: what makes a Zentangle?","c":"padroes","t":"decisao","p":"O coração continua vazio. Pense: o que faz um Zentangle?"},"decisao-p2":{"e":"Task 2: paint one flower like Georgia O'Keeffe. How big?","c":"okeeffe","t":"decisao","p":"Tarefa 2: pintar uma flor como Georgia O'Keeffe. De que tamanho?"},"decisao-p2-conserto":{"e":"The flower is too small. How do you paint it like her?","c":"okeeffe","t":"decisao","p":"A flor ficou pequena demais. Como pintar como ela?"},"decisao-p3":{"e":"Task 3: choose the colours for your O'Keeffe flower.","c":"okeeffe-estilo","t":"decisao","p":"Tarefa 3: escolha as cores da sua flor de O'Keeffe."},"decisao-p3-conserto":{"e":"Your flower looks pale. Pick again from the palette.","c":"okeeffe-estilo","t":"decisao","p":"A sua flor ficou apagada. Escolha de novo na paleta."},"decisao-p4":{"e":"Task 4: the class wants a city landscape. What do you put in it?","c":"paisagem-tipos","t":"decisao","p":"Tarefa 4: a turma quer uma paisagem da cidade. O que você põe?"},"decisao-p4-conserto":{"e":"It does not look like a city yet. Try again.","c":"paisagem-tipos","t":"decisao","p":"Ainda não parece uma cidade. Tente de novo."},"decisao-p5":{"e":"Task 5: your self-portrait. What do you look at first?","c":"autorretrato-como","t":"decisao","p":"Tarefa 5: o seu autorretrato. O que você observa primeiro?"},"decisao-p5-conserto":{"e":"The page is still blank. What helps you see yourself?","c":"autorretrato-como","t":"decisao","p":"A folha continua em branco. O que ajuda você a se ver?"}},"idioma":"en","revisao_titulos":{"zentangle":"Técnica Zentangle: padrões repetidos","padroes":"Padrões variados com linhas e formas simples","okeeffe":"Georgia O'Keeffe: flores em grande escala","okeeffe-estilo":"Estilo de O'Keeffe: formas simples e cores fortes","paisagem":"O que é paisagem","paisagem-tipos":"Paisagem da natureza e da cidade","autorretrato":"O que é autorretrato","autorretrato-como":"Como fazer um autorretrato"},"revisao":{"arg-r1-1":{"c":"padroes","e":"What rule do these patterns follow?","p":"Que regra esses padrões seguem?","x":"Stripes, dots and zigzags all repeat a line or a shape.","xp":"Listras, bolinhas e zigue-zagues repetem uma linha ou forma."},"arg-r1-2":{"c":"zentangle","e":"Tap the drawing that is not a pattern.","p":"Toque no desenho que não é padrão.","x":"Circles, waves and squares repeat. A scribble does not.","xp":"Círculos, ondas e quadradinhos se repetem. O rabisco não."},"arg-r1-3":{"c":"padroes","e":"Zentangle uses repeated patterns. I draw a heart. I fill every part with the same pattern.","p":"Zentangle usa padrões repetidos. Eu desenho um coração. Encho todas as partes com o mesmo padrão.","x":"The guide asks for different patterns to fill the drawing.","xp":"O guia pede padrões diferentes para preencher o desenho."},"arg-r1-4":{"c":"padroes","e":"Which shapes do we use to make patterns?","p":"Que formas usamos para fazer padrões?","x":"simple lines and shapes — Patterns use simple lines and shapes, like dots and zigzags.","xp":"linhas e formas simples — Os padrões usam linhas e formas simples, como bolinhas e zigue-zagues."},"arg-r1-4-v":{"c":"padroes","e":"Which one is a simple shape for a pattern?","p":"Qual é uma forma simples para um padrão?","x":"a circle — A circle is a simple shape. Repeat it to make a pattern.","xp":"um círculo — O círculo é uma forma simples. Repita para fazer um padrão."},"arg-r1-5":{"c":"zentangle","e":"In class, the hearts had Zentangle patterns inside them.","p":"Na aula, os corações tinham padrões Zentangle dentro.","x":"It is true: three hearts with Zentangle inside, on watercolour.","xp":"É verdade: três corações com Zentangle dentro, sobre aquarela."},"arg-r1-5-v":{"c":"zentangle","e":"A Zentangle drawing uses no patterns.","p":"O desenho Zentangle não usa padrões.","x":"Zentangle is made of repeated patterns.","xp":"O Zentangle é feito de padrões repetidos."},"arg-r2-1":{"c":"okeeffe","e":"Why does this painting look like O'Keeffe's flowers?","p":"Por que esta pintura parece as flores de O'Keeffe?","x":"The flower is big and close. — O'Keeffe painted flowers big and up close, with strong colours.","xp":"A flor é grande e de perto. — O'Keeffe pintava flores grandes e de perto, com cores fortes."},"arg-r2-2":{"c":"okeeffe-estilo","e":"What if you paint a flower in O'Keeffe's style?","p":"E se você pintar uma flor no estilo de O'Keeffe?","x":"I paint it big, bright and simple. — Her style: big flowers, strong colours, simple shapes.","xp":"Pinto grande, viva e simples. — O estilo dela: flores grandes, cores fortes, formas simples."},"arg-r2-3":{"c":"okeeffe-estilo","e":"Tap the card that is not O'Keeffe's style.","p":"Toque no cartão que não é do estilo de O'Keeffe.","x":"Big flowers, strong colours and simple shapes are her style. Tiny grey details are not.","xp":"Flores grandes, cores fortes e formas simples são o estilo dela. Detalhes cinza miúdos não."},"arg-r2-4":{"c":"okeeffe","e":"Which painting shows a flower up close?","p":"Qual pintura mostra uma flor de perto?","x":"Up close, a flower looks huge. Small flowers far away look tiny.","xp":"De perto, a flor parece enorme. Flores longe parecem miúdas."},"arg-r2-4-v":{"c":"okeeffe","e":"O'Keeffe painted flowers very small and far away.","p":"O'Keeffe pintava flores bem pequenas e longe.","x":"Her flowers are big, up close.","xp":"As flores dela são grandes, de perto."},"arg-r2-5":{"c":"okeeffe-estilo","e":"O'Keeffe used strong colours inspired by ___.","p":"O'Keeffe usava cores fortes inspiradas na ___.","x":"Her colours were inspired by nature.","xp":"As cores dela eram inspiradas na natureza."},"arg-r2-5-v":{"c":"okeeffe-estilo","e":"Besides flowers, what else did O'Keeffe paint, like in your landscape?","p":"Além de flores, o que mais O'Keeffe pintou, como na sua paisagem?","x":"barns — Your landscape was inspired by her barns.","xp":"celeiros (barns) — A sua paisagem foi inspirada nos celeiros dela."},"arg-r3-1":{"c":"paisagem-tipos","e":"What do these show together?","p":"O que esses mostram juntos?","x":"Mountains, rivers, trees and sky are nature: a nature landscape.","xp":"Montanhas, rios, árvores e céu são natureza: paisagem natural."},"arg-r3-2":{"c":"paisagem-tipos","e":"What if you draw tall buildings and streets?","p":"E se você desenhar prédios altos e ruas?","x":"It is a city landscape. — Buildings and streets show a city: an urban landscape.","xp":"É uma paisagem urbana. — Prédios e ruas mostram a cidade: paisagem urbana."},"arg-r3-3":{"c":"autorretrato-como","e":"To make a self-portrait, I look at myself. I look at my face, hair and expression. Then I draw a big mountain.","p":"Para fazer um autorretrato, eu me observo. Olho meu rosto, cabelo e expressão. Depois desenho uma montanha grande.","x":"A mountain is for a landscape. A self-portrait shows your face and hair.","xp":"Montanha é para paisagem. O autorretrato mostra o seu rosto e cabelo."},"arg-r3-4":{"c":"autorretrato","e":"A self-portrait is a picture of…","p":"Um autorretrato é um desenho de…","x":"the artist who made it — In a self-portrait, the artist draws himself or herself.","xp":"quem fez o desenho — No autorretrato, o artista desenha a si mesmo."},"arg-r3-4-v":{"c":"autorretrato","e":"Which one could be a self-portrait?","p":"Qual pode ser um autorretrato?","x":"A self-portrait shows a person: the artist.","xp":"O autorretrato mostra uma pessoa: o artista."},"arg-r3-5":{"c":"autorretrato-como","e":"In a self-portrait, you can show your expression: happy, calm or surprised.","p":"No autorretrato, você pode mostrar sua expressão: feliz, calmo ou surpreso.","x":"It is true: look at your face, hair and expression.","xp":"É verdade: observe o rosto, o cabelo e a expressão."},"arg-r3-5-v":{"c":"autorretrato-como","e":"Your expression shows…","p":"A sua expressão mostra…","x":"how your face looks — Your expression is how your face looks: happy, calm, surprised.","xp":"como está o seu rosto — A expressão é como o seu rosto está: feliz, calmo, surpreso."},"arb-z1":{"c":"zentangle","e":"What is a Zentangle drawing?","p":"O que é um desenho Zentangle?","x":"a drawing of repeated patterns — Zentangle is a drawing made of patterns that repeat.","xp":"um desenho de padrões repetidos — Zentangle é um desenho feito de padrões que se repetem."},"arb-z2":{"c":"zentangle","e":"A pattern repeats the same lines or shapes.","p":"Um padrão repete as mesmas linhas ou formas.","x":"It is true: dots, dots, dots... A pattern repeats.","xp":"É verdade: bolinha, bolinha, bolinha... O padrão se repete."},"arb-z3":{"c":"zentangle","e":"Dot, dash, dot, dash. What mark comes next?","p":"Bolinha, traço, bolinha, traço. Qual marca vem depois?","x":"a dot — The pair repeats: dot, dash. Start the pair again with a dot.","xp":"uma bolinha — O par se repete: bolinha e traço. Comece outro par com a bolinha."},"arb-z4":{"c":"zentangle","e":"Which heart uses the Zentangle technique?","p":"Qual coração usa a técnica Zentangle?","x":"Zentangle fills the drawing with repeated patterns. One flat colour is not Zentangle.","xp":"O Zentangle enche o desenho de padrões repetidos. Uma cor lisa não é Zentangle."},"arb-z5":{"c":"zentangle","e":"Tap the card that is not a pattern.","p":"Toque no cartão que não é padrão.","x":"Stripes, dots and zigzags repeat. A scribble does not.","xp":"Listras, bolinhas e zigue-zagues se repetem. O rabisco não."},"arb-p1":{"c":"padroes","e":"Which shapes make Zentangle patterns?","p":"Que formas fazem os padrões do Zentangle?","x":"simple lines and shapes — Zentangle patterns use simple lines and shapes: dots, lines, circles, zigzags.","xp":"linhas e formas simples — Os padrões do Zentangle usam linhas e formas simples: bolinhas, linhas, círculos, zigue-zagues."},"arb-p2":{"c":"padroes","e":"In Zentangle, fill each part with a ___ pattern.","p":"No Zentangle, preencha cada parte com um padrão ___.","x":"The guide says: fill the drawing with different patterns.","xp":"O guia diz: preencher o desenho com padrões diferentes."},"arb-p3":{"c":"padroes","e":"Which part of the heart has zigzags?","p":"Qual parte do coração tem zigue-zagues?","x":"the right part — The lines in the right section go up and down again and again.","xp":"a parte direita — As linhas da direita sobem e descem várias vezes."},"arb-p4":{"c":"padroes","e":"A Zentangle pattern can be made of dots, lines or circles.","p":"Um padrão Zentangle pode ser feito de bolinhas, linhas ou círculos.","x":"It is true: dots, lines and circles are simple shapes for patterns.","xp":"É verdade: bolinhas, linhas e círculos são formas simples para padrões."},"arb-p5":{"c":"padroes","e":"Tina filled a heart with only dots. What can she improve?","p":"A Tina encheu um coração só de bolinhas. O que ela pode melhorar?","x":"Use other patterns in other parts. — The guide asks for varied patterns: a different one in each part.","xp":"Usar outros padrões nas outras partes. — O guia pede padrões variados: um diferente em cada parte."},"arb-o1":{"c":"okeeffe","e":"Who was Georgia O'Keeffe?","p":"Quem foi Georgia O'Keeffe?","x":"a painter — Georgia O'Keeffe was a painter, an artist who made paintings.","xp":"uma pintora — Georgia O'Keeffe foi uma pintora, uma artista que fazia pinturas."},"arb-o2":{"c":"okeeffe","e":"What shows that this flower is painted up close?","p":"O que mostra que esta flor foi pintada de perto?","x":"Its petals reach the edges. — When the flower looks very large, its petals can reach the edges of the picture.","xp":"As pétalas chegam às bordas. — Quando a flor parece bem grande, as pétalas podem chegar às bordas."},"arb-o3":{"c":"okeeffe","e":"O'Keeffe painted flowers very big, as if we were very close.","p":"O'Keeffe pintou flores bem grandes, como se estivéssemos muito perto.","x":"It is true: her flowers are big and up close.","xp":"É verdade: as flores dela são grandes e de perto."},"arb-o4":{"c":"okeeffe","e":"O'Keeffe painted flowers in a ___ scale.","p":"O'Keeffe pintou flores em escala ___.","x":"Her flowers are painted in a big scale: very large.","xp":"As flores dela são pintadas em escala grande: bem grandes."},"arb-o5":{"c":"okeeffe","e":"What if you paint a flower up close, like O'Keeffe?","p":"E se você pintar uma flor de perto, como O'Keeffe?","x":"It fills the whole page. — When you are very close, the flower looks huge and fills the page.","xp":"Ela enche a folha toda. — Quando você está bem perto, a flor parece enorme e enche a folha."},"arb-e1":{"c":"okeeffe-estilo","e":"Which pair gives this flower the strongest colours?","p":"Qual par dá a esta flor as cores mais fortes?","x":"Look for the vivid purple and orange. The other flowers use softer colours.","xp":"Procure o roxo e o laranja vivos. As outras flores têm cores mais suaves."},"arb-e2":{"c":"okeeffe-estilo","e":"Match each part of O'Keeffe's style.","p":"Ligue cada parte do estilo de O'Keeffe.","x":"Her style: big flowers, simple shapes, strong colours.","xp":"O estilo dela: flores grandes, formas simples, cores fortes."},"arb-e3":{"c":"okeeffe-estilo","e":"Tap the colour that is not strong.","p":"Toque na cor que não é forte.","x":"Red, purple and yellow are strong. Pale grey is soft.","xp":"Vermelho, roxo e amarelo são fortes. Cinza clarinho é suave."},"arb-e4":{"c":"okeeffe-estilo","e":"O'Keeffe's strong colours were inspired by nature.","p":"As cores fortes de O'Keeffe eram inspiradas na natureza.","x":"It is true: her colours come from nature.","xp":"É verdade: as cores dela vêm da natureza."},"arb-e5":{"c":"okeeffe-estilo","e":"In class, your summer landscape was inspired by O'Keeffe's ___.","p":"Na aula, a sua paisagem de verão foi inspirada nos ___ de O'Keeffe.","x":"In class you painted a landscape inspired by O'Keeffe's barns.","xp":"Na aula vocês pintaram uma paisagem inspirada nos celeiros de O'Keeffe."},"arb-l1":{"c":"paisagem","e":"Which idea would make a landscape?","p":"Qual ideia formaria uma paisagem?","x":"trees along a river — A landscape shows a place. Trees along a river show what that place looks like.","xp":"árvores à beira de um rio — Uma paisagem mostra um lugar. As árvores junto ao rio mostram como é esse lugar."},"arb-l2":{"c":"paisagem","e":"A landscape shows a place.","p":"Uma paisagem mostra um lugar.","x":"It is true: a landscape shows a place.","xp":"É verdade: a paisagem mostra um lugar."},"arb-l3":{"c":"paisagem","e":"What does a landscape show?","p":"O que uma paisagem mostra?","x":"a place outside — A landscape shows a place, like a river valley or a city street.","xp":"um lugar lá fora — A paisagem mostra um lugar, como um vale ou uma rua da cidade."},"arb-l4":{"c":"paisagem","e":"In a landscape, what does the horizon line separate?","p":"Na paisagem, o que a linha do horizonte separa?","x":"the sky and the ground — The horizon is the line where the sky meets the ground, like in your barn landscape.","xp":"o céu e o chão — O horizonte é a linha onde o céu encontra o chão, como na sua paisagem do celeiro."},"arb-l5":{"c":"paisagem","e":"A landscape shows a place. It can show mountains and rivers. It always shows a face.","p":"A paisagem mostra um lugar. Ela pode mostrar montanhas e rios. Ela sempre mostra um rosto.","x":"A picture of a face is a portrait. A landscape shows a place.","xp":"O desenho de um rosto é um retrato. A paisagem mostra um lugar."},"arb-t1":{"c":"paisagem-tipos","e":"Nature or city? Put each thing in the right box.","p":"Natureza ou cidade? Coloque cada coisa na caixa certa.","x":"Mountains, rivers and trees are nature. Buildings and streets are the city.","xp":"Montanhas, rios e árvores são natureza. Prédios e ruas são a cidade."},"arb-t2":{"c":"paisagem-tipos","e":"What makes this drawing a city landscape?","p":"O que faz deste desenho uma paisagem urbana?","x":"the buildings and street — Sky and sunlight appear in both types of landscape. Buildings and a street show the city here.","xp":"os prédios e a rua — Céu e sol aparecem nos dois tipos de paisagem. Aqui os prédios e a rua mostram a cidade."},"arb-t3":{"c":"paisagem-tipos","e":"What kind of landscape has these?","p":"Que tipo de paisagem tem isso?","x":"Buildings, streets and houses are in a city landscape.","xp":"Prédios, ruas e casas estão na paisagem da cidade."},"arb-t4":{"c":"paisagem-tipos","e":"Mountains, rivers and trees are part of a nature landscape.","p":"Montanhas, rios e árvores fazem parte de uma paisagem natural.","x":"It is true: mountains, rivers, trees and the sky are nature.","xp":"É verdade: montanhas, rios, árvores e céu são natureza."},"arb-t5":{"c":"paisagem-tipos","e":"What if you add a river and mountains to a blank page?","p":"E se você puser um rio e montanhas numa folha em branco?","x":"You start a nature landscape. — A river and mountains show a place in nature.","xp":"Você começa uma paisagem natural. — Rio e montanhas mostram um lugar da natureza."},"arb-a1":{"c":"autorretrato","e":"Which artist is making a self-portrait?","p":"Qual artista está fazendo um autorretrato?","x":"Lina draws her own face. — In a self-portrait, the artist draws themself.","xp":"Lina desenha o próprio rosto. — No autorretrato, o artista desenha a si mesmo."},"arb-a2":{"c":"autorretrato","e":"A self-portrait is a picture of yourself, made by you.","p":"Um autorretrato é um desenho de você mesmo, feito por você.","x":"It is true: in a self-portrait, you draw yourself.","xp":"É verdade: no autorretrato, você desenha você mesmo."},"arb-a3":{"c":"autorretrato","e":"You want to draw a self-portrait. What can you look at?","p":"Você quer fazer um autorretrato. O que pode observar?","x":"your face in a mirror — The mirror helps you see your own features for a self-portrait.","xp":"seu rosto no espelho — O espelho ajuda a ver seus traços para fazer o autorretrato."},"arb-a4":{"c":"autorretrato","e":"Why is a self-portrait a kind of portrait?","p":"Por que o autorretrato é um tipo de retrato?","x":"It shows a person. — A portrait shows a person. In a self-portrait, that person is you.","xp":"Ele mostra uma pessoa. — O retrato mostra uma pessoa. No autorretrato, essa pessoa é você."},"arb-a5":{"c":"autorretrato","e":"Tap what you do not need to look at for a self-portrait.","p":"Toque no que você não precisa olhar para o autorretrato.","x":"For a self-portrait, look at your face, hair and expression.","xp":"Para o autorretrato, olhe o seu rosto, cabelo e expressão."},"arb-c1":{"c":"autorretrato-como","e":"Which face looks surprised?","p":"Qual rosto parece surpreso?","x":"Look for the round mouth, like someone saying “Oh!”","xp":"Procure a boca redonda, como quem diz “Oh!”"},"arb-c2":{"c":"autorretrato-como","e":"Match what you look at to an example.","p":"Ligue o que você observa a um exemplo.","x":"Look at your face, your hair and your expression.","xp":"Observe o seu rosto, o seu cabelo e a sua expressão."},"arb-c3":{"c":"autorretrato-como","e":"What helps you show who you are in a self-portrait?","p":"O que ajuda a mostrar quem você é no autorretrato?","x":"lines, shapes and colours — The guide says: show who you are with lines, shapes and colours.","xp":"linhas, formas e cores — O guia diz: mostre quem você é com linhas, formas e cores."},"arb-c4":{"c":"autorretrato-como","e":"What if your hair is curly? How do you draw it?","p":"E se o seu cabelo for cacheado? Como desenhar?","x":"with curly lines — Look at your hair and draw what you see: curly hair, curly lines.","xp":"com linhas curvas — Olhe o seu cabelo e desenhe o que vê: cabelo cacheado, linhas curvas."},"arb-c5":{"c":"autorretrato-como","e":"I look at myself. I draw my face and hair. I copy my friend's expression.","p":"Eu me observo. Desenho meu rosto e cabelo. Copio a expressão do meu amigo.","x":"It is your self-portrait: show your expression, not a friend's.","xp":"É o seu autorretrato: mostre a sua expressão, não a do amigo."},"arg-blk-zentangle":{"c":"zentangle","e":"Does it repeat? Put each drawing in the right box.","p":"Ele se repete? Coloque cada desenho na caixa certa.","x":"A pattern repeats the same line or shape.","xp":"Um padrão repete a mesma linha ou forma."},"arg-blk-zentangle-v":{"c":"zentangle","e":"A Zentangle drawing is made of…","p":"Um desenho Zentangle é feito de…","x":"repeated patterns — Zentangle uses patterns that repeat.","xp":"padrões repetidos — O Zentangle usa padrões que se repetem."},"arg-blk-ztfill":{"c":"padroes","e":"Which heart is filled with different patterns?","p":"Qual coração está cheio de padrões diferentes?","x":"Look at each part. Only one heart has a different pattern in each part.","xp":"Olhe cada parte. Só um coração tem um padrão diferente em cada parte."},"arg-blk-ztfill-v":{"c":"padroes","e":"How many different patterns are in this heart?","p":"Quantos padrões diferentes há neste coração?","x":"1 — All three parts have dots: that is only 1 pattern.","xp":"1 — As três partes têm bolinhas: é só 1 padrão."},"arg-blk-okeeffe":{"c":"okeeffe","e":"Which painting is like O'Keeffe's flowers?","p":"Qual pintura parece as flores de O'Keeffe?","x":"O'Keeffe painted flowers very big, up close, filling the page.","xp":"O'Keeffe pintava flores bem grandes, de perto, enchendo a folha."},"arg-blk-okeeffe-v":{"c":"okeeffe","e":"Georgia O'Keeffe is famous for painting…","p":"Georgia O'Keeffe é famosa por pintar…","x":"big flowers up close — Her famous paintings show big flowers, up close.","xp":"flores grandes de perto — As pinturas famosas dela mostram flores grandes, de perto."},"arg-blk-okstyle":{"c":"okeeffe-estilo","e":"Which flower has strong colours?","p":"Qual flor tem cores fortes?","x":"Strong colours are bright. Pale grey or no colour is not strong.","xp":"Cores fortes são vivas. Cinza clarinho ou sem cor não é forte."},"arg-blk-okstyle-v":{"c":"okeeffe-estilo","e":"O'Keeffe used simple shapes and strong colours.","p":"O'Keeffe usava formas simples e cores fortes.","x":"It is true: simple shapes and strong colours, inspired by nature.","xp":"É verdade: formas simples e cores fortes, inspiradas na natureza."},"arg-blk-landscape":{"c":"paisagem","e":"Tap the river in this landscape.","p":"Toque no rio nesta paisagem.","x":"","xp":""},"arg-blk-landscape-v":{"c":"paisagem","e":"Tap the mountain in the landscape.","p":"Toque na montanha da paisagem.","x":"Look for the high shape behind the river.","xp":"Procure a forma alta atrás do rio."},"arg-blk-self":{"c":"autorretrato","e":"Which picture could be a self-portrait?","p":"Qual desenho pode ser um autorretrato?","x":"A self-portrait shows the artist. Buildings or fruit are not a person.","xp":"O autorretrato mostra o artista. Prédios ou frutas não são uma pessoa."},"arg-blk-self-v":{"c":"autorretrato","e":"A self-portrait is a picture of yourself, made by you.","p":"O autorretrato é um desenho de você mesmo, feito por você.","x":"It is true: you are the artist and the model.","xp":"É verdade: você é o artista e o modelo."},"arg-blk-selfhow":{"c":"autorretrato-como","e":"Which face shows a happy expression?","p":"Qual rosto mostra uma expressão feliz?","x":"Look at the mouth: a smile is happy.","xp":"Olhe a boca: o sorriso é feliz."},"arg-blk-selfhow-v":{"c":"autorretrato-como","e":"Which face shows a surprised expression?","p":"Qual rosto un termina diferente. A lua também fica no céu."},"g-r1-3":{"c":"noun","e":"What is the rule?","p":"Qual é a regra?","x":"An animal, a place, a person and a thing: all nouns.","xp":"Um animal, um lugar, uma pessoa e uma coisa: todos nouns."},"g-r1-4":{"c":"adjective","e":"In \"the tall tree\", tall is a noun.","p":"In \"the tall tree\", tall is a noun.","x":"Tree is the noun. Tall describes the tree: an adjective.","xp":"Tree é o noun. Tall descreve a árvore: um adjective."},"g-r1-5":{"c":"verb","e":"What if your line needs a verb? The frog? on a log.","p":"E se a sua linha precisar de um verb? The frog? on a log.","x":"jumps — A verb is an action: jumps. Green describes. Pond is a place.","xp":"jumps — O verb é uma ação: jumps. Green descreve. Pond é um lugar."},"g-r2-1":{"c":"haiku","e":"What kind of poem is this?","p":"Que tipo de poema é este?","x":"haiku — It has 3 lines: 5, 7 and 5 syllables. That is a haiku.","xp":"haiku — Tem 3 linhas: 5, 7 e 5 sílabas. Isso é um haiku."},"g-r2-2":{"c":"rhyming-poem","e":"What is the rhyme scheme?","p":"Qual é o esquema de rimas?","x":"Cat and mat rhyme: AA. Frog and log rhyme: BB.","xp":"Cat e mat rimam: AA. Frog e log rimam: BB."},"g-r2-3":{"c":"haiku","e":"Build line 1 of a haiku: 5 syllables. Look at the hints.","p":"Monte a linha 1 de um haiku: 5 sílabas. Olhe as dicas.","x":"","xp":""},"g-r2-4":{"c":"cinquain","e":"","p":"","x":"A cinquain goes 2-4-6-8 and ends with 2 syllables.","xp":"O cinquain vai 2-4-6-8 e termina com 2 sílabas."},"g-r2-5":{"c":"list-poem","e":"What if you want to name all your favorite toys? Which poem fits?","p":"E se você quiser falar todos os seus brinquedos preferidos? Que poema combina?","x":"a list poem — Many things one after the other make a list poem.","xp":"a list poem — Muitas coisas, uma depois da outra, formam um list poem."},"g-r3-1":{"c":"livro-sabertooth","e":"What time in Earth’s past do Jack and Annie visit?","p":"Que época do passado da Terra Jack e Annie visitam?","x":"the Ice d 2 in the second. 4 lines.","xp":"4 — Conte cada fileira de palavras: 2 na primeira estrofe e 2 na segunda. 4 linhas."},"ag4":{"c":"partes-poema","e":"A line in a poem is one row of words.","p":"A line in a poem is one row of words.","x":"True: each row of words in a poem is a line.","xp":"Verdade: cada fileira de palavras do poema é uma linha (verso)."},"ag5":{"c":"partes-poema","e":"Match each part of a poem to what it is.","p":"Ligue cada parte do poema ao que ela é.","x":"Line: one row. Stanza: a group of lines. Rhyme: same end sound. Rhythm: the beat.","xp":"Line: uma fileira. Stanza: grupo de linhas. Rhyme: mesmo som no fim. Rhythm: a batida."},"ag6":{"c":"partes-poema","e":"A stanza is one row of words.","p":"A stanza is one row of words.","x":"One row of words is a line. A stanza is a group of lines.","xp":"Uma fileira de palavras é uma line (linha). A stanza (estrofe) é um grupo de linhas."},"ag7":{"c":"partes-poema","e":"We clap the beat when we read a poem. What is the beat called?","p":"Batemos palmas na batida do poema. Como se chama a batida?","x":"rhythm — The beat you can clap is the rhythm. Rhyme is the same end sound.","xp":"rhythm — A batida que dá para bater palma é o rhythm (ritmo). Rhyme é o mesmo som no fim."},"ag8":{"c":"rima","e":"Tap the picture that rhymes with moon.","p":"Toque na figura que rima com moon.","x":"spoon — Say them: moon, spoon. They end with the same sound.","xp":"spoon — Fale as duas: moon, spoon. Terminam com o mesmo som."},"ag9":{"c":"rima","e":"Which word rhymes with frog?","p":"Qual palavra rima com frog?","x":"log — Rhymes end with the same sound: frog, log. \"From\" only starts the same.","xp":"log — A rima é no fim: frog, log. \"From\" só começa igual."},"ag10":{"c":"rima","e":"Rhymes with cat or with sun? Put each word in its box.","p":"Rima com cat ou com sun? Coloque cada palavra na caixa.","x":"Listen to the end: hat, mat, bat rhyme with cat. Run, fun, bun rhyme with sun.","xp":"Escute o fim: hat, mat, bat rimam com cat. Run, fun, bun rimam com sun."},"ag11":{"c":"rima","e":"Tap the word that does not rhyme.","p":"Toque na palavra que não rima.","x":"Cake, lake, snake end the same. Cup ends differently. Cake starts with C too.","xp":"Cake, lake, snake terminam igual. Cup termina diferente. Cake também começa com C."},"ag12":{"c":"rima","e":"Why do cat and hat rhyme?","p":"Por que cat e hat rimam?","x":"They end with the same sound. — Rhyming words end with the same sound: cat, hat.","xp":"They end with the same sound. — Palavras que rimam terminam com o mesmo som: cat, hat."},"ag13":{"c":"rima","e":"Which word rhymes with bug?","p":"Qual palavra rima com bug?","x":"rug — In a rhyming poem the end words rhyme: bug, rug.","xp":"rug — No poema com rima, as palavras do fim rimam: bug, rug."},"ag14":{"c":"noun","e":"Which word is a noun?","p":"Qual palavra é um noun (substantivo)?","x":"dog — A noun names a person, an animal, a place or a thing. Jump is an action. Happy describes.","xp":"dog — O noun dá nome a pessoa, animal, lugar ou coisa. Jump é ação. Happy descreve."},"ag15":{"c":"noun","e":"The ___ is in the tree.","p":"The ___ is in the tree.","x":"We need a noun here: who is in the tree? A bird.","xp":"Aqui precisa de um noun: quem está na árvore? Um passarinho."},"ag16":{"c":"noun","e":"A noun names a person, an animal, a place or a thing.","p":"A noun names a person, an animal, a place or a thing.","x":"True: teacher, cat, school and ball are all nouns.","xp":"Verdade: teacher, cat, school e ball são todos nouns."},"ag17":{"c":"noun","e":"Tap the word that is not a noun.","p":"Toque na palavra que não é noun.","x":"School, tree and teacher are nouns. Run is an action: a verb.","xp":"School, tree e teacher são nouns. Run é ação: um verbo."},"ag18":{"c":"noun","e":"In \"The cat sleeps\", the noun is sleeps.","p":"In \"The cat sleeps\", the noun is sleeps.","x":"Cat names an animal: noun. Sleeps is what it does: verb.","xp":"Cat dá nome a um animal: noun. Sleeps é o que ele faz: verbo."},"ag19":{"c":"verb","e":"Which word is a verb, an action word?","p":"Qual palavra é um verb (verbo), uma palavra de ação?","x":"swim — A verb tells an action: swim. Fish is a noun. Blue is an adjective.","xp":"swim — O verb diz uma ação: swim. Fish é noun. Blue é adjective."},"ag20":{"c":"verb","e":"Birds ___ in the sky.","p":"Birds ___ in the sky.","x":"What do birds do? They fly. We need a verb.","xp":"O que os pássaros fazem? Voam. Aqui precisa de um verb."},"ag21":{"c":"verb","e":"What is the rule?","p":"Qual é a regra?","x":"Jump, swim, climb, kick: you can do them. They are verbs.","xp":"Jump, swim, climb, kick: dá para fazer. São verbs."},"ag22":{"c":"verb","e":"Why is run a verb?","p":"Por que run é um verbo?","x":"It tells an action. — A verb tells what someone does. You can run!","xp":"It tells an action. — O verbo diz o que alguém faz. Dá para correr!"},"ag23":{"c":"adjective","e":"Which word describes the elephant?","p":"Qual palavra descreve o elefante?","x":"big — Big tells how the elephant is: an adjective. Eat is a verb. Zoo is a noun.","xp":"big — Big diz como o elefante é: adjective. Eat é verbo. Zoo é noun."},"ag24":{"c":"adjective","e":"Which word is an adjective? It describes a noun.","p":"Qual palavra é um adjective (adjetivo)? Ele descreve o noun.","x":"soft — An adjective tells how something is: soft, big, red. Sleep is a verb. Table is a noun.","xp":"soft — O adjective diz como a coisa é: soft, big, red. Sleep é verbo. Table é noun."},"ag25":{"c":"adjective","e":"I have a ___ ball.","p":"I have a ___ ball.","x":"How is the ball? Red. An adjective describes the noun.","xp":"Como é a bola? Red. O adjective descreve o noun."},"ag26":{"c":"adjective","e":"Tap the word that is not an adjective.","p":"Toque na palavra que não é adjective.","x":"Happy, tall and green describe. Table names a thing: a noun.","xp":"Happy, tall e green descrevem. Table dá nome a uma coisa: noun."},"ag27":{"c":"adjective","e":"In \"the cold snow\", the adjective is snow.","p":"In \"the cold snow\", the adjective is snow.","x":"Snow is the noun. Cold tells how the snow is: the adjective.","xp":"Snow é o noun. Cold diz como é a neve: o adjective."},"ag28":{"c":"haiku","e":"How many lines does a haiku have?","p":"Quantas linhas tem um haiku?","x":"3 — A haiku is a short poem with 3 lines: 5, 7 and 5 syllables.","xp":"3 — O haiku é um poema curto de 3 linhas: 5, 7 e 5 sílabas."},"ag29":{"c":"haiku","e":"A haiku is 5-7-5. How many syllables in the middle line?","p":"O haiku é 5-7-5. Quantas sílabas tem a linha do meio?","x":"7 — 5-7-5: line 1 has 5, line 2 has 7, line 3 has 5.","xp":"7 — 5-7-5: a linha 1 tem 5, a linha 2 tem 7, a linha 3 tem 5."},"ag30":{"c":"haiku","e":"What kind of poem is this?","p":"Que tipo de poema é este?","x":"haiku — Count: 3 lines with 5, 7 and 5 syllables. That is a haiku.","xp":"haiku — Conte: 3 linhas com 5, 7 e 5 sílabas. Isso é um haiku."},"ag31":{"c":"haiku","e":"A haiku has 5 lines: 5-7-5.","p":"A haiku has 5 lines: 5-7-5.","x":"5-7-5 is three numbers: 3 lines. The poem with 5 lines is the cinquain.","xp":"5-7-5 são três números: 3 linhas. O poema de 5 linhas é o cinquain."},"ag32":{"c":"haiku","e":"What if line 1 of your haiku has 6 syllables? What do you do?","p":"E se a linha 1 do seu haiku tiver 6 sílabas? O que você faz?","x":"Change it to 5 syllables. — A haiku is 5-7-5. Clap line 1 and fix it to 5 syllables.","xp":"Change it to 5 syllables. — O haiku é 5-7-5. Bata palmas na linha 1 e deixe com 5 sílabas."},"ag33":{"c":"haiku","e":"Which line has 5 syllables for line 1 of a haiku?","p":"Qual linha tem 5 sílabas para começar um haiku?","x":"Small birds cross the sky — Clap it: Small / birds / cross / the / sky = 5. The other long line has 7.","xp":"Small birds cross the sky — Bata palmas: Small / birds / cross / the / sky = 5. A outra linha longa tem 7."},"ag34":{"c":"cinquain","e":"How many lines does a cinquain have?","p":"Quantas linhas tem um cinquain?","x":"5 — A cinquain has 5 lines: 2, 4, 6, 8 and 2 syllables.","xp":"5 — O cinquain tem 5 linhas: 2, 4, 6, 8 e 2 sílabas."},"ag35":{"c":"cinquain","e":"How many syllables end a cinquain?","p":"Quantas sílabas tem a última linha de um cinquain?","x":"2 — A cinquain grows 2, 4, 6, 8 and ends small again: 2.","xp":"2 — O cinquain cresce 2, 4, 6, 8 e termina pequeno de novo: 2."},"ag36":{"c":"cinquain","e":"What kind of poem is this?","p":"Que tipo de poema é este?","x":"cinquain — It has 5 lines: Ocean (2)... Splashing (2). That is a cinquain.","xp":"cinquain — Tem 5 linhas: Ocean (2)... Splashing (2). Isso é um cinquain."},"ag37":{"c":"cinquain","e":"Why is Ocean a good first line for a cinquain?","p":"Por que Ocean é uma boa primeira linha de cinquain?","x":"It has 2 syllables. — Line 1 of a cinquain has 2 syllables: O / cean.","xp":"It has 2 syllables. — A linha 1 do cinquain tem 2 sílabas: O / cean."},"ag38":{"c":"cinquain","e":"The last line of a cinquain has 2 syllables.","p":"The last line of a cinquain has 2 syllables.","x":"True: 2-4-6-8-2. The first and last lines are short.","xp":"Verdade: 2-4-6-8-2. A primeira e a última linha são curtas."},"ag39":{"c":"list-poem","e":"A list poem is a poem...","p":"Um list poem é um poema...","x":"in the form of a list — A list poem names things one after the other, like a list.","xp":"in the form of a list — O list poem fala uma coisa depois da outra, como uma lista."},"ag40":{"c":"list-poem","e":"What kind of poem is this?","p":"Que tipo de poema é este?","x":"list poem — It names things one by one: pencil, ruler, snack... It is a list poem.","xp":"list poem — Ele fala uma coisa por vez: pencil, ruler, snack... É um list poem."},"ag41":{"c":"list-poem","e":"What if you write all the things in your school bag? Which poem fits?","p":"E se você escrever tudo o que tem na mochila? Que poema combina?","x":"a list poem — Many things one after the other make a list: a list poem.","xp":"a list poem — Muitas coisas uma depois da outra formam uma lista: list poem."},"ag42":{"c":"list-poem","e":"A list poem names many things, one after the other.","p":"A list poem names many things, one after the other.","x":"True: a list poem is a poem in the form of a list.","xp":"Verdade: o list poem é um poema em forma de lista."},"ag43":{"c":"rhyming-poem","e":"Lines 1 and 2 rhyme. Lines 3 and 4 rhyme. What is the rhyme scheme?","p":"Linhas 1 e 2 rimam. Linhas 3 e 4 rimam. Qual é o rhyme scheme?","x":"AABB — Same letter = same rhyme. 1 and 2 rhyme (AA), 3 and 4 rhyme (BB).","xp":"AABB — Letra igual = mesma rima. 1 e 2 rimam (AA), 3 e 4 rimam (BB)."},"ag44":{"c":"rhyming-poem","e":"Look at the rhyming words. What is the rhyme scheme?","p":"Olhe as palavras que rimam. Qual é o rhyme scheme?","x":"ABAB — Line 1 (hot) rhymes with line 3 (lot): A. Line 2 (play) rhymes with line 4 (day): B.","xp":"ABAB — A linha 1 (hot) rima com a 3 (lot): A. A 2 (play) rima com a 4 (day): B."},"ag45":{"c":"rhyming-poem","e":"In a rhyming poem, some lines end with words that rhyme.","p":"In a rhyming poem, some lines end with words that rhyme.","x":"True: a rhyming poem has lines that end with the same sound.","xp":"Verdade: o rhyming poem tem linhas que terminam com o mesmo som."},"ag46":{"c":"rhyming-poem","e":"Why is cat, mat, frog, log an AABB rhyme scheme?","p":"Por que cat, mat, frog, log é um esquema AABB?","x":"Cat-mat rhyme, then frog-log rhyme. — Cat and mat rhyme (AA). Frog and log rhyme (BB). Cat does not rhyme with frog.","xp":"Cat-mat rhyme, then frog-log rhyme. — Cat e mat rimam (AA). Frog e log rimam (BB). Cat não rima com frog."},"ag47":{"c":"rhyming-poem","e":"Which word on line 4 rhymes with play?","p":"Qual palavra na linha 4 rima com play?","x":"day — The scheme is ABAB: line 4 rhymes with line 2 (play): day.","xp":"day — O esquema é ABAB: a linha 4 rima com a linha 2 (play): day."},"ag48":{"c":"livro-sabertooth","e":"Who are the two children in Sunset of the Sabertooth?","p":"Quem são as duas crianças de Sunset of the Sabertooth?","x":"Jack and Annie — The two main characters of Magic Tree House books are Jack and Annie.","xp":"Jack and Annie — Os dois personagens principais dos livros Magic Tree House são Jack e Annie."},"ag49":{"c":"livro-sabertooth","e":"Where do Jack and Annie go in this book?","p":"Para onde Jack e Annie vão neste livro?","x":"the Ice Age — A sabertooth lived in the Ice Age. The Moon is the next book: Midnight on the Moon.","xp":"the Ice Age — O dentes-de-sabre vivia na Era do Gelo. A Lua é o próximo livro: Midnight on the Moon."},"ag50":{"c":"livro-sabertooth","e":"Tap what takes Jack and Annie to other times.","p":"Toque no que leva Jack e Annie para outros tempos.","x":"a tree house — The magic tree house takes them to other times and places.","xp":"a tree house — A casa mágica na árvore leva os dois para outros tempos e lugares."},"ag51":{"c":"livro-sabertooth","e":"Sunset of the Sabertooth is a book from which collection?","p":"Sunset of the Sabertooth é um livro de qual coleção?","x":"Magic Tree House — It is a Magic Tree House book. Colour Me a Rhyme is a poem book. Plantzilla is another story.","xp":"Magic Tree House — É um livro da coleção Magic Tree House. Colour Me a Rhyme é de poemas. Plantzilla é outra história."},"ag52":{"c":"livro-sabertooth","e":"Sunset of the Sabertooth is a long book with many chapters.","p":"Sunset of the Sabertooth is a long book with many chapters.","x":"True: in class you read the prologue and chapters 1 to 10, one by one.","xp":"Verdade: na aula vocês leram o prólogo e os capítulos 1 a 10, um por um."},"ag53":{"c":"livro-sabertooth","e":"The story happens in the Ice Age. What was the Ice Age like?","p":"A história acontece na Era do Gelo. Como era a Era do Gelo?","x":"very cold, with snow — The Ice Age was very cold, with snow and ice everywhere.","xp":"very cold, with snow — A Era do Gelo era muito fria, com neve e gelo por toda parte."},"ag54":{"c":"livro-sabertooth","e":"Which card is not from the Ice Age?","p":"Qual cartão não é da Era do Gelo?","x":"Phones are from today. Snow and ice are not animals either, but they were in the Ice Age.","xp":"Telefone é de hoje. Neve e gelo também não são animais, mas existiam na Era do Gelo."},"ag55":{"c":"livro-sabertooth","e":"What if you go to the Ice Age with Jack and Annie? What do you take?","p":"E se você for à Era do Gelo com Jack e Annie? O que você leva?","x":"a warm coat — The Ice Age was very cold. We need warm clothes.","xp":"a warm coat — A Era do Gelo era muito fria. Precisamos de roupa quente."},"ag56":{"c":"novel","e":"A novel is...","p":"Um novel (romance) é...","x":"a long story with chapters — A novel is a long story, with characters, setting, plot and conflict.","xp":"a long story with chapters — O novel é uma história longa, com personagens, cenário, enredo e conflito."},"ag57":{"c":"novel","e":"Match each part of a novel to its question.","p":"Ligue cada parte do novel à sua pergunta.","x":"Characters: who. Setting: where and when. Plot: what happens. Conflict: the problem.","xp":"Characters: quem. Setting: onde e quando. Plot: o que acontece. Conflict: o problema."},"ag58":{"c":"novel","e":"In Sunset of the Sabertooth, what is the setting?","p":"Em Sunset of the Sabertooth, qual é o setting (cenário)?","x":"the Ice Age — The setting is where and when: the Ice Age. Jack and Annie are the characters.","xp":"the Ice Age — O setting é onde e quando: a Era do Gelo. Jack e Annie são os personagens."},"ag59":{"c":"novel","e":"The ___ is where and when a story happens.","p":"The ___ is where and when a story happens.","x":"Where and when = setting. The problem is the conflict.","xp":"Onde e quando = setting. O problema é o conflict."},"ag60":{"c":"novel","e":"Tap the card that is not a part of a novel.","p":"Toque no cartão que não é parte de um novel.","x":"Characters, setting and plot are parts of a novel. A stanza is a group of lines in a poem.","xp":"Personagens, cenário e enredo são partes do novel. A stanza é um grupo de linhas do poema."},"ag61":{"c":"novel","e":"Why is Sunset of the Sabertooth a novel and not a poem?","p":"Por que Sunset of the Sabertooth é um novel e não um poema?","x":"It is a long story with chapters. — A novel is a long story told in chapters. Poems have lines and stanzas.","xp":"It is a long story with chapters. — O novel é uma história longa contada em capítulos. Poema tem linhas e estrofes."},"ag62":{"c":"novel","e":"The conflict is where the story happens.","p":"The conflict is where the story happens.","x":"Where the story happens is the setting. The conflict is the problem.","xp":"Onde a história acontece é o setting. O conflict é o problema."},"ag63":{"c":"presente","e":"Which word shows it is happening now?","p":"Qual palavra mostra que está acontecendo agora?","x":"jumping — Words with -ing are happening now: jumping. -ed already happened.","xp":"jumping — Palavras com -ing estão acontecendo agora: jumping. -ed já aconteceu."},"ag64":{"c":"presente","e":"Look! The dog is ___ in the garden.","p":"Look! The dog is ___ in the garden.","x":"After \"is\", for something happening now, we use -ing.","xp":"Depois de \"is\", para o que acontece agora, usamos -ing."},"ag65":{"c":"presente","e":"What comes next? paint →?","p":"O que vem agora? paint →?","x":"The rule: add -ing to the base word. paint + ing = painting.","xp":"A regra: colocar -ing na palavra-base. paint + ing = painting."},"ag66":{"c":"presente","e":"Present or past? Put each word in its box.","p":"Presente ou passado? Coloque cada palavra na caixa certa.","x":"Present: the base word (play) or -ing (playing). Past: -ed (played).","xp":"Presente: a palavra-base (play) ou -ing (playing). Passado: -ed (played)."},"ag67":{"c":"presente","e":"Every day I ___ with my dog.","p":"Every day I ___ with my dog.","x":"\"Every day\" is the present: the base word, play. \"I playing\" is not right.","xp":"\"Every day\" (todo dia) é presente: a palavra-base, play. \"I playing\" não está certo."},"ag68":{"c":"presente","e":"Look! Annie is climbed the tree.","p":"Look! Annie is climbed the tree.","x":"\"Look!\" means now, so we use -ing: is climbing.","xp":"\"Look!\" é agora, então usamos -ing: is climbing."},"ag69":{"c":"passado","e":"Which word shows it already happened?","p":"Qual palavra mostra que já aconteceu?","x":"helped — Words with -ed already happened: helped.","xp":"helped — Palavras com -ed já aconteceram: helped."},"ag70":{"c":"passado","e":"Yesterday, I ___ my mom in the kitchen.","p":"Yesterday, I ___ my mom in the kitchen.","x":"\"Yesterday\" already happened: helped.","xp":"\"Yesterday\" (ontem) já aconteceu: helped."},"ag71":{"c":"passado","e":"What comes next? help →?","p":"O que vem agora? help →?","x":"The rule: add -ed when it already happened. help + ed = helped.","xp":"A regra: colocar -ed quando já aconteceu. help + ed = helped."},"ag72":{"c":"passado","e":"We add -ed when the action already happened.","p":"We add -ed when the action already happened.","x":"True: -ed is for things that already happened, like \"jumped\".","xp":"Verdade: -ed é para o que já aconteceu, como \"jumped\" (pulou)."},"ag73":{"c":"passado","e":"Which sentence fits the time clue yesterday?","p":"Qual frase combina com a pista de tempo yesterday (ontem)?","x":"Yesterday I jumped. — \"Yesterday\" is the past: jumped.","xp":"Yesterday I jumped. — \"Yesterday\" (ontem) é passado: jumped."},"ag74":{"c":"passado","e":"Tap the word that does not belong.","p":"Toque na palavra que não pertence.","x":"Played, looked and climbed end in -ed: past. Cooking ends in -ing: now.","xp":"Played, looked e climbed terminam em -ed: passado. Cooking termina em -ing: agora."},"ag75":{"c":"passado","e":"Build the sentence. Grey words are in place. Look at the hints.","p":"Monte a frase. As palavras cinza já estão no lugar. Olhe as dicas.","x":"","xp":""},"final-1":{"c":"haiku","e":"A poem has 3 lines: 5, 7 and 5 syllables. What is it? Why?","p":"Um poema tem 3 linhas: 5, 7 e 5 sílabas. O que ele é? Por q ","p":"Pistas novas! Qual é o objeto misterioso?","x":"a magnifying glass — It makes things look big: a magnifying glass.","xp":"a magnifying glass — Deixa tudo maior: uma lupa."},"r2-regra":{"c":"pistas","e":"What is the rule?","p":"Qual é a regra?","x":"Red, yellow and blue are colors. Size is big or small. Use is \"we use it to...\".","xp":"Vermelho, amarelo e azul são cores. Tamanho é grande ou pequeno. Uso é \"usamos para...\"."},"r2-corrija":{"c":"voltar","e":"i would go back to the Ice Age.","p":"i would go back to the Ice Age.","x":"The word \"I\" is always a capital letter: I would go back.","xp":"A palavra \"I\" é sempre maiúscula: I would go back."},"rr2q4":{"c":"pistas","e":"Which clue is it? Put each clue in its box: color, size or use.","p":"Que pista é esta? Coloque cada pista na caixa: cor, tamanho ou uso.","x":"Blue, green: color. Small, big: size. \"We use it to...\": use.","xp":"Azul, verde: cor. Pequeno, grande: tamanho. \"Usamos para...\": uso."},"r2-ese":{"c":"voltar","e":"What if you want to see a woolly mammoth? Where do you go back to?","p":"E se você quiser ver um mamute-lanoso? Para onde você volta?","x":"I would go back to the Ice Age. — Mammoths lived in the Ice Age. Beaches and schools of today have none.","xp":"I would go back to the Ice Age. — Mamutes-lanosos viviam na Era do Gelo. Praias e escolas de hoje não têm."},"rr3q1":{"c":"ed-passado","e":"Yesterday, Jack ___ in the snow. Which word fits?","p":"Yesterday, Jack ___ in the snow. Which word fits?","x":"","xp":""},"rr3q1~v":{"c":"ed-passado","e":"Look! The children are ___ in the snow now.","p":"Look! The children are ___ in the snow now.","x":"playing — It is happening now: are playing.","xp":"playing — Está acontecendo agora: are playing."},"r3-regra":{"c":"ing-agora","e":"What comes next? paint →?","p":"O que vem agora? paint →?","x":"The rule: add -ing when it is happening now. paint + ing = painting.","xp":"A regra: colocar -ing quando está acontecendo agora. paint + ing = painting."},"r3-intruso":{"c":"ed-passado","e":"Tap the word that does not belong.","p":"Toque na palavra que não pertence.","x":"Played, looked and climbed end in -ed: already happened. Cooking ends in -ing: now.","xp":"Played, looked e climbed terminam em -ed: já aconteceu. Cooking termina em -ing: agora."},"r3-expl":{"c":"ing-agora","e":"Why do we say \"Look! Annie is climbing\"?","p":"Why do we say \"Look! Annie is climbing\"?","x":"\"Look!\" means now, so we add -ing. — \"Look!\" is about now. What is happening now takes -ing.","xp":"\"Look!\" means now, so we add -ing. — \"Look!\" é sobre o agora. O que acontece agora leva -ing."},"rr3q5":{"c":"ing-agora","e":"Now or already happened? Put each sentence in the right box.","p":"Agora ou já aconteceu? Coloque cada frase na caixa certa.","x":"is/are + -ing: now. -ed: already happened.","xp":"is/are + -ing: agora. -ed: já aconteceu."},"mt1":{"c":"casa","e":"Who are the two children in Magic Tree House books?","p":"Quem são as duas crianças dos livros Magic Tree House?","x":"Jack and Annie — The children are Jack and Annie.","xp":"Jack and Annie — As crianças são Jack e Annie."},"mt2":{"c":"casa","e":"What does the magic tree house do?","p":"O que a casa mágica na árvore faz?","x":"It takes them to other times. — The tree house is magic: it takes them to other times and places.","xp":"It takes them to other times. — A casa é mágica: leva os dois para outros tempos e lugares."},"mt3":{"c":"era-gelo","e":"Where do Jack and Annie go in \"Sunset of the Sabertooth\"?","p":"Where do Jack and Annie go in \"Sunset of the Sabertooth\"?","x":"the Ice Age — Sabertooth tigers lived in the Ice Age.","xp":"the Ice Age — Os tigres-dentes-de-sabre viviam na Era do Gelo."},"mt4":{"c":"era-gelo","e":"How was the weather in the Ice Age?","p":"Como era o tempo na Era do Gelo?","x":"very cold — The Ice Age was very cold, with snow and ice.","xp":"very cold — A Era do Gelo era muito fria, com neve e gelo."},"mt5":{"c":"animais","e":"Which … O plástico demora centenas de anos.","xp":""},"rr3q2":{"c":"consumo","e":"Qual cartão não pertence?","p":"","x":"Sacola de pano, garrafinha e conserto fazem menos lixo. Muitas sacolinhas fazem mais.","xp":""},"rr3q3":{"c":"consumo","e":"Por que a sacola de pano faz menos lixo?","p":"","x":"A gente usa a mesma sacola muitas vezes — A sacola de pano é usada muitas vezes. Assim, sobra menos lixo.","xp":""},"rr3q4":{"c":"tempo","e":"O que demora mais tempo para se desfazer na natureza?","p":"","x":"a garrafa de plástico — Casca e folha somem em semanas. O plástico demora centenas de anos.","xp":""},"rr3q4~v":{"c":"tempo","e":"O que some mais rápido na natureza?","p":"","x":"a casca de fruta — A casca é orgânica e some em poucas semanas.","xp":""},"rr3q5":{"c":"tempo","e":"Monte a frase. As palavras cinza já estão no lugar. Olhe as dicas.","p":"","x":"","xp":""},"l1":{"c":"tipos","e":"Outro nome para lixo é…","p":"","x":"resíduo — Tudo o que sobra e jogamos fora é resíduo.","xp":""},"l2":{"c":"tipos","e":"Qual destes é lixo orgânico?","p":"","x":"casca de laranja — Orgânico vem de plantas e animais, como cascas e restos de comida.","xp":""},"l3":{"c":"tipos","e":"Qual destes é lixo reciclável?","p":"","x":"caixa de papelão — Resto de comida e folha são orgânicos. O papelão é reciclável.","xp":""},"l4":{"c":"tipos","e":"É orgânico ou reciclável? Coloque cada cartão na caixa certa.","p":"","x":"Vem de planta ou animal: orgânico. Papel, plástico, vidro e metal: reciclável.","xp":""},"r1a":{"c":"tipos","e":"Qual destes é lixo orgânico?","p":"","x":"resto de pão — Orgânico vem de planta ou animal, como restos de comida.","xp":""},"r1a-v":{"c":"tipos","e":"Qual destes é lixo reciclável?","p":"","x":"pote de vidro — Casca e folha são orgânicas. O vidro é reciclável.","xp":""},"l22":{"c":"tipos","e":"Qual é o descarte adequado de uma casca de banana na escola?","p":"","x":"Na lixeira marrom, do orgânico — Casca é orgânica: vai na lixeira marrom. Nunca no chão.","xp":""},"l5":{"c":"cores","e":"Ligue cada material à cor da lixeira.","p":"","x":"Azul papel, vermelho plástico, verde vidro, amarelo metal, marrom orgânico.","xp":""},"l6":{"c":"cores","e":"Em qual lixeira vai a garrafa de plástico?","p":"","x":"a lixeira vermelha — Plástico vai na lixeira vermelha.","xp":""},"l7":{"c":"cores","e":"Em qual lixeira vai a lata de refrigerante?","p":"","x":"amarela — A lata é de metal: lixeira amarela.","xp":""},"l8":{"c":"cores","e":"Separar o lixo pelo material é a coleta ___.","p":"","x":"Selecionar e separar: coleta seletiva.","xp":""},"r1c":{"c":"cores","e":"Na coleta seletiva, a lata de metal vai na lixeira amarela.","p":"","x":"Verdade: metal vai no amarelo.","xp":""},"r1e":{"c":"cores","e":"Plástico ou metal? Coloque cada cartão na lixeira certa.","p":"","x":"Garrafa PET e copinho são de plástico: vermelho. Lata e tampinha de metal: amarelo.","xp":""},"l9":{"c":"caminhos","e":"O que é reciclar?","p":"","x":"Transformar o material usado em produto novo — Reciclar é transformar o material usado num produto novo, na fábrica.","xp":""},"l10":{"c":"caminhos","e":"Reciclar, reutilizar ou compostar? Coloque cada cartão na caixa certa.","p":"","x":"Fábrica: reciclar. Usar de novo em casa: reutilizar. Restos viram adubo: compostar.","xp":""},"l23":{"c":"caminhos","e":"Ligue cada palavra ao que ela quer dizer.","p":"","x":"Leia cada palavra e pense no que ela quer dizer.","xp":""},"r2e":{"c":"caminhos","e":"Coloque o caminho da latinha na ordem.","p":"","x":"Primeiro usamos, depois separamos, o caminhão leva e a fábrica recicla.","xp":""},"n1":{"c":"caminhos","e":"Qual cartão não pertence?","p":"","x":"Os três primeiros viram produto novo na fábrica: reciclar. A caixa é usada de novo: reutilizar.","xp":""},"l11":{"c":"composto","e":"Na compostagem, quem ajuda a transformar os restos em adubo?","p":"","x":"as minhocas — Na compostagem, as minhocas e outros bichinhos do solo ajudam.","xp":""},"l12":{"c":"composto","e":"Na compostagem, os restos de comida viram adubo para as plantas.","p":"","x":"É verdade: os restos orgânicos viram adubo.","xp":""},"r2b":{"c":"composto","e":"Na compostagem, os restos de comida viram…","p":"","x":"adubo — Na compostagem, os restos viram adubo, que alimenta as plantas.","xp":""},"n2":{"c":"composto","e":"As cascas de legumes sobraram. Como usar na horta?","p":"","x":"Fazer compostagem e usar o adubo — Casca é orgânica. Na compostagem ela vira adubo para as plantas.","xp":""},"n3":{"c":"composto","e":"E se… alguém puser uma lata na caixa de compostagem?","p":"","x":"Não vira adubo: metal vai na lixeira amarela — Metal não vira adubo. A lata vai na lixeira amarela.","xp":""},"l13":{"c":"aterro","e":"Como é o lixão?","p":"","x":"O lixo fica a céu aberto, sem proteção — No lixão, o lixo fica jogado a céu aberto e suja o solo e a água.","xp":""},"l14":{"c":"aterro","e":"Como é o aterro sanitário?","p":"","x":"Tem manta no solo e o lixo é coberto com terra — O aterro sanitário tem manta no fundo e o lixo é coberto com terra.","xp":""},"l15":{"c":"aterro","e":"Lixão ou aterro sanitário? Coloque cada cartão na caixa certa.","p":"","x":"Lixão: sem cuidado. Aterro sanitário: preparado para proteger o solo e a água.","xp":""},"l16":{"c":"aterro","e":"O lixão é melhor para o meio ambiente do que o aterro sanitário.","p":"","x":"O lixão polui. O aterro sanitário protege o solo e a água.","xp":""},"r2c":{"c":"aterro","e":"No lixão, o lixo fica a céu aberto e pode sujar o solo e a água.","p":"","x":"Verdade: o lixão não tem proteção.","xp":""},"r2d":{"c":"aterro","e":"O que o aterro sanitário tem que o lixão não tem?","p":"","x":"Uma manta que protege o solo — O aterro é preparado: tem manta no fundo e o lixo é coberto com terra.","xp":""},"r2d-v":{"c":"aterro","e":"Qual é o lugar mais seguro para o lixo que não é reciclado?","p":"","x":"o aterro sanitário — O aterro sanitário protege o solo e a água. Lixão e rio ficam sujos.","xp":""},"l17":{"c":"tempo","e":"Quando um material se desfaz na natureza, é a ___.","p":"","x":"Se desfazer na natureza é decomposição.","xp":""},"l18":{"c":"tempo","e":"O que demora mais para se desfazer na natureza?","p":"","x":"garrafa de plástico — A casca some em semanas e o papel em meses. O plástico demora centenas de anos.","xp":""},"l19":{"c":"tempo","e":"Por que o lixo jogado no mar é um problema?","p":"","x":"Machuca os animais e demora muito para sumir — O lixo no mar machuca peixes e tartarugas e fica lá por muitos anos.","xp":""},"r3b":{"c":"tempo","e":"Lixo jogado no mar não faz mal aos peixes.","p":"","x":"Faz mal sim: o lixo no mar machuca os animais e demora muito para sumir.","xp":""},"n4":{"c":"tempo","e":"Olhe a régua do tempo. O que some primeiro?","p":"","x":"a casca de banana — A régua mostra: casca em semanas, papel em meses, plástico em centenas de anos.","xp":""},"n5":{"c":"tempo","e":"O plástico no mar demora poucas semanas para sumir.","p":"","x":"Casca some em semanas. O plástico demora centenas de anos.","xp":""},"l20":{"c":"consumo","e":"O que é consumo consciente?","p":"","x":"Comprar e usar só o que precisamos — Consumo consciente é usar só o que precisa, sem desperdício.","xp":""},"l21":{"c":"consumo","e":"Essa atitude faz menos lixo ou mais lixo? Coloque cada cartão na caixa certa.","p":"","x":"Aproveitar, reutilizar e consertar faz menos lixo.","xp":""},"r3c":{"c":"consumo","e":"Qual atitude é consumo consciente?","p":"","x":"levar sacola de pano ao mercado — Consumo consciente é usar só o que precisa. A sacola de pano é usada muitas vezes.","xp":""},"r3d":{"c":"consumo","e":"Essa atitude faz mais lixo ou menos lixo? Coloque cada cartão na caixa certa.","p":"","x":"Aproveitar e consertar faz menos lixo. Descartar sem pensar faz mais lixo.","xp":""},"n6":{"c":"consumo","e":"Qual ida ao mercado faz menos lixo?","p":"","x":"Sacola de pano e só o que precisa — Sacola de pano e comprar só o necessário são duas formas de fazer menos lixo.","xp":""},"n7":{"c":"consumo","e":"Para fazer menos lixo, eu compro tudo o que vejo.","p":"","x":"Consumo consciente é comprar só o que precisa.","xp":""},"map1":{"c":"bairro-mapa","e":"Um mapa marca lixo perto do rio. O que esse símbolo mostra?","p":"","x":"Um ponto com poluição. — No mapa, o lixo perto do rio marca um ponto com poluição.","xp":""},"map1-variacao":{"c":"bairro-mapa","e":"Uma sacola aparece no bueiro do mapa. Qual lugar o símbolo marca?","p":"","x":"Um local com lixo — A sacola no bueiro mostra descarte fora do lugar.","xp":""},"map2":{"c":"bairro-mapa","e":"O mapa usa verde para local preservado. Onde usar verde?","p":"","x":"Na praça limpa e cuidada. — A praça limpa e cuidada é um exemplo de local preservado.","xp":""},"map2-variacao":{"c":"bairro-mapa","e":"A legenda usa verde para áreas bem cuidadas. Onde usar verde?","p":"","x":"No jardim limpo — O jardim limpo é o local bem cuidado.","xp":""},"map3":{"c":"bairro-mapa","e":"Dois símbolos no mapa têm sentidos diferentes. O que ajuda a entendê-los?","p":"","x":"Uma legenda com significados. — A legenda explica o significado de cada símbolo do mapa.","xp":""},"map3-variacao":{"c":"bairro-mapa","e":"No mapa, o círculo tem uma letra. Onde descobrir seu significado?","p":"","x":"Na legenda — O significado dos símbolos fica na legenda.","xp":""},"col1":{"c":"pesquisa-coleta","e":"Você quer saber o dia da coleta. O que fazer?","p":"","x":"Perguntar a um adulto ou conferir no site da prefeitura. — Consulte a informação do serviço que atende seu bairro.","xp":""},"col1-variacao":{"c":"pesquisa-coleta","e":"O dia informado pela escola é para outra rua. O que você deve conferir?","p":"","x":"O dia da coleta da sua rua — O serviço pode passar em dias diferentes em cada rua.","xp":""},"col2":{"c":"pesquisa-coleta","e":"Um vizinho indica um ponto de coleta. Antes de ir, o que conferir?","p":"","x":"Quais resíduos ele recebe. — Pontos de coleta podem receber materiais diferentes; confira antes.","xp":""},"col2-variacao":{"c":"pesquisa-coleta","e":"Um ponto de coleta recebe
