<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Painel do responsável: o que a criança estudou no portal, provas e roteiro da escola.">
<style>
/* ---------- painel do responsável: base (cores do portal, claro e escuro) ---------- */
:root{
  --bg:#E4F2F6;--surface:#FFFFFF;--surface-2:#F2F8FA;--ink:#16304A;--muted:#4E6577;--line:#C9DDE5;
  --sea:#1C8DA3;--sea-2:#9FD3DE;--sun:#FFB627;--coral:#C23D27;--leaf:#2B8F4E;--leaf-soft:#DDF3E3;--coral-soft:#FCE4DF;--hl:#FFE7A8;
  --cal0:#E3ECEF;--cal1:#B5DDE6;--cal2:#7CC3D2;--cal3:#3FA2B7;--cal4:#1C6F82;
  color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1C29;--surface:#172A3B;--surface-2:#1D3447;--ink:#EAF4F8;--muted:#A9BFCC;--line:#2C4559;
  --sea:#4CC0D4;--sea-2:#2A6878;--sun:#FFC24D;--coral:#FF7A66;--leaf:#5BD08A;--leaf-soft:#173B2A;--coral-soft:#3E2220;--hl:#5A4A1C;
  --cal0:#22394C;--cal1:#21566A;--cal2:#2B7D93;--cal3:#3FA6BE;--cal4:#7FD6E6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1C29;--surface:#172A3B;--surface-2:#1D3447;--ink:#EAF4F8;--muted:#A9BFCC;--line:#2C4559;
  --sea:#4CC0D4;--sea-2:#2A6878;--sun:#FFC24D;--coral:#FF7A66;--leaf:#5BD08A;--leaf-soft:#173B2A;--coral-soft:#3E2220;--hl:#5A4A1C;
  --cal0:#22394C;--cal1:#21566A;--cal2:#2B7D93;--cal3:#3FA6BE;--cal4:#7FD6E6;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{line-height:1.2}
code{background:var(--surface-2);border-radius:6px;padding:1px 5px;overflow-wrap:anywhere}
.app{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));min-width:0}

/* ---------- painel do responsável: telas ---------- */
.peq{font-size:14px;color:var(--muted)}
.semdados{color:var(--muted);font-style:italic;margin:4px 0}
.erro{background:var(--coral-soft);border:2px solid var(--coral);border-radius:12px;padding:8px 12px;margin:0}
.ok{background:var(--leaf-soft);border-radius:12px;padding:8px 12px;margin:0}
.aviso{background:var(--hl);border-radius:12px;padding:10px 14px;margin:0;display:grid;gap:6px}
.urg{background:var(--coral-soft);border:2px solid var(--coral);border-radius:12px;padding:10px 14px;margin:0}
.msg{min-height:1.2em;margin:0;font-size:15px}
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bt{min-height:44px;padding:8px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600}
.bt:disabled{opacity:.55;cursor:default}
.bt.prim{background:var(--sea);border-color:var(--sea);color:var(--surface)}
.bt.perigo{border-color:var(--coral);color:var(--coral)}
.bt.larga{width:100%;display:grid;text-align:left;gap:2px}
.lk{display:inline-flex;align-items:center;min-height:44px;font-weight:700;color:var(--sea);text-underline-offset:3px;overflow-wrap:anywhere}
.campo{width:100%;min-height:46px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface);font-size:16px}
.campo.mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.rot{display:grid;gap:4px;font-weight:600;font-size:15px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px;min-width:0;align-content:start;overflow-wrap:anywhere}
.card h3{margin:0;font-size:17px}
.sub-card{background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;min-width:0}
.perigo-box{border-color:var(--coral)}
.sub{margin:6px 0 0;font-weight:700;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.lista{margin:0;padding-left:20px;display:grid;gap:6px}

/* login */
.login{max-width:520px;margin:0 auto;padding-top:24px;display:grid;gap:14px}
.lg-top,.t-tit{display:flex;align-items:center;gap:10px;min-width:0}
.lg-top h1{margin:0;font-size:24px}
.logo{font-size:28px}

/* topo, seletor e abas */
.topo{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:14px 0 6px}
.t-tit h1{margin:0;font-size:22px}
.t-conta{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.t-conta .peq{overflow-wrap:anywhere}
.sel{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.sel-um{margin:4px 0;font-size:17px}
.chip{min-height:44px;border:2px solid var(--line);background:var(--surface);border-radius:22px;padding:6px 14px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--surface)}
.abas{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0}
.aba{min-width:0;min-height:46px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px;font-weight:700;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aba[aria-selected="true"]{background:var(--sea);border-color:var(--sea);color:var(--surface)}
@media (max-width:700px){.abas{grid-template-columns:repeat(3,minmax(0,1fr))}.aba{font-size:14px}}
.conteudo{display:grid;gap:14px;min-width:0;padding-top:6px}
.conteudo:focus{outline:none}

/* números */
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
@media (max-width:420px){.nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
.num{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:2px;min-width:0;align-content:start}
.n-rot{font-size:13px;color:var(--muted);font-weight:600}
.n-val{font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.n-val .semdados{font-size:15px;font-weight:400}
.n-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tend{font-size:16px;color:var(--muted)}
.tend.sobe{color:var(--leaf)}.tend.desce{color:var(--coral)}
.duas{display:grid;gap:14px}
@media (min-width:800px){.duas{grid-template-columns:1fr 1fr}}
.card.bem{border-color:var(--leaf)}
.card.reforco{border-color:var(--coral)}
.card.ia{border-color:var(--sea);background:var(--surface-2)}
.rever{background:var(--hl);border-radius:10px;padding:6px 10px;margin:0}

/* matérias, assuntos, rotina */
.grade-m,.grade-a,.grade-r,.grade-c{display:grid;gap:14px;min-width:0}
@media (min-width:900px){.grade-m,.grade-r,.grade-c{grid-template-columns:1fr 1fr}.grade-a{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:600px) and (max-width:899px){.grade-a{grid-template-columns:1fr 1fr}}
.m-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.nivel{font-size:13px;font-weight:700;border-radius:20px;padding:2px 10px;border:2px solid var(--line)}
.n-otimo{border-color:var(--leaf);color:var(--leaf)}
.n-bom{border-color:var(--sea);color:var(--sea)}
.n-reforco{border-color:var(--coral);color:var(--coral)}
.n-sem_dados{color:var(--muted)}
.card.nv-reforco{border-color:var(--coral)}
.ia-f{background:var(--surface-2);border-radius:12px;padding:8px 12px}
.ia-f ul{margin:2px 0;padding-left:20px}
.barras{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.barras li{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,34%) auto;gap:8px;align-items:center;font-size:14px}
.barras li>span:first-child{overflow-wrap:anywhere}
.med{display:block;height:10px;border-radius:6px;background:var(--cal0);overflow:hidden}
.med>span{display:block;height:100%;background:var(--sea)}
.med.otimo>span{background:var(--leaf)}.med.reforco>span{background:var(--coral)}.med.bom>span{background:var(--sea)}.med.sem_dados>span{background:var(--muted)}
.medalha{font-size:14px}
.emp{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--cal0)}
.emp span{display:block;height:100%}
.e-p,.leg .lp::before{background:var(--leaf)}
.e-i,.leg .li::before{background:var(--sun)}
.e-e,.leg .le::before{background:var(--coral)}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0;font-size:13px;color:var(--muted)}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.erradas{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.erradas li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:14px;border-top:1px solid var(--line);padding-top:6px}
.vezes{font-weight:700;color:var(--coral)}

/* gráficos SVG */
.graf{display:block;width:100%;max-width:560px;height:auto}
.graf.calor{max-width:420px}
.g-grade{stroke:var(--line);stroke-width:1}
.g-eixo{fill:var(--muted);font-size:10px;font-family:system-ui,sans-serif}
.g-linha{fill:none;stroke:var(--sea);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.g-ponto{fill:var(--surface);stroke:var(--sea);stroke-width:2}
.g-barra{fill:var(--sea-2)}
.g-barra.dest{fill:var(--sea)}
.g-cal.n0{fill:var(--cal0)}.g-cal.n1{fill:var(--cal1)}.g-cal.n2{fill:var(--cal2)}.g-cal.n3{fill:var(--cal3)}.g-cal.n4{fill:var(--cal4)}

/* escola */
.itens{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.itens li{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:3px;min-width:0}
.itens li:first-child{border-top:none;padding-top:0}
.itens li.urg{background:var(--coral-soft);border:2px solid var(--coral);border-radius:12px;padding:8px 10px}
.itens li.passou{opacity:.6}
.itens li.acao{border-left:4px solid var(--sun);padding-left:8px}
.i-top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.i-top span{color:var(--muted);font-weight:600;font-size:14px}
.tag{border:2px solid var(--line);border-radius:20px;padding:0 8px}
.tag.pede{background:var(--hl);color:var(--ink)!important}
.agenda{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.agenda li{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:3px;min-width:0;overflow-wrap:anywhere}
.agenda li:first-child{border-top:none;padding-top:0}
.agenda li.ag-urgente{background:var(--coral-soft);border:2px solid var(--coral);border-radius:12px;padding:8px 10px}
.agenda li.ag-importante{border-left:4px solid var(--sun);padding-left:8px}
.tag.selo-urgente{background:var(--coral-soft);border-color:var(--coral);color:var(--ink)!important}
.tag.selo-importante{background:var(--hl);color:var(--ink)!important}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px}

/* configurar */
.cris{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cri{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.cri:first-child{border-top:none;padding-top:0}
.cri-b{font-size:28px}
.cri-n{display:grid}
.cri-bt{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.bichos{display:flex;flex-wrap:wrap;gap:6px}
.bicho{width:48px;height:48px;font-size:26px;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.bicho[aria-pressed="true"]{border-color:var(--sea);background:var(--surface-2);box-shadow:0 0 0 2px var(--sea)}
.duas-c{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.figgrade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:320px}
.figbtn{min-height:52px;font-size:26px;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.figcasas{display:flex;gap:8px}
.figcasa{width:52px;height:52px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;font-size:26px}
.figcasa.cheia{border-style:solid;border-color:var(--sea)}
.figcasa.vez{border-color:var(--sun)}
.passos{padding-left:20px;display:grid;gap:4px}
[hidden]{display:none!important}
/* entrada com e-mail e senha (15/11): duas abas grandes, "Manter conectado" e links-botão */
.lg-card{min-width:0}
.lg-tit{margin:0;font-size:20px}
.lg-abas{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:4px}
.lg-aba{min-height:50px;border:none;border-radius:10px;background:transparent;font-size:17px;font-weight:700;color:var(--muted)}
.lg-aba[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 2px var(--sea)}
.lg-form{display:grid;gap:10px;min-width:0}
.lg-form .rot{min-width:0}
.lg-lembrar{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.lg-lembrar input{width:22px;height:22px;flex:none;margin:0}
.lg-aviso{margin:-6px 0 0}
.lk-bt{justify-self:start;background:none;border:none;padding:8px 2px;min-height:44px;font-size:15px;color:var(--sea);text-decoration:underline;font-weight:600}

</style>

     ["pj:painel:lembrar"]. Do localStorage o painel só usa as chaves "pj:painel:*" (lembrar e o último e-mail, nunca a senha);
     NUNCA lê nem grava "pj:conta" (a sessão do portal da criança, mesma origem). "Sair" apaga as duas. Renovação antes de vencer

/* ================= PAINEL: dados (funções puras, testadas em testes/painel/) =================
   Entrada: as linhas da tabela "respostas" (contrato do plano 2026-11-14-painel-separado-e-dashboard.md:
   {quando, unidade, conceito, pergunta, tipo, nivel, resultado:'primeira'|'irma'|'erro', ms, origem}), as unidades embutidas
   pelo build (id, titulo, materia, periodo, prova, telas, conceitos_nomes, perguntas), o calendário, o progresso sincronizado
   ({"u:<id>": {tasks, medal}, medidas}) e "hoje" (AAAA-MM-DD).
   resumo() devolve tudo o que as telas mostram. Nada é inventado: sem respostas, os campos ficam null/vazios e a tela diz
   "ainda sem dados". Linguagem sobre o conteúdo ("precisa de reforço em <assunto>"), nunca sobre a criança.
   Regras dos insights:
   - "Vai bem em": assunto com 5 respostas ou mais e 80% ou mais de acerto de primeira.
   - "Precisa de reforço em": assunto com 3 respostas ou mais e menos de 60% de primeira, ou um dos que mais voltam (2 erros ou mais);
     os da matéria com prova mais próxima vêm primeiro.
   - Tendência: acerto de primeira dos últimos 7 dias contra os 7 anteriores (só com 5 respostas ou mais em cada).
   - Nível da matéria: menos de 5 respostas → sem dados; ≥ 80% ótimo; ≥ 60% bom; abaixo, precisa de reforço. */
const PD=(()=>{
  const p2=n=>String(n).padStart(2,'0');
  const RES=['primeira','irma','erro'];
  const ISO=/^\d{4}-\d{2}-\d{2}$/;
  const ehObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
  const diaDe=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
  const dData=iso=>{const[y,m,d]=String(iso).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
  const somaDias=(iso,n)=>{const d=dData(iso);return diaDe(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n))};
  const diasEntre=(a,b)=>{const[x,y,z]=a.split('-').map(Number),[i,j,k]=b.split('-').map(Number);return Math.round((Date.UTC(i,j-1,k)-Date.UTC(x,y-1,z))/864e5)};
  function semanaISO(date){const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());d.setDate(d.getDate()+3-(d.getDay()+6)%7);
    const ano=d.getFullYear(),j4=new Date(ano,0,4),n=1+Math.round(((d-j4)/864e5-3+(j4.getDay()+6)%7)/7);return ano+'-W'+p2(n)}
  function normMateria(m){const s=String(m||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    if(/scien|cienc/.test(s))return'science';if(/math|matem/.test(s))return'math';if(/^art|arte/.test(s))return'art';if(/ela|english|ingles/.test(s))return'ela';
    if(/portug/.test(s))return'portugues';if(/hist/.test(s))return'historia';if(/geog/.test(s))return'geografia';return'outra'}
  const NOME_MAT={science:'Science',math:'Math',ela:'ELA',art:'Art',portugues:'Português',historia:'História',geografia:'Geografia',outra:'Outros'};
  const ORDEM_MAT=Object.keys(NOME_MAT);
  const nomeMateria=m=>NOME_MAT[normMateria(m)];
  const taxa=c=>c&&c.n?c.primeira/c.n:null;
  const pct=x=>x==null?null:Math.round(x*100);
  const nova=()=>({n:0,primeira:0,irma:0,erro:0,ms:0,comMs:0});
  const somar=(c,r)=>{c.n++;c[r.resultado]++;if(r.ms!=null){c.ms+=r.ms;c.comMs++}};
  function nivel(c){if(!c||c.n<5)return'sem_dados';const t=pct(taxa(c));return t>=80?'otimo':t>=60?'bom':'reforco'}

  /* linhas válidas, em ordem de tempo; ms fora de 0–10 min vira null (aba esquecida aberta) */
  function normalizar(L){const out=[];if(!Array.isArray(L))return out;
    for(const x of L){if(!ehObj(x)||!RES.includes(x.resultado))continue;const t=Date.parse(x.quando);if(isNaN(t))continue;const d=new Date(t);
      const ms=typeof x.ms==='number'&&isFinite(x.ms)&&x.ms>0&&x.ms<=600000?x.ms:null;
      out.push({t,dia:diaDe(d),hora:d.getHours(),unidade:String(x.unidade||''),conceito:String(x.conceito||''),pergunta:String(x.pergunta||''),
        tipo:String(x.tipo||''),nivel:Number.isInteger(x.nivel)?x.nivel:null,resultado:x.resultado,ms,origem:String(x.origem||'')})}
    out.sort((a,b)=>a.t-b.t);return out}

  /* ---------- unidades, provas e aba da próxima prova (cópia da regra de motor/roteiro/estatisticas.js) ---------- */
  const chaveP=s=>String(s||'').toLowerCase().replace(/[^a-z0-9º]/g,'');
  const isosDe=s=>String(s||'').match(/\d{4}-\d{2}-\d{2}/g)||[];
  function janelaDe(p,cal){const k=chaveP(p),j=((cal||{}).proximos_sem_conteudo||[]).find(x=>x&&x.periodo&&chaveP(x.periodo)===k);if(!j)return null;
    const a=isosDe(j.avaliacoes);return a.length?{ini:a[0],fim:a[a.length-1]}:null}
  const provaDe=(u,cal)=>(u&&ISO.test(u.prova||'')?u.prova:null)||((janelaDe(u&&u.periodo||'Outras',cal)||{}).fim)||null;
  function abaDaProva(us,cal,hoje){const P=new Map();us.forEach(u=>{const p=u.periodo||'Outras',d=provaDe(u,cal)||'9999';if(!P.has(p)||d<P.get(p))P.set(p,d)});
    const prox=us.filter(u=>provaDe(u,cal)&&provaDe(u,cal)>=hoje).sort((a,b)=>provaDe(a,cal).localeCompare(provaDe(b,cal)))[0];
    const ps=[...P.entries()].sort((a,b)=>a[1].localeCompare(b[1])).map(e=>e[0]);
    return prox?(prox.periodo||'Outras'):(ps[ps.length-1]||null)}
  function nomeConceito(u,c){const N=u&&u.conceitos_nomes;if(N&&N[c])return typeof N[c]==='string'?N[c]:(N[c].pt||N[c].en||c);
    const t=String(c||'').replace(/[-_]+/g,' ').trim();return t?t[0].toUpperCase()+t.slice(1):'Sem assunto'}

  /* ---------- o resumo inteiro de uma criança ---------- */
  function resumo(o){o=o||{};
    const hoje=ISO.test(o.hoje||'')?o.hoje:diaDe(new Date());
    const us=Array.isArray(o.unidades)?o.unidades.filter(u=>u&&u.id):[];const U=new Map(us.map(u=>[u.id,u]));
    const cal=o.calendario||{},prog=ehObj(o.progresso)?o.progresso:{};
    const R=normalizar(o.respostas);
    const ini7=somaDias(hoje,-6),ini14=somaDias(hoje,-13);
    const total=nova(),sem=nova(),ant=nova(),porDia={},horas=new Array(24).fill(0);
    const C=new Map(),M=new Map();
    const matDe=r=>{const u=U.get(r.unidade);return normMateria(u?u.materia:'')};
    for(const r of R){somar(total,r);
      const pd=porDia[r.dia]||(porDia[r.dia]=nova());somar(pd,r);horas[r.hora]++;
      if(r.dia>=ini7&&r.dia<=hoje)somar(sem,r);else if(r.dia>=ini14&&r.dia<ini7)somar(ant,r);
      const mk=matDe(r);let m=M.get(mk);if(!m)M.set(mk,m={materia:mk,nome:NOME_MAT[mk],c:nova(),porDia:{},sem:nova(),ant:nova()});
      somar(m.c,r);somar(m.porDia[r.dia]||(m.porDia[r.dia]=nova()),r);
      if(r.dia>=ini7&&r.dia<=hoje)somar(m.sem,r);else if(r.dia>=ini14&&r.dia<ini7)somar(m.ant,r);
      const ck=r.unidade+'|'+r.conceito;let c=C.get(ck);
      if(!c){const u=U.get(r.unidade);C.set(ck,c={chave:ck,unidade:r.unidade,conceito:r.conceito,nome:nomeConceito(u,r.conceito),materia:mk,nomeMateria:NOME_MAT[mk],
        unidadeTitulo:u?u.titulo:'',c:nova(),sem:nova(),ant:nova(),ultimo:null,erradas:new Map()})}
      somar(c.c,r);c.ultimo=r.dia;
      if(r.dia>=ini7&&r.dia<=hoje)somar(c.sem,r);else if(r.dia<ini7)somar(c.ant,r);
      if(r.resultado!=='primeira'&&r.pergunta){const e=c.erradas.get(r.pergunta)||{pergunta:r.pergunta,vezes:0,ultimo:null};e.vezes++;e.ultimo=r.dia;c.erradas.set(r.pergunta,e)}}

    const tend=(a,b)=>{if(a.n<5||b.n<5)return null;const d=Math.round((taxa(a)-taxa(b))*100);return{atual:pct(taxa(a)),anterior:pct(taxa(b)),delta:d,direcao:d>=5?'subiu':d<=-5?'caiu':'estavel'}};
    const diasSem=d=>{let n=0;for(let i=0;i<7;i++)if(porDia[somaDias(d,-i)])n++;return n};
    const minutos=c=>Math.round(c.ms/60000);
    const bloco=c=>({respostas:c.n,primeira:c.primeira,irma:c.irma,erro:c.erro,taxa:pct(taxa(c)),minutos:minutos(c)});
    const ultimoDia=R.length?R[R.length-1].dia:null;

    /* provas: a próxima de cada matéria (unidades da aba; data da missão ou janela da avaliação), e eventos do calendário */
    const aba=us.length?abaDaProva(us,cal,hoje):null;
    const daAba=us.filter(u=>(u.periodo||'Outras')===aba);
    const provaMat={};
    us.forEach(u=>{const d=provaDe(u,cal);if(!d||d<hoje)return;const mk=normMateria(u.materia);if(!provaMat[mk]||d<provaMat[mk])provaMat[mk]=d});
    ((cal.avaliacoes)||[]).forEach(a=>{if(!a||!ISO.test(a.data||'')||a.data<hoje)return;const mk=normMateria(a.materia);if(mk!=='outra'&&(!provaMat[mk]||a.data<provaMat[mk]))provaMat[mk]=a.data});
    const provaInfo=mk=>provaMat[mk]?{data:provaMat[mk],dias:diasEntre(hoje,provaMat[mk])}:null;

    /* missões (telas feitas pelo progresso sincronizado "u:<id>") */
    const missao=u=>{const s=ehObj(prog['u:'+u.id])?prog['u:'+u.id]:{},t=ehObj(s.tasks)?s.tasks:{},ids=Array.isArray(u.telas)?u.telas:[];
      const feitas=ids.filter(id=>ehObj(t[id])&&t[id].done).length;
      return{id:u.id,titulo:u.titulo||u.id,materia:normMateria(u.materia),feitas,total:ids.length,medalha:!!s.medal,iniciada:ids.some(id=>ehObj(t[id])&&(t[id].seen||t[id].done)),prova:provaDe(u,cal)}};
    const missoes=daAba.map(missao);

    /* assuntos */
    const conceitos=[...C.values()].map(c=>{const t=taxa(c.c);
      const erradas=[...c.erradas.values()].sort((a,b)=>b.vezes-a.vezes||String(b.ultimo).localeCompare(String(a.ultimo))).map(e=>{const u=U.get(c.unidade),P=u&&u.perguntas&&u.perguntas[e.pergunta];
        return{pergunta:e.pergunta,vezes:e.vezes,ultimo:e.ultimo,enunciado:P&&P.e?P.e:null,enunciado_pt:P&&P.p?P.p:null}});
      return{chave:c.chave,unidade:c.unidade,unidadeTitulo:c.unidadeTitulo,conceito:c.conceito,nome:c.nome,materia:c.materia,nomeMateria:c.nomeMateria,
        respostas:c.c.n,primeira:c.c.primeira,irma:c.c.irma,erro:c.c.erro,taxa:pct(t),nivel:nivel(c.c),ultimo:c.ultimo,
        voltas:c.c.irma+c.c.erro,tendencia:tend(c.sem,c.ant),erradas,prova:provaInfo(c.materia)}});
    conceitos.sort((a,b)=>(a.taxa==null?2:a.taxa/100)-(b.taxa==null?2:b.taxa/100)||b.respostas-a.respostas);

    const porque=c=>{const L=[`acertou de primeira ${c.primeira} de ${c.respostas} (${c.taxa}%)`];
      if(c.voltas)L.push(`precisou de explicação ou errou ${c.voltas} ${c.voltas===1?'vez':'vezes'}`);
      if(c.prova&&c.prova.dias<=21)L.push(c.prova.dias===0?`a prova de ${c.nomeMateria} é hoje`:c.prova.dias===1?`a prova de ${c.nomeMateria} é amanhã`:`a prova de ${c.nomeMateria} é em ${c.prova.dias} dias`);
      return L};
    const vaiBem=conceitos.filter(c=>c.respostas>=5&&c.taxa>=80).sort((a,b)=>b.taxa-a.taxa||b.respostas-a.respostas).slice(0,6).map(c=>Object.assign({},c,{porque:porque(c)}));
    const maisVoltam=new Set(conceitos.filter(c=>c.voltas>=2).sort((a,b)=>b.voltas-a.voltas).slice(0,3).map(c=>c.chave));
    const reforco=conceitos.filter(c=>(c.respostas>=3&&c.taxa<60)||maisVoltam.has(c.chave)).filter(c=>!(c.respostas>=5&&c.taxa>=80))
      .sort((a,b)=>{const pa=a.prova?a.prova.dias:999,pb=b.prova?b.prova.dias:999;return pa-pb||a.taxa-b.taxa||b.voltas-a.voltas})
      .slice(0,6).map(c=>Object.assign({},c,{porque:porque(c)}));

    /* matérias: as que têm missão na aba ou alguma resposta */
    const mats=new Set([...M.keys(),...daAba.map(u=>normMateria(u.materia))]);
    const ult30=[];for(let i=29;i>=0;i--)ult30.push(somaDias(hoje,-i));
    const materias=[...mats].sort((a,b)=>ORDEM_MAT.indexOf(a)-ORDEM_MAT.indexOf(b)).map(mk=>{const m=M.get(mk)||{c:nova(),porDia:{},sem:nova(),ant:nova()};
      return{materia:mk,nome:NOME_MAT[mk],...bloco(m.c),nivel:nivel(m.c),tendencia:tend(m.sem,m.ant),
        serie:ult30.map(d=>{const x=m.porDia[d];return{dia:d,n:x?x.n:0,taxa:x&&x.n?pct(taxa(x)):null}}),
        conceitos:conceitos.filter(c=>c.materia===mk),missoes:missoes.filter(x=>x.materia===mk),prova:provaInfo(mk)}});

    /* próxima prova e o que estudar para ela */
    let proximaProva=null;
    const pm=Object.entries(provaMat).sort((a,b)=>a[1].localeCompare(b[1]))[0];
    if(pm){const mk=pm[0],dias=diasEntre(hoje,pm[1]);
      const fracos=conceitos.filter(c=>c.materia===mk&&(c.nivel==='reforco'||(c.taxa!=null&&c.taxa<80)));
      const vistos=new Set(conceitos.filter(c=>c.materia===mk).map(c=>c.conceito));
      const naoPraticou=[];daAba.filter(u=>normMateria(u.materia)===mk).forEach(u=>Object.keys(u.conceitos_nomes||{}).forEach(k=>{if(!vistos.has(k))naoPraticou.push(nomeConceito(u,k))}));
      const pend=missoes.filter(x=>x.materia===mk&&!x.medalha);
      proximaProva={materia:mk,nome:NOME_MAT[mk],data:pm[1],dias,
        estudar:fracos.slice(0,5).map(c=>({nome:c.nome,taxa:c.taxa,respostas:c.respostas})),naoPraticou:[...new Set(naoPraticou)].slice(0,8),
        missoesPendentes:pend.map(x=>({titulo:x.titulo,feitas:x.feitas,total:x.total}))}}

    /* rotina: medidas sincronizadas (sessões e minutos por semana ISO; onde parou) */
    const med=ehObj(prog.medidas)?prog.medidas:null;
    const semanas=[];if(med&&ehObj(med.semanas))Object.keys(med.semanas).filter(w=>/^\d{4}-W\d{2}$/.test(w)).sort().forEach(w=>{const x=med.semanas[w];if(!ehObj(x))return;
      semanas.push({semana:w,sessoes:+x.sessoes||0,minutos:Math.round(+x.minutos||0),pararam:Array.isArray(x.pararam)?x.pararam.filter(t=>typeof t==='string').slice(-5):[]})});
    const ondeParou=(()=>{for(let i=semanas.length-1;i>=0;i--)if(semanas[i].pararam.length)return{semana:semanas[i].semana,telas:semanas[i].pararam.slice().reverse()};return null})();
    const ult14=[];for(let i=13;i>=0;i--){const d=somaDias(hoje,-i),x=porDia[d];ult14.push({dia:d,respostas:x?x.n:0,minutos:x?Math.round(x.ms/6000)/10:0})}
    const faixas=[['manhã',6,12],['tarde',12,18],['noite',18,24],['madrugada',0,6]].map(([nome,a,b])=>({nome,respostas:horas.slice(a,b).reduce((s,v)=>s+v,0)}));
    const faixaMais=total.n?faixas.slice().sort((a,b)=>b.respostas-a.respostas)[0].nome:null;

    return{hoje,aba,temDados:R.length>0,
      total:bloco(total),semana:Object.assign(bloco(sem),{dias:diasSem(hoje)}),semanaAnterior:Object.assign(bloco(ant),{dias:diasSem(somaDias(hoje,-7))}),
      tendencia:tend(sem,ant),tempoMedioSeg:total.comMs?Math.round(total.ms/total.comMs/1000):null,
      ultimoDia,diasSemEstudar:ultimoDia?diasEntre(ultimoDia,hoje):null,
      porDia:Object.fromEntries(Object.entries(porDia).map(([d,c])=>[d,c.n])),ult14,horas,faixas,faixaMais,
      conceitos,materias,missoes,missoesFeitas:missoes.filter(x=>x.medalha).length,vaiBem,reforco,proximaProva,
      semanasMedidas:semanas.slice(-8),ondeParou,semanaAtual:semanaISO(dData(hoje))}}

  /* a análise do roteiro (IA) desta criança: pelo id; se não houver, pelo apelido */
  function analiseDe(roteiro,crianca){if(!ehObj(roteiro)||!Array.isArray(roteiro.analise)||!crianca)return null;
    const A=roteiro.analise.filter(ehObj);return A.find(a=>a.crianca_id&&a.crianca_id===crianca.id)||A.find(a=>!a.crianca_id&&typeof a.apelido==='string'&&a.apelido===crianca.apelido)||null}
  /* o roteiro mais recente (lista em qualquer ordem) */
  const roteiroMaisRecente=L=>(Array.isArray(L)?L:[]).filter(x=>x&&ISO.test(x.dia||'')).sort((a,b)=>b.dia.localeCompare(a.dia))[0]||null;

  /* ---------- agenda: provas e prazos por data e importância (calendário embutido + roteiro, se houver) ----------
     urgente = hoje/amanhã ou a escola pede resposta; importante = prova em até 7 dias, prazo/tarefa em 2–7 dias, ou evento avaliativo; o resto é info.
     Só datas de hoje em diante; "Ciências e História" vira uma linha por matéria; comunicado só entra com acao:true (sem data). */
  function agenda(o){o=o||{};const hoje=ISO.test(o.hoje||'')?o.hoje:diaDe(new Date());
    const cal=ehObj(o.calendario)?o.calendario:{},T=ehObj(o.roteiro)&&ehObj(o.roteiro.toddle)&&o.roteiro.toddle.status!=='indisponivel'?o.roteiro.toddle:{};
    const L=v=>Array.isArray(v)?v.filter(ehObj):[],S=v=>typeof v==='string'?v.trim():'';
    const mats=m=>S(m).split(/\s+e\s+|,/).map(s=>s.trim()).filter(Boolean).map(s=>{const k=normMateria(s);return k!=='outra'?NOME_MAT[k]:s});
    const out=[],vistos=new Set(),provas=new Set();
    const por=(x,tipo,data,o_que,materia,fonte,acao,avaliativo)=>{
      if(!o_que||(data==null?tipo!=='comunicado':(!ISO.test(data)||data<hoje)))return;
      const n=data==null?null:diasEntre(hoje,data);
      const imp=acao||(n!=null&&n<=1)?'urgente':(tipo==='prova'&&n!=null&&n<=7)||((tipo==='prazo'||tipo==='tarefa')&&n!=null&&n>=2&&n<=7)||avaliativo?'importante':'info';
      const k=[data,o_que,materia,tipo].join('|');if(vistos.has(k))return;vistos.add(k);
      if(tipo==='prova'&&materia)provas.add(data+'|'+materia);
      else if((tipo==='prazo'||tipo==='tarefa')&&materia&&provas.has(data+'|'+materia))return;/* já é a prova do calendário */
      out.push({data,o_que,materia:materia||null,tipo,importancia:imp,fonte:fonte||null})};
    const evento=(x,tipoPadrao)=>{const ev=S(x.evento)||(S(x.tipo)?'Prova '+S(x.tipo):'');if(!ev||!ISO.test(x.data||''))return;
      const prova=/^prova/i.test(ev)||tipoPadrao==='prova',ms=mats(x.materia);
      const nome=m=>/^prova/i.test(ev)||tipoPadrao==='prova'?`${ev} de ${m}`:ev;
      if(!ms.length)por(x,prova?'prova':'evento',x.data,ev,null,null,false,x.avaliativo===true);
      else ms.forEach(m=>por(x,prova?'prova':'evento',x.data,nome(m),m,null,false,x.avaliativo===true))};
    L(cal.avaliacoes).forEach(x=>evento(x,'prova'));
    L(cal.proximos_sem_conteudo).forEach(x=>evento(x,null));
    const varias=(x,tipo,data)=>{const ms=mats(x.materia);(ms.length?ms:[null]).forEach(m=>por(x,tipo,S(data)||null,S(x.o_que),m,S(x.fonte),false,false))};
    L(T.prazos).forEach(x=>varias(x,'prazo',x.data));
    L(T.tarefas_de_casa).forEach(x=>varias(x,'tarefa',x.entrega));
    L(T.comunicados).concat(L(T.mensagens)).filter(x=>x.acao===true).forEach(x=>por(x,'comunicado',null,S(x.titulo)||S(x.resumo),null,'',true,false));
    const R={urgente:0,importante:1,info:2};
    return out.sort((a,b)=>R[a.importancia]-R[b.importancia]||(a.data||'').localeCompare(b.data||'')||String(a.materia).localeCompare(String(b.materia)))}

  /* ---------- pontos, nível e troféus (chave "conquistas" sincronizada; formato em motor/src/045-conquistas.js) ----------
     total = pontos acumulados; semana = pontos da SEMANA ISO atual (segunda a domingo): o motor guarda os pontos por semana
     (conquistas.semana['AAAA-Www']) e não por dia, então "últimos 7 dias" exatos não existem nos dados; trofeus = {id:'AAAA-MM-DD'}.
     limiteNivel/nivelJogador: cópia exata das funções de 045-conquistas.js (o teste compara com o original). */
  const limiteNivel=n=>100*n*(n+1)/2;
  function nivelJogador(total){total=Math.max(0,Math.floor(+total||0));let n=1;while(total>=limiteNivel(n+1))n++;
    const ini=n===1?0:limiteNivel(n),fim=limiteNivel(n+1);return{nivel:n,faltam:fim-total,pct:Math.floor((total-ini)*100/(fim-ini))}}
  function conquistas(progresso,catalogo,hoje){const c=ehObj(progresso)&&ehObj(progresso.conquistas)?progresso.conquistas:{};
    const num=v=>{v=Math.floor(+v);return isFinite(v)&&v>0?v:0};
    const total=num(c.total),sem=semanaISO(dData(ISO.test(hoje||'')?hoje:diaDe(new Date())));
    const ganhos=ehObj(c.trofeus)?c.trofeus:{},N=nivelJogador(total);
    return{total,semana:ehObj(c.semana)?num(c.semana[sem]):0,nivel:N.nivel,faltam:N.faltam,pct:N.pct,
      trofeus:(Array.isArray(catalogo)?catalogo:[]).filter(t=>ehObj(t)&&typeof t.id==='string').map(t=>({id:t.id,nome:String(t.nome||t.id),ganho:Object.prototype.hasOwnProperty.call(ganhos,t.id)&&!!ganhos[t.id]}))}}

  return{resumo,agenda,conquistas,nivelJogador,normalizar,analiseDe,roteiroMaisRecente,normMateria,nomeMateria,NOME_MAT,nivel,somaDias,diasEntre,semanaISO}})();
if(typeof module!=='undefined'&&module.exports)module.exports=PD;

/* ================= PAINEL: gráficos em SVG feitos à mão (sem biblioteca) =================
   Cada função devolve HTML pronto (com aria-label que diz os números). Sem dados: "Ainda sem dados." (nunca inventa).
   As cores vêm das variáveis do CSS (claro e escuro). */
const G=(()=>{
  const SEM='<p class="semdados">Ainda sem dados.</p>';
  const dm=iso=>`${iso.slice(8,10)}/${iso.slice(5,7)}`;
  /* linha de 0 a 100% (pontos sem valor ficam de fora; a linha não liga por cima deles) */
  function linha(pts,o){o=o||{};const ok=pts.filter(p=>p.v!=null);if(!ok.length)return SEM;
    const W=320,H=150,L=30,Rt=8,T=10,B=24,w=W-L-Rt,h=H-T-B,n=pts.length;
    const x=i=>L+(n<=1?w/2:i*w/(n-1)),y=v=>T+h-(v/100)*h;
    let d='',seg=false;pts.forEach((p,i)=>{if(p.v==null){seg=false;return}d+=(seg?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)+' ';seg=true});
    const grade=[0,50,100].map(v=>`<line class="g-grade" x1="${L}" x2="${W-Rt}" y1="${y(v)}" y2="${y(v)}"/><text class="g-eixo" x="${L-4}" y="${y(v)+4}" text-anchor="end">${v}%</text>`).join('');
    const marcas=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text class="g-eixo" x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${pts[i].rot}</text>`).join('');
    const pontos=pts.map((p,i)=>p.v==null?'':`<circle class="g-ponto" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.2"><title>${p.rot}: ${p.v}%${p.n!=null?` (${p.n} respostas)`:''}</title></circle>`).join('');
    const ultimo=ok[ok.length-1];
    return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.rotulo||'Acerto de primeira por dia'}: último valor ${ultimo.v}% em ${ultimo.rot}">${grade}<path class="g-linha" d="${d}"/>${pontos}${marcas}</svg>`}
  /* barras verticais com rótulo embaixo (mostra só alguns rótulos quando são muitos) */
  function barras(itens,o){o=o||{};if(!itens.length||!itens.some(i=>i.v>0))return SEM;
    const W=320,H=150,L=8,Rt=8,T=16,B=24,w=W-L-Rt,h=H-T-B,n=itens.length,max=Math.max(...itens.map(i=>i.v)),bw=w/n;
    const passo=n>16?Math.ceil(n/7):n>8?2:1;
    const corpo=itens.map((it,i)=>{const bh=max?it.v/max*h:0,x=L+i*bw+bw*0.15,yy=T+h-bh;
      return `<rect class="g-barra${it.destaque?' dest':''}" x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${Math.max(bh,it.v>0?1.5:0).toFixed(1)}" rx="2"><title>${it.rot}: ${o.fmt?o.fmt(it.v):it.v}</title></rect>`+
        (i%passo===0||i===n-1?`<text class="g-eixo" x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${it.rot}</text>`:'')}).join('');
    const topo=`<text class="g-eixo" x="${L}" y="11">máx. ${o.fmt?o.fmt(max):max}</text>`;
    return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.rotulo||'Barras'}: máximo ${o.fmt?o.fmt(max):max}">${topo}${corpo}</svg>`}
  /* calendário de calor: colunas = semanas (segunda a domingo), linhas = dias; cor pela quantidade de respostas */
  function calor(porDia,hoje,semanas){semanas=semanas||8;const vals=Object.values(porDia||{});
    const d0=PD.somaDias(hoje,-((new Date(+hoje.slice(0,4),+hoje.slice(5,7)-1,+hoje.slice(8,10)).getDay()+6)%7)-7*(semanas-1));
    const cel=13,gap=3,L=24,T=16,W=L+semanas*(cel+gap),H=T+7*(cel+gap);
    const max=Math.max(1,...vals);let estudou=0;
    let r='';for(let s=0;s<semanas;s++)for(let k=0;k<7;k++){const d=PD.somaDias(d0,s*7+k);if(d>hoje)continue;const v=(porDia||{})[d]||0;if(v)estudou++;
      const nv=v===0?0:v<=max*0.25?1:v<=max*0.5?2:v<=max*0.75?3:4;
      r+=`<rect class="g-cal n${nv}" x="${L+s*(cel+gap)}" y="${T+k*(cel+gap)}" width="${cel}" height="${cel}" rx="3"><title>${dm(d)}: ${v} ${v===1?'resposta':'respostas'}</title></rect>`}
    const dias=['seg','','qua','','sex','','dom'].map((t,k)=>t?`<text class="g-eixo" x="0" y="${T+k*(cel+gap)+10}">${t}</text>`:'').join('');
    const meses=[0,semanas-1].map(s=>`<text class="g-eixo" x="${L+s*(cel+gap)}" y="11">${dm(PD.somaDias(d0,s*7))}</text>`).join('');
    return `<svg class="graf calor" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dias estudados nas últimas ${semanas} semanas: ${estudou} dias">${dias}${meses}${r}</svg>`}
  /* barra 100% com primeira / depois da explicação / erro (HTML, cabe em qualquer largura) */
  function empilhada(p,i,e){const n=p+i+e;if(!n)return SEM;const w=v=>(v/n*100).toFixed(1)+'%';
    return `<div class="emp" role="img" aria-label="De primeira ${p}, depois da explicação ${i}, erro ${e}"><span class="e-p" style="width:${w(p)}"></span><span class="e-i" style="width:${w(i)}"></span><span class="e-e" style="width:${w(e)}"></span></div>
      <p class="leg"><span class="lp">De primeira ${p}</span><span class="li">Com explicação ${i}</span><span class="le">Erro ${e}</span></p>`}
  /* barrinha de 0 a 100% (assuntos) */
  const medidor=(v,cls)=>v==null?'<span class="med vazio" aria-hidden="true"></span>':`<span class="med ${cls||''}" aria-hidden="true"><span style="width:${Math.max(0,Math.min(100,v))}%"></span></span>`;
  return{linha,barras,calor,empilhada,medidor,SEM,dm}})();

/* ================= PAINEL: telas do dashboard =================
   Topo: título, e-mail da conta e "Sair"; seletor de criança (2 ou mais); abas Visão geral, Matérias, Assuntos, Rotina, Escola, Configurar.
   Os dados de cada criança (progresso + respostas dos últimos 60 dias) são buscados uma vez por aba aberta e ficam só na memória
   desta página, separados por criança (nada de uma aparece na outra). Todo texto do servidor, do Toddle e das unidades passa por esc(). */
const ABAS=[['geral','Visão geral'],['materias','Matérias'],['assuntos','Assuntos'],['rotina','Rotina'],['escola','Escola'],['config','Configurar']];
const NIVEL_TXT={otimo:'Ótimo',bom:'Bom',reforco:'Precisa de reforço',sem_dados:'Sem dados suficientes'};

const ST={criancas:null,erroCriancas:false,atual:null,aba:'geral',dados:{},roteiros:null,roteirosErro:false,assuntoMat:'todas',escolaDia:null,vez:0};
const dm=iso=>/^\d{4}-\d{2}-\d{2}$/.test(iso||'')?`${iso.slice(8,10)}/${iso.slice(5,7)}`:'';
const SEMANA=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const diaSem=iso=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return'';const[y,m,d]=iso.split('-').map(Number);return `${SEMANA[new Date(y,m-1,d).getDay()]}, ${dm(iso)}`};
const emDias=n=>n==null?'':n===0?'hoje':n===1?'amanhã':`em ${n} dias`;

const objs=v=>Array.isArray(v)?v.filter(x=>x&&typeof x==='object'&&!Array.isArray(x)):[];

function zerar(){ST.criancas=null;ST.atual=null;ST.dados={};ST.roteiros=null;ST.roteirosErro=false;ST.erroCriancas=false;ST.escolaDia=null;ST.aba='geral';ST.vez++}

async function carregarTudo(){const vez=++ST.vez;

const ISO_D=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
const dDias=(a,b)=>PD.diasEntre(a,b);
function quando(iso,ref){if(!ISO_D(iso))return'Sem data';const n=dDias(ref,iso);return n===0?'Hoje':n===1?'Amanhã':n===-1?'Ontem':n>1?`Em ${n} dias`:'Já passou'}
function horaDe(t){const d=new Date(t);return typeof t==='string'&&!isNaN(d)?`${p2(d.getHours())}:${p2(d.getMinutes())}`:''}
const matNome=m=>{m=txt(m);if(!m)return'';const k=PD.normMateria(m);return k!=='outra'?PD.NOME_MAT[k]:m};
function roteiroHTML(r,o){o=o||{};const ref=o.ref,T=r.toddle&&typeof r.toddle==='object'&&!Array.isArray(r.toddle)?r.toddle:{},ind=T.status==='indisponivel';
  const ger=horaDe(r.gerado_em);
  let h=`<p class="peq">Roteiro de <b>${esc(diaSem(r.dia))}</b>${ger?`, gerado às ${ger}`:''}.</p>`;
  if(ind)return h+`<div class="aviso" role="status"><p><b>Não consegui ler o Toddle ${o.historico?'neste dia':'hoje'}.</b></p>${txt(T.aviso)?`<p class="peq">${esc(txt(T.aviso))}</p>`:''}</div>`;
  const P=objs(T.prazos).map(x=>({data:ISO_D(x.data)?x.data:null,o_que:txt(x.o_que),materia:matNome(x.materia),fonte:txt(x.fonte),tipo:'Prazo'}))
    .concat(objs(T.tarefas_de_casa).map(x=>({data:ISO_D(x.entrega)?x.entrega:null,o_que:txt(x.o_que),materia:matNome(x.materia),fonte:txt(x.fonte),tipo:'Tarefa de casa'})))
    .filter(x=>x.o_que).sort((a,b)=>(a.data||'9999').localeCompare(b.data||'9999'));
  const urg=P.filter(x=>x.data&&[0,1].includes(dDias(ref,x.data)));
  const C=objs(T.comunicados).filter(x=>txt(x.titulo)||txt(x.resumo)),M=objs(T.mensagens).filter(x=>txt(x.resumo));
  const pede=C.concat(M).filter(x=>x.acao===true).length;
  if(urg.length||pede)h+=`<p class="urg" role="status">${urg.length?`Para hoje e amanhã: <b>${plural(urg.length,'item','itens')}</b>.`:''}${urg.length&&pede?' ':''}${pede?`A escola pede uma resposta sua em <b>${plural(pede,'aviso','avisos')}</b>.`:''}</p>`;
  const vazio='<p class="semdados">Nada novo.</p>';
  h+=card('Prazos e tarefas',P.length?`<ul class="itens">${P.map(x=>{const n=x.data?dDias(ref,x.data):null,u=n===0||n===1;
    return `<li class="${u?'urg':''}${n!=null&&n<0?' passou':''}"><div class="i-top"><b>${quando(x.data,ref)}</b>${x.data?`<span>${dm(x.data)}</span>`:''}${x.materia?`<span class="tag">${esc(x.materia)}</span>`:''}</div><div>${esc(x.o_que)}</div><div class="peq">${x.tipo}${x.fonte?` · Fonte: ${esc(x.fonte)}`:''}</div></li>`}).join('')}</ul>`:vazio);
  const itens=(L,titulo,de)=>card(titulo,L.length?`<ul class="itens">${L.map(x=>`<li class="${x.acao===true?'acao':''}"><div class="i-top"><b>${dm(x.data)||'Sem data'}</b>${de&&txt(x.de)?`<span>${esc(txt(x.de))}</span>`:''}${x.acao===true?'<span class="tag pede">A escola pede uma resposta</span>':''}</div>${txt(x.titulo)?`<div><b>${esc(txt(x.titulo))}</b></div>`:''}${txt(x.resumo)?`<div>${esc(txt(x.resumo))}</div>`:''}${linkHTML(x.link)}</li>`).join('')}</ul>`:vazio);
  h+=itens(C,'Comunicados',false)+itens(M,'Mensagens',true);
  const A=objs(T.agenda_do_dia).filter(x=>txt(x.resumo));
  h+=card('O que foi dado em aula',A.length?`<ul class="itens">${A.map(x=>`<li><div class="i-top">${matNome(x.materia)?`<b>${esc(matNome(x.materia))}</b>`:''}<span>agenda do Toddle</span></div><div>${esc(txt(x.resumo))}</div></li>`).join('')}</ul>`:vazio);
  return h}
/* provas e prazos por data e importância: vêm do calendário embutido e, se houver, do último roteiro (não dependem dele) */
const SELO={urgente:'Urgente',importante:'Importante',info:''};
function agendaItens(ro){return PD.agenda({calendario:DADOS.calendario||{},roteiro:ro||null,hoje:hojeISO()})}
function agendaHTML(ro){const hoje=hojeISO(),A=agendaItens(ro);
  return card('Provas e prazos',A.length?`<ul class="agenda">${A.map(x=>`<li class="ag ag-${x.importancia}"><div class="i-top"><b>${x.data?quando(x.data,hoje):'A escola pede uma resposta'}</b>${x.data?`<span>${dm(x.data)}</span>`:''}${SELO[x.importancia]?`<span class="tag selo-${x.importancia}">${SELO[x.importancia]}</span>`:''}${x.materia?`<span class="tag">${esc(x.materia)}</span>`:''}</div><div>${esc(x.o_que)}</div>${x.fonte?`<div class="peq">Fonte: ${esc(x.fonte)}</div>`:''}</li>`).join('')}</ul>`:'<p class="semdados">Nenhuma prova ou prazo marcado daqui para frente.</p>')}
function escolaHTML(){if(ST.roteiros===null)return '<p class="peq" role="status">Buscando o roteiro…</p>';
  if(ST.roteirosErro)return agendaHTML(null)+'<p class="aviso">Não consegui buscar o roteiro agora (sem internet ou fora da conta). Tente de novo daqui a pouco.</p>';
  const L=ST.roteiros.slice().sort((a,b)=>b.dia.localeCompare(a.dia));
  if(!L.length)return agendaHTML(null)+card('Roteiro do dia','<p>Ainda não há roteiro. O primeiro sai às 7h do dia seguinte, depois que você gerar a chave do relatório em <b>Configurar</b> e salvá-la no Mac.</p>');
  if(ST.escolaDia){const r=L.find(x=>x.dia===ST.escolaDia);if(r)return `<div class="linha"><button class="bt" id="escVolta">← Voltar ao roteiro de hoje</button></div>${roteiroHTML(r,{ref:r.dia,historico:true})}`}

  h=agendaHTML(r)+h+roteiroHTML(r,{ref:hoje});
  if(L.length>1)h+=card('Histórico',`<ul class="hist">${L.slice(1).map(x=>{const T=x.toddle&&typeof x.toddle==='object'?x.toddle:{},n=objs(T.prazos).length+objs(T.tarefas_de_casa).length,c=objs(T.comunicados).length;
    return `<li><button class="bt larga" data-hdia="${esc(x.dia)}"><b>${esc(diaSem(x.dia))}</b><span class="peq">${T.status==='indisponivel'?'Toddle não lido neste dia':`${plural(n,'prazo ou tarefa','prazos e tarefas')} · ${plural(c,'comunicado','comunicados')}`}</span></button></li>`}).join('')}</ul>`);
  return h}

      <div class="linha"><button class="bt prim" id="cfNova">Cadastrar criança</button></div><div id="cfForm"></div>
      <p class="peq">A senha de 3 figuras separa irmãos no mesmo aparelho; não é uma senha forte.</p></section>
    <section class="card" id="cfChave"><h3>Chave do relatório para o Mac</h3>
      <p class="peq">O Mac usa esta chave para ler o progresso das crianças e mandar o roteiro das 7h para este painel. Ela só serve para isso.</p>
      <p class="peq"><b>Gerar outra chave faz a anterior parar de funcionar.</b> Faça isto no próprio Mac, para colar a chave direto.</p>
      <div class="linha"><button class="bt prim" id="chGerar">Gerar chave do relatório</button></div><div id="chConf"></div><div id="chOut"></div><p class="msg" id="chMsg" role="status" aria-live="polite"></p></section>
    <section class="card"><h3>Simulados para imprimir</h3>${sim.length?Object.entries(porPer).map(([p,S])=>`<p class="sub">${esc(p)}</p><ul class="lista">${S.map(s=>`<li><a class="lk" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(PD.nomeMateria(s.u.materia))}: ${esc(s.u.titulo)} (PDF)</a></li>`).join('')}</ul>`).join(''):'<p class="semdados">Nenhum simulado publicado.</p>'}</section>
    <section class="card"><h3>Exportar dados</h3><p class="peq">Baixa um arquivo JSON com o que está na conta: crianças (apelido, bichinho, série, turno), progresso, respostas dos últimos 180 dias e roteiros.</p>
      <div class="linha"><button class="bt" id="exBaixar">Baixar os dados (JSON)</button></div><p class="msg" id="exMsg" role="status" aria-live="polite"></p></section>
  </div>`}
function ligarConfig(){
  $('#cfNova').onclick=()=>formCadastro();
  $$('[data-cfig]').forEach(b=>b.onclick=()=>formFiguras(b.dataset.cfig));
  $$('[data-crem]').forEach(b=>b.onclick=()=>formRemover(b.dataset.crem));
  ligarChave();$('#exBaixar').onclick=exportar}
const limparForms=()=>{$$('.cform').forEach(x=>x.remove());const f=$('#cfForm');if(f)f.innerHTML=''};
function formCadastro(){limparForms();const box=$('#cfForm');
  box.innerHTML=`<div class="cform sub-card" aria-label="Cadastrar criança">
    <label class="rot" for="kNome">Apelido da criança</label><input id="kNome" class="campo" type="text" maxlength="20" autocomplete="off" autocapitalize="words" spellcheck="false">
    <span class="rot" id="kbl">Bichinho</span><div class="bichos" role="group" aria-labelledby="kbl">${BICHOS.map(([e,n])=>`<button type="button" class="bicho" data-b="${e}" aria-label="${n}" aria-pressed="false">${e}</button>`).join('')}</div>
    <div class="duas-c"><label class="rot">Série<select id="kSerie" class="campo">${SERIES.map(x=>`<option${x==='Year 3'?' selected':''}>${x}</option>`).join('')}</select></label><label class="rot">Turno<select id="kTurno" class="campo">${TURNOS.map(x=>`<option${x==='Manhã'?' selected':''}>${x}</option>`).join('')}</select></label></div>
    <p><b>Senha de figuras</b></p><p class="peq">Escolha com a criança 3 figuras, nesta ordem.</p>
    ${figCasas([],'kCasas')}${figGrade()}
    <p class="erro" id="kErr" role="alert" hidden></p>
    <div class="linha"><button class="bt" id="kApaga">Apagar figura</button><button class="bt" id="kNao">Cancelar</button><button class="bt prim" id="kOk">Cadastrar</button></div></div>`;
  let bicho=null,ocupado=false;const err=t=>{const e=$('#kErr');e.textContent=t;e.hidden=!t};
  const F=ligarFig(box,'kCasas',()=>err(''));
  $('#kApaga').onclick=()=>F.apagar();$('#kNao').onclick=limparForms;
  $$('.bicho').forEach(b=>b.onclick=()=>{bicho=b.dataset.b;$$('.bicho').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
  $('#kOk').onclick=async()=>{if(ocupado)return;const nome=$('#kNome').value.trim().replace(/\s+/g,' ').replace(/(^|\s)(\p{L})/gu,(m,a,c)=>a+c.toUpperCase());
    if(!nome)return err('Escreva o apelido da criança.');if(!nomeOK(nome))return err('Use só letras no apelido.');
    if((ST.criancas||[]).some(c=>String(c.apelido).toLowerCase()===nome.toLowerCase()))return err('Já tem uma criança com esse apelido.');
    if(!bicho)return err('Escolha um bichinho.');const senha=F.senha();if(!senha)return err('Escolha as 3 figuras da senha.');
    ocupado=true;const b=$('#kOk');b.disabled=true;b.textContent='Salvando…';
    let r=null;try{r=await SRV.criarCrianca({apelido:nome,bicho,serie:$('#kSerie').value,turno:$('#kTurno').value,figuras:senha})}catch(e){r=null}
    if(!$('#kOk'))return;
    if(!r||!r.id){ocupado=false;b.disabled=false;b.textContent='Cadastrar';return err('Não deu certo agora. Confira a internet e tente de novo.')}
    CF.msg=`Pronto! ${nome} está na conta. No celular da criança, abra o portal e entre com o seu e-mail.`;await recarregarCriancas(r.id)}}
async function recarregarCriancas(selecionar){try{ST.criancas=await SRV.criancas();ST.erroCriancas=false}catch(e){}
  if(selecionar&&ST.criancas.some(c=>c.id===selecionar))ST.atual=selecionar;
  if(!ST.criancas.some(c=>c.id===ST.atual))ST.atual=ST.criancas.length?ST.criancas[0].id:null;
  if(ST.atual)carregarCrianca(ST.atual);pintarSeletor();pintar()}
function formFiguras(id){limparForms();const c=(ST.criancas||[]).find(x=>x.id===id),row=$(`[data-crow="${CSS.escape(id)}"]`);if(!c||!row)return;
  const f=document.createElement('div');f.className='cform sub-card';
  f.innerHTML=`<p><b>Novas figuras de ${esc(c.apelido)}</b></p><p class="peq">Escolha com a criança 3 figuras, nesta ordem.</p>${figCasas([],'fCasas')}${figGrade()}
    <div class="linha"><button class="bt" id="fApaga">Apagar figura</button><button class="bt" id="fNao">Cancelar</button><button class="bt prim" id="fOk" disabled>Salvar as figuras</button></div><p class="msg" id="fMsg" role="status"></p>`;
  row.after(f);const F=ligarFig(f,'fCasas',s=>{$('#fOk').disabled=s.length<3});
  $('#fApaga').onclick=()=>F.apagar();$('#fNao').onclick=limparForms;
  $('#fOk').onclick=async()=>{const s=F.senha();if(!s)return;$('#fOk').disabled=true;$('#fMsg').textContent='Salvando…';
    let r;try{r=await SRV.mudarFiguras(id,s)}catch(e){r={ok:false}}
    if(!$('#fOk'))return;if(r&&r.ok){CF.msg=`Figuras de ${c.apelido} trocadas. No aparelho da criança, a senha nova vale na próxima entrada.`;const cc=$('#conteudo');cc.innerHTML=configHTML();ligarConfig()}
    else{$('#fOk').disabled=false;$('#fMsg').textContent='Não deu certo agora. Confira a internet e tente de novo.'}}}
function formRemover(id){limparForms();const c=(ST.criancas||[]).find(x=>x.id===id),row=$(`[data-crow="${CSS.escape(id)}"]`);if(!c||!row)return;
  const f=document.createElement('div');f.className='cform sub-card perigo-box';f.setAttribute('role','alertdialog');f.setAttribute('aria-labelledby','rmT');
  f.innerHTML=`<p id="rmT"><b>Remover ${esc(c.apelido)} da conta?</b></p><p class="peq">Apaga da conta o progresso, os pontos e as respostas desta criança. Não dá para desfazer.</p>
    <label class="rot" for="rmNome">Para confirmar, escreva o apelido: <b>${esc(c.apelido)}</b></label><input id="rmNome" class="campo" type="text" maxlength="20" autocomplete="off" spellcheck="false">
    <div class="linha"><button class="bt" id="rmNao">Cancelar</button><button class="bt perigo" id="rmSim" disabled>Remover</button></div><p class="msg" id="rmMsg" role="status"></p>`;
  row.after(f);const i=$('#rmNome');i.focus();
  i.oninput=()=>{$('#rmSim').disabled=i.value.trim().toLowerCase()!==String(c.apelido).toLowerCase()};
  $('#rmNao').onclick=limparForms;
  $('#rmSim').onclick=async()=>{$('#rmSim').disabled=true;$('#rmMsg').textContent='Removendo…';let r;try{r=await SRV.removerCrianca(id)}catch(e){r={ok:false}}
    if(!$('#rmSim'))return;if(r&&r.ok){delete ST.dados[id];CF.msg=`${c.apelido} saiu da conta.`;await recarregarCriancas()}
    else{$('#rmSim').disabled=false;$('#rmMsg').textContent='Não deu certo agora. Confira a internet e tente de novo.'}}}

/* chave do relatório: sempre confirma (a anterior para de funcionar); a chave fica só nesta tela e some ao tocar "Já salvei" */
function ligarChave(){const g=$('#chGerar');const msg=t=>{const m=$('#chMsg');if(m)m.textContent=t};
  const ERR={sem_sessao:'A sessão terminou. Entre de novo para gerar a chave.',rede:'Sem internet agora. Tente de novo daqui a pouco.',outro:'Não deu certo agora. Tente de novo.'};
  const gerar=async()=>{const out=$('#chOut');g.disabled=true;msg('Gerando…');out.innerHTML='';
    let r;try{r=await SRV.criarChaveRelatorio()}catch(e){r={ok:false,erro:'outro'}}
    if(!$('#chOut'))return;g.disabled=false;
    if(!r||!r.ok||!r.chave){msg(ERR[r&&r.erro]||ERR.rede);return}
    const chave=r.chave;msg('');g.textContent='Gerar outra chave';
    out.innerHTML=`<div class="sub-card chave"><p><b>Sua chave (aparece só agora):</b></p>
      <input id="chValor" class="campo mono" readonly spellcheck="false" autocomplete="off" aria-label="Chave do relatório">
      <div class="linha"><button class="bt prim" id="chCopiar">Copiar a chave</button><button class="bt" id="chSalvei">Já salvei no Mac</button></div>
      <p class="msg" id="chCopiaMsg" role="status" aria-live="polite"></p>
      <ol class="passos peq">
        <li>Toque em <b>Copiar a chave</b>.</li>
        <li>No Mac, abra o Terminal: Finder → Aplicativos → Utilitários → Terminal.</li>
        <li>Digite este comando (digite, não copie, para não trocar a chave copiada) e aperte Enter:<br><code>pbpaste &gt; ~/.portal-joao-relatorio</code></li>
        <li>Para conferir, digite <code>wc -c ~/.portal-joao-relatorio</code> e aperte Enter. Tem de aparecer o número ${chave.length}.</li>
        <li>Pronto. Toque em <b>Já salvei no Mac</b>. O primeiro roteiro sai no dia seguinte às 7h, com o Mac ligado.</li>
      </ol><p class="peq">Não mande a chave por e-mail nem por mensagem. Ela não aparece de novo: se perder, gere outra.</p></div>`;
    $('#chValor').value=chave;
    $('#chCopiar').onclick=async()=>{const cm=t=>{$('#chCopiaMsg').textContent=t};try{await navigator.clipboard.writeText(chave);cm('Chave copiada.')}catch(e){const i=$('#chValor');i.focus();i.select();cm('Selecionei a chave: use Copiar do aparelho.')}};
    $('#chSalvei').onclick=()=>{$('#chOut').innerHTML='';msg('Pronto. A chave fica só no Mac e não aparece mais aqui.')}};
  g.onclick=()=>{const c=$('#chConf');c.innerHTML=`<div class="sub-card perigo-box" role="alertdialog" aria-labelledby="chConfT"><p id="chConfT"><b>Gerar a chave agora?</b></p><p class="peq">Se já existe uma chave salva no Mac, ela para de funcionar. O roteiro só volta depois que você salvar a nova no Mac.</p><div class="linha"><button class="bt" id="chNao">Cancelar</button><button class="bt prim" id="chSim">Sim, gerar</button></div></div>`;
    $('#chNao').focus();$('#chNao').onclick=()=>{c.innerHTML='';g.focus()};$('#chSim').onclick=()=>{c.innerHTML='';gerar()}}}

/* exportar: o que está na conta, buscado agora (respostas dos últimos 180 dias) */
async function exportar(){const b=$('#exBaixar'),m=t=>{const x=$('#exMsg');if(x)x.textContent=t};b.disabled=true;m('Juntando os dados…');
  try{const L=await SRV.criancas();const cri=[];
    for(const c of L){const[progresso,respostas]=await Promise.all([SRV.progresso(c.id),SRV.respostas(c.id,PD.somaDias(hojeISO(),-180))]);
      cri.push({apelido:c.apelido,bicho:c.bicho,serie:c.serie,turno:c.turno,progresso,respostas})}
    let rot=[];try{rot=await SRV.roteiros(60)}catch(e){}
    const dados={exportado_em:new Date().toISOString(),conta:SRV.estado().email,criancas:cri,roteiros:rot.map(r=>({dia:r.dia,conteudo:r.conteudo}))};
    const blob=new Blob([JSON.stringify(dados,null,1)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`painel-dados-${hojeISO()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
    m(`Arquivo baixado: ${plural(cri.length,'criança','crianças')}, ${plural(cri.reduce((s,c)=>s+c.respostas.length,0),'resposta','respostas')}.`)}
  catch(e){m('Não deu certo agora. Confira a internet e tente de novo.')}
  if($('#exBaixar'))$('#exBaixar').disabled=false}

/* ---- 99-inicio.js ---- */
/* ================= PAINEL: início =================
   Lê o link do e-mail (#access_token=…, confirmação da conta, reserva ou "Esqueci a senha"; apaga da barra na hora). Com sessão nesta aba: o dashboard; sem sessão: só o login.
   A sessão renova sozinha; se o servidor recusar a renovação, volta para o login com o aviso. */
(function iniciar(){try{SRV.lerHash()}catch(e){}
  const dentro=()=>!!SRV.sessao()&&!SRV.estado().recuperando; /* com o link de "Esqueci a senha", primeiro a senha nova */
  try{window.addEventListener('hashchange',()=>{if(SRV.lerHash()){zerar();if(dentro())telaApp();else telaLogin()}})}catch(e){}
  SRV.vigiar(()=>{zerar();telaLogin()});
  if(dentro())telaApp();else telaLogin()})();

})();
</script>
