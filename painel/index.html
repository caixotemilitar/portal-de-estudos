:"What comes next?","p":"Qual vem depois?","x":"Each kilogram has 1,000 g, so 4 kg = 4,000 g.","xp":"Cada quilograma tem 1.000 g, então 4 kg = 4.000 g."},"rr1q2":{"c":"quilos","e":"Tap the card that does not belong.","p":"Toque no cartão que não pertence.","x":"The elephant, the watermelon and the horse are heavy: kilograms. The feather is light: grams.","xp":"O elefante, a melancia e o cavalo são pesados: quilogramas. A pena é leve: gramas."},"rr1q3":{"c":"litros","e":"What if a jug holds 1,000 mL? How many liters is that?","p":"E se uma jarra tem 1.000 mL? Quantos litros são?","x":"1 L — 1 liter = 1,000 milliliters, so 1,000 mL is 1 L.","xp":"1 L — 1 litro = 1.000 mililitros, então 1.000 mL é 1 L."},"rr1q4":{"c":"quilos","e":"Put them in order from the lightest to the heaviest.","p":"Coloque em ordem do mais leve para o mais pesado.","x":"The feather is the lightest. The watermelon is the heaviest.","xp":"A pena é a mais leve. A melancia é a mais pesada."},"rr1q5":{"c":"quilos","e":"1 kilogram is the same as 1,000 grams.","p":"1 quilograma é o mesmo que 1.000 gramas.","x":"It is true: 1 kg = 1,000 g.","xp":"É verdade: 1 kg = 1.000 g."},"rr1q5~v":{"c":"quilos","e":"1 liter is the same as 10 milliliters.","p":"1 litro é o mesmo que 10 mililitros.","x":"False: 1 liter = 1,000 milliliters.","xp":"Falso: 1 litro = 1.000 mililitros."},"rr2q1":{"c":"regua","e":"I put the end of the pencil on 1. It ends at 8. So it is 8 cm.","p":"Eu pus a ponta do lápis no 1. Ele termina no 8. Então tem 8 cm.","x":"The end of the pencil goes on zero, not on 1.","xp":"A ponta do lápis vai no zero, não no 1."},"rr2q2":{"c":"cm-ou-m","e":"Tap the card that does not belong.","p":"Toque no cartão que não pertence.","x":"The crayon, the pencil and the ant are short: centimeters. A door is tall: meters.","xp":"O giz, o lápis e a formiga são curtos: centímetros. A porta é alta: metros."},"rr2q3":{"c":"m-cm","e":"What if a rope is 4 meters long? How many centimeters?","p":"E se uma corda tem 4 metros? Quantos centímetros?","x":"400 cm — Each meter is 100 cm: 100 + 100 + 100 + 100 = 400.","xp":"400 cm — Cada metro tem 100 cm: 100 + 100 + 100 + 100 = 400."},"rr2q4":{"c":"m-cm","e":"1 meter = 100 centimeters. How many centimeters are in 2 meters?","p":"1 metro = 100 centímetros. Quantos centímetros há em 2 metros?","x":"Each meter is 100 cm: 100 + 100 = 200.","xp":"Cada metro tem 100 cm: 100 + 100 = 200."},"rr2q4~v":{"c":"m-cm","e":"1 meter = 100 centimeters. How many centimeters are in 3 meters?","p":"1 metro = 100 centímetros. Quantos centímetros há em 3 metros?","x":"100 + 100 + 100 = 300.","xp":"100 + 100 + 100 = 300."},"rr2q5":{"c":"regua","e":"How long is the pencil?","p":"Qual é o comprimento do lápis?","x":"It ends at 7: 7 cm.","xp":"Ele termina no 7: 7 cm."},"rr2q5~v":{"c":"regua","e":"How long is this pencil?","p":"Qual é o comprimento deste lápis?","x":"It ends at 11.","xp":"Ele termina no 11."},"rr3q1":{"c":"perimetro","e":"What comes next?","p":"Qual vem depois?","x":"A square has 4 equal sides: 4 + 4 + 4 + 4 = 16.","xp":"O quadrado tem 4 lados iguais: 4 + 4 + 4 + 4 = 16."},"rr3q2":{"c":"perimetro","e":"Why do we add all the sides to find the perimeter?","p":"Por que somamos todos os lados para achar o perímetro?","x":"The perimeter is the distance all the way around. — The perimeter goes all the way around, so we need every side. The space inside is the area.","xp":"O perímetro é a volta inteira. — O perímetro dá a volta inteira, então precisamos de todos os lados. O espaço de dentro é a área."},"rr3q3":{"c":"area","e":"The rectangle has 3 rows of 4 squares. I add 3 + 4 = 7. So the area is 7 squares.","p":"O retângulo tem 3 fileiras de 4 quadradinhos. Eu somo 3 + 4 = 7. Então a área é 7 quadradinhos.","x":"The area is all the squares inside: 4 + 4 + 4 = 12.","xp":"A área são todos os quadradinhos de dentro: 4 + 4 + 4 = 12."},"rr3q4":{"c":"perimetro","e":"What is the perimeter? Add all four sides.","p":"Qual é o perímetro? Some os quatro lados.","x":"5 + 2 + 5 + 2 = 14.","xp":"5 + 2 + 5 + 2 = 14."},"rr3q4~v":{"c":"perimetro","e":"What is the perimeter of this square?","p":"Qual é o perímetro deste quadrado?","x":"3 + 3 + 3 + 3 = 12.","xp":"3 + 3 + 3 + 3 = 12."},"rr3q5":{"c":"area","e":"What is the area? Count the squares inside.","p":"Qual é a área? Conte os quadradinhos de dentro.","x":"2 rows of 5: 5 + 5 = 10.","xp":"2 fileiras de 5: 5 + 5 = 10."},"mm1":{"c":"litros","e":"Which unit do we use for a lot of water, like a bucket?","p":"Que unidade usamos para muita água, como um balde?","x":"liters — A bucket holds a lot of water, so we use liters.","xp":"litros — Um balde tem muita água, então usamos litros."},"mm2":{"c":"litros","e":"Which unit do we use for a little liquid, like a spoon?","p":"Que unidade usamos para pouco líquido, como uma colher?","x":"milliliters (mL), for a little liquid — A spoon holds very little, so we use milliliters.","xp":"mililitros (mL), para pouco líquido — Uma colher tem muito pouco, então usamos mililitros."},"mm3":{"c":"litros","e":"How many milliliters are in 1 liter?","p":"Quantos mililitros há em 1 litro?","x":"1,000 — 1 liter = 1,000 milliliters.","xp":"1.000 — 1 litro = 1.000 mililitros."},"mm4":{"c":"quilos","e":"How many grams are in 1 kilogram?","p":"Quantos gramas há em 1 quilograma?","x":"1,000 — 1 kilogram = 1,000 grams.","xp":"1.000 — 1 quilograma = 1.000 gramas."},"mm5":{"c":"quilos","e":"Which unit do we use to weigh an elephant?","p":"Que unidade usamos para pesar um elefante?","x":"kilograms — An elephant is very heavy, so we use kilograms.","xp":"quilogramas — O elefante é muito pesado, então usamos quilogramas."},"mm6":{"c":"quilos","e":"Which unit do we use to weigh a feather?","p":"Que unidade usamos para pesar uma pena?","x":"grams — A feather is very light, so we use grams.","xp":"gramas — A pena é muito leve, então usamos gramas."},"mm7":{"c":"unidade-certa","e":"Which is heavier?","p":"O que é mais pesado?","x":"a watermelon — The watermelon is much heavier than an apple or a feather.","xp":"uma melancia — A melancia é bem mais pesada que a maçã ou a pena."},"mm8":{"c":"cm-ou-m","e":"Which unit do we use to measure a pencil?","p":"Que unidade usamos para medir um lápis?","x":"centimeters (cm), for short things — A pencil is short, so we use centimeters.","xp":"centímetros (cm), para coisas curtas — O lápis é curto, então usamos centímetros."},"mm9":{"c":"cm-ou-m","e":"Which unit do we use to measure how tall a door is?","p":"Que unidade usamos para medir a altura de uma porta?","x":"meters — A door is tall, so we use meters. A door is about 2 meters tall.","xp":"metros — A porta é alta, então usamos metros. Uma porta tem uns 2 metros."},"mm10":{"c":"m-cm","e":"How many centimeters are in 1 meter?","p":"Quantos centímetros há em 1 metro?","x":"100 — 1 meter = 100 centimeters.","xp":"100 — 1 metro = 100 centímetros."},"mm11":{"c":"regua","e":"Where do you start measuring on a ruler?","p":"Onde você começa a medir na régua?","x":"at zero — The end of the object goes on zero.","xp":"no zero — A ponta do objeto fica no zero."},"mm12":{"c":"perimetro","e":"What is the perimeter?","p":"O que é o perímetro?","x":"the distance around a shape — The perimeter is the distance all the way around. The space inside is the area.","xp":"a distância da volta da figura — O perímetro é a distância da volta inteira. O espaço de dentro é a área."},"mm13":{"c":"area","e":"What is the area?","p":"O que é a área?","x":"the space inside a shape — The area is the space inside. We count the squares.","xp":"o espaço de dentro da figura — A área é o espaço de dentro. Contamos os quadradinhos."},"mm14":{"c":"perimetro","e":"A rectangle has sides 4 cm, 2 cm, 4 cm and 2 cm. What is the perimeter?","p":"Um retângulo tem lados de 4 cm, 2 cm, 4 cm e 2 cm. Qual é o perímetro?","x":"12 cm — Add all four sides: 4 + 2 + 4 + 2 = 12 cm.","xp":"12 cm — Some os quatro lados: 4 + 2 + 4 + 2 = 12 cm."},"mm15":{"c":"perimetro","e":"A square has 4 sides of 3 cm. What is the perimeter?","p":"Um quadrado tem 4 lados de 3 cm. Qual é o perímetro?","x":"12 cm — A square has 4 equal sides: 3 + 3 + 3 + 3 = 12 cm.","xp":"12 cm — O quadrado tem 4 lados iguais: 3 + 3 + 3 + 3 = 12 cm."},"mm16":{"c":"area","e":"A rectangle has 2 rows of 5 squares. What is the area?","p":"Um retângulo tem 2 fileiras de 5 quadradinhos. Qual é a área?","x":"10 squares — Count the rows: 5 + 5 = 10 squares.","xp":"10 quadradinhos — Conte as fileiras: 5 + 5 = 10 quadradinhos."},"mm17":{"c":"litros","e":"1 liter is more than 500 milliliters.","p":"1 litro é mais que 500 mililitros.","x":"It is true: 1 liter = 1,000 mL, and 1,000 is more than 500.","xp":"É verdade: 1 litro = 1.000 mL, e 1.000 é mais que 500."},"mm18":{"c":"quilos","e":"A feather is measured in kilograms.","p":"A pena é medida em quilogramas.","x":"False: a feather is light, so we use grams.","xp":"Falso: a pena é leve, então usamos gramas."},"mm19":{"c":"perimetro","e":"The perimeter is the space inside a shape.","p":"O perímetro é o espaço de dentro da figura.","x":"False: the perimeter goes around. The space inside is the area.","xp":"Falso: o perímetro dá a volta. O espaço de dentro é a área."},"mm20":{"c":"litros","e":"We measure juice in ___.","p":"Medimos suco em ___.","x":"Juice is a liquid, so we use liters.","xp":"Suco é líquido, então usamos litros."},"mm21":{"c":"unidade-certa","e":"Match each thing to the unit we use to measure it.","p":"Ligue cada coisa à unidade que usamos para medir.","x":"Liquids: liters or milliliters. Heavy: kilograms. Short: centimeters.","xp":"Líquidos: litros ou mililitros. Pesado: quilogramas. Curto: centímetros."},"mm22":{"c":"unidade-certa","e":"Heavy or light? Put each card in its box.","p":"Pesado ou leve? Coloque cada cartão na caixa certa.","x":"Heavy things: kilograms. Light things: grams.","xp":"Coisas pesadas: quilogramas. Coisas leves: gramas."},"mm23":{"c":"m-cm","e":"1 m = 100 cm. How many centimeters are in 2 meters?","p":"1 m = 100 cm. Quantos centímetros há em 2 metros?","x":"200 cm — Each meter has 100 cm: 100 + 100 = 200 cm.","xp":"200 cm — Cada metro tem 100 cm: 100 + 100 = 200 cm."},"mm24":{"c":"m-cm","e":"1 m = 100 cm. How many centimeters are in 3 meters?","p":"1 m = 100 cm. Quantos centímetros há em 3 metros?","x":"300 cm — 100 + 100 + 100 = 300 cm.","xp":"300 cm — 100 + 100 + 100 = 300 cm."},"mm25":{"c":"cm-ou-m","e":"Which unit do we use to measure the length of a classroom?","p":"Que unidade usamos para medir o comprimento da sala de aula?","x":"meters — Long distances use meters. Centimeters are for short things.","xp":"metros — Distâncias compridas usam metros. Centímetros são para coisas curtas."},"mm26":{"c":"cm-ou-m","e":"Which tool is best to measure the length of a room?","p":"Qual instrumento é melhor para medir o comprimento de um quarto?","x":"a measuring tape — A measuring tape measures long lengths. A scale measures how heavy; a cup measures liquid.","xp":"uma fita métrica — A fita métrica mede comprimentos grandes. A balança mede o peso; o copo mede líquido."},"mm27":{"c":"m-cm","e":"Half a meter is 50 centimeters.","p":"Meio metro é 50 centímetros.","x":"True: 1 m = 100 cm, and half of 100 is 50.","xp":"Verdade: 1 m = 100 cm, e metade de 100 é 50."},"mm28":{"c":"cm-ou-m","e":"A football field is measured in centimeters.","p":"Um campo de futebol é medido em centímetros.","x":"False: a field is very long, so we use meters.","xp":"Falso: o campo é muito comprido, então usamos metros."},"mm29":{"c":"cm-ou-m","e":"Centimeters or meters? Put each card in its box.","p":"Centímetros ou metros? Coloque cada cartão na caixa certa.","x":"Short things: centimeters. Long or tall things: meters.","xp":"Coisas curtas: centímetros. Coisas compridas ou altas: metros."},"bn-litros-porque":{"c":"litros","e":"Why do we use milliliters for a spoon of medicine?","p":"Por que usamos mililitros para uma colher de remédio?","x":"A spoon holds a very small amount of liquid. — A spoon holds a small a as sílabas tem janela?","p":"","x":"3 sílabas: ja-ne-la — Bata palmas: ja-ne-la. São 3.","xp":""},"rr3q1~v":{"c":"silabas-contar","e":"Quantas sílabas tem borboleta?","p":"","x":"4 sílabas — bor-bo-le-ta: 4 palmas, polissílaba.","xp":""},"rr3q2":{"c":"silabas-nome","e":"Qual cartão não pertence ao grupo?","p":"","x":"sol, pé e mar têm 1 sílaba (monossílabas). ja-ne-la tem 3.","xp":""},"rr3q3":{"c":"verbo-subst","e":"Na frase \"O menino corre\", o verbo é \"menino\", porque mostra uma ação.","p":"","x":"corre mostra uma ação: é o verbo. menino dá nome: é substantivo.","xp":""},"rr3q4":{"c":"letra-v","e":"Qual é a regra?","p":"","x":"uva, vaca e cavalo têm V. Cavalo tem 3 sílabas e uva não é animal.","xp":""},"rr3q5":{"c":"verbo-subst","e":"É nome ou ação? Coloque cada cartão na caixa certa.","p":"","x":"Dá nome: substantivo. Mostra ação: verbo.","xp":""},"ma1":{"c":"machado","e":"Quem foi Machado de Assis?","p":"","x":"um escritor brasileiro — Machado de Assis foi um escritor: escreveu contos, romances, poemas e cartas.","xp":""},"ma2":{"c":"machado","e":"Onde Machado de Assis nasceu?","p":"","x":"no Rio de Janeiro — Machado nasceu no Rio de Janeiro, em 1839.","xp":""},"ma3":{"c":"machado","e":"Machado de Assis nasceu em 1839. Isso é no século...","p":"","x":"XIX — Os anos 1800 e pouco são o século XIX.","xp":""},"ma4":{"c":"machado","e":"Qual era o apelido de Machado de Assis?","p":"","x":"Bruxo do Cosme Velho — Ele morava no Cosme Velho e fazia \"mágica\" com as palavras: o Bruxo do Cosme Velho.","xp":""},"ma5":{"c":"machado","e":"Machado ajudou a criar a...","p":"","x":"Academia Brasileira de Letras — Ele ajudou a criar a Academia Brasileira de Letras e foi o primeiro presidente.","xp":""},"ma6":{"c":"carta-ordem","e":"Qual é a última parte de uma carta?","p":"","x":"a assinatura — No fim vem a assinatura de quem escreveu.","xp":""},"ma7":{"c":"carta-partes","e":"\"Prezada vizinha,\" é qual parte da carta?","p":"","x":"a saudação — Cumprimentar quem vai ler é a saudação.","xp":""},"ma8":{"c":"carta-partes","e":"\"Com carinho,\" é qual parte da carta?","p":"","x":"a despedida — Antes de assinar, a gente se despede.","xp":""},"ma9":{"c":"linguagem","e":"De qual expressão veio a palavra você?","p":"","x":"vossa mercê — vossa mercê virou você com o tempo.","xp":""},"ma10":{"c":"silabas-contar","e":"Quantas sílabas tem casa?","p":"","x":"2 — Bata palmas: ca-sa. São 2.","xp":""},"ma11":{"c":"silabas-contar","e":"Quantas sílabas tem cavalo?","p":"","x":"3 — ca-va-lo: 3 palmas.","xp":""},"ma12":{"c":"silabas-nome","e":"Qual palavra é polissílaba (4 sílabas ou mais)?","p":"","x":"telefone — te-le-fo-ne tem 4 sílabas. sol tem 1 e ca-sa tem 2.","xp":""},"ma13":{"c":"verbo-subst","e":"Qual palavra é um verbo (ação)?","p":"","x":"correr — correr é o que alguém faz: verbo. cadeira e escola são nomes.","xp":""},"ma14":{"c":"verbo-subst","e":"Qual palavra é um substantivo (nome)?","p":"","x":"carta — carta dá nome a uma coisa: substantivo. ler e pular são ações.","xp":""},"ma15":{"c":"letra-v","e":"Como se escreve o animal que dá leite?","p":"","x":"vaca — O animal que dá leite é a vaca, com V.","xp":""},"ma16":{"c":"machado","e":"Machado de Assis só escrevia poemas.","p":"","x":"Falso: ele escreveu contos, romances, poemas e cartas.","xp":""},"ma17":{"c":"carta-ordem","e":"Toda carta termina com a assinatura de quem escreveu.","p":"","x":"Verdade: a assinatura fica no fim.","xp":""},"ma18":{"c":"silabas-nome","e":"\"sol\" é uma palavra monossílaba.","p":"","x":"Verdade: sol se fala de uma vez só.","xp":""},"ma19":{"c":"machado","e":"Uma história curta se chama ___.","p":"","x":"História curta é conto.","xp":""},"ma20":{"c":"verbo-subst","e":"O menino vai ___ uma carta para a avó.","p":"","x":"Falta uma ação: escrever.","xp":""},"ma21":{"c":"linguagem","e":"Ligue a palavra da época à palavra de hoje.","p":"","x":"vossa mercê → você; mui → muito; pharmacia → farmácia.","xp":""},"ma22":{"c":"silabas-nome","e":"Quantas sílabas? Coloque cada palavra na caixa certa.","p":"","x":"Conte os pedacinhos: 1 mono, 2 dis, 3 tris, 4 ou mais poli.","xp":""},"ma23":{"c":"verbo-subst","e":"É nome ou ação?","p":"","x":"Nomes de pessoas, coisas e animais: substantivo. Ações: verbo.","xp":""},"ma24":{"c":"carta-ordem","e":"Qual é a primeira parte de uma carta?","p":"","x":"","xp":""},"ma25":{"c":"carta-partes","e":"\"Obrigado pelo presente!\" é qual parte da carta?","p":"","x":"a mensagem — O que a gente quer contar ou agradecer é a mensagem.","xp":""},"ma26":{"c":"silabas-contar","e":"Quantas sílabas tem borboleta?","p":"","x":"4 — Bata palmas: bor-bo-le-ta. São 4.","xp":""},"ma27":{"c":"silabas-nome","e":"Qual palavra é monossílaba (1 sílaba)?","p":"","x":"mar — mar tem 1 sílaba. ma-la tem 2 e ma-ca-co tem 3.","xp":""},"ma28":{"c":"verbo-subst","e":"Na frase \"A menina pulou o muro\", qual é o verbo?","p":"","x":"pulou — O verbo é o que alguém faz: pulou. menina e muro são nomes.","xp":""},"ma29":{"c":"machado","e":"Machado de Assis escreveu muitos ___ e romances.","p":"","x":"Machado escreveu contos (histórias curtas) e romances.","xp":""},"ma30":{"c":"letra-v","e":"A ___ comeu a grama do pasto.","p":"","x":"Quem come grama é a vaca, com V. A faca corta.","xp":""},"ma31":{"c":"linguagem","e":"\"Vossa mercê\" é como se dizia \"você\" antigamente.","p":"","x":"Verdade: vossa mercê virou você com o tempo.","xp":""},"ma32":{"c":"machado","e":"Por que chamam Machado de \"mágico das palavras\"?","p":"","x":"Porque escrevia tão bem que parecia mágica. — Ele era escritor: escrevia tão bem que as palavras pareciam mágica. Não era mágico de palco.","xp":""},"ma33":{"c":"carta-partes","e":"Olhe a carta. Qual parte está pintada de amarelo?","p":"","x":"a despedida — Antes do nome de quem escreveu vem a despedida: \"Com carinho,\".","xp":""},"ma34":{"c":"carta-partes","e":"Qual cartão não pertence ao grupo?","p":"","x":"Local e data, saudação e despedida são partes da carta. Conto é uma história curta.","xp":""},"ma35":{"c":"carta-ordem","e":"Qual parte vem depois?","p":"","x":"A ordem é: local e data, saudação, mensagem, despedida e assinatura.","xp":""},"ma36":{"c":"carta-ordem","e":"Na carta do Pedro, a saudação fica no começo. A mensagem vem depois. A assinatura vem antes da despedida.","p":"","x":"A assinatura é sempre a última parte, depois da despedida.","xp":""},"ma37":{"c":"linguagem","e":"Como escrevemos hoje a palavra da época?","p":"","x":"farmácia — pharmacia virou farmácia, com F.","xp":""},"ma38":{"c":"linguagem","e":"Reescreva como hoje: \"Vossa mercê é mui gentil.\"","p":"","x":"Você é muito gentil. — Trocamos duas palavras: vossa mercê → você e mui → muito.","xp":""},"ma39":{"c":"silabas-contar","e":"Quantas sílabas tem a palavra do desenho?","p":"","x":"2 sílabas — Bata palmas: u-va. São 2.","xp":""},"ma40":{"c":"silabas-contar","e":"E se a palavra for elefante? Bata palmas: quantas sílabas?","p":"","x":"4 (e-le-fan-te) — Bata palmas: e-le-fan-te. São 4, é polissílaba.","xp":""},"ma41":{"c":"silabas-nome","e":"Por que elefante é uma palavra polissílaba?","p":"","x":"Porque tem 4 sílabas, ou mais. — Polissílaba é a palavra com 4 sílabas ou mais. e-le-fan-te tem 4.","xp":""},"ma42":{"c":"verbo-subst","e":"Qual cartão não pertence ao grupo?","p":"","x":"correr, pular e escrever são verbos (ações). Janela é um substantivo (nome).","xp":""},"ma43":{"c":"letra-v","e":"Olhe o desenho. Que letra completa ár_ore?","p":"","x":"V — O desenho é uma árvore: ár-Vo-re.","xp":""},"ma44":{"c":"letra-v","e":"Qual frase está escrita certo?","p":"","x":"O cavalo come uva. — Cavalo e uva levam V: ca-va-lo e u-va.","xp":""},"ma45":{"c":"letra-v","e":"Eu escrevi: A baca dá leite.","p":"","x":"Quem dá leite é a vaca, com V.","xp":""},"ma46":{"c":"machado","e":"Machado de Assis escreveu contos, romances, poemas e cartas.","p":"","x":"Verdade! Ele escreveu de tudo.","xp":""},"ma47":{"c":"machado","e":"Uma história curta se chama ___.","p":"","x":"","xp":""},"ma48":{"c":"carta-ordem","e":"Coloque as partes da carta na ordem.","p":"","x":"Saudação, mensagem, despedida e assinatura.","xp":""},"ma49":{"c":"machado","e":"Monte a frase. As palavras cinza já estão no lugar. Olhe a dica embaixo de cada espaço.","p":"","x":"","xp":""},"ma50":{"c":"linguagem","e":"Algumas palavras da época de Machado mudaram e hoje falamos diferente.","p":"","x":"Verdade: a língua muda com o tempo.","xp":""},"ma51":{"c":"linguagem","e":"Palavra da época ou de hoje? Coloque cada cartão na caixa certa.","p":"","x":"vossa mercê, mui e pharmacia são da época. você, muito e farmácia são de hoje.","xp":""},"ma52":{"c":"carta-partes","e":"O livro \"A Carta\" só tem imagens. Como lemos um livro só de imagens?","p":"","x":"Olhando as figuras em ordem e contando a história. — Sem palavras, a gente olha as figuras em ordem e conta a história.","xp":""},"ma53":{"c":"silabas-nome","e":"Qual palavra é monossílaba (só 1 sílaba)?","p":"","x":"pé — pé se fala de uma vez só. pa-to tem 2, pa-ne-la tem 3.","xp":""},"ma54":{"c":"verbo-subst","e":"É nome ou ação? Coloque cada palavra na caixa certa.","p":"","x":"livro, vizinha e presente são nomes. agradecer, pular e cantar são ações.","xp":""},"ma55":{"c":"verbo-subst","e":"Machado gostava de ___ cartas.","p":"","x":"escrever é ação: é o verbo. caneta e janela são nomes.","xp":""},"ma56":{"c":"letra-v","e":"Olhe o desenho. Que letra completa li_ro?","p":"","x":"V — O desenho é um livro: li-Vro.","xp":""},"ma56~v":{"c":"letra-v","e":"Olhe o desenho. Que letra completa _aca?","p":"","x":"V — O desenho é uma vaca, com V. Com F seria faca, que corta!","xp":""},"ma57":{"c":"letra-v","e":"Monte a frase. As palavras cinza já estão no lugar. Olhe as dicas.","p":"","x":"","xp":""},"ma58":{"c":"feiurinha-sequencia","e":"Ponha a história do pão na ordem: do começo ao fim.","p":"","x":"Primeiro o pão estava na mesa. Depois Lia seguiu as migalhas. No fim, achou o Tobi.","xp":""},"ma59":{"c":"feiurinha-sequencia","e":"Qual palavra mostra o fim de uma história?","p":"","x":"Por fim — Primeiro abre, depois continua e por fim fecha a história.","xp":""},"ma60":{"c":"feiurinha-sequencia","e":"Na história do pão, o pão sumiu antes de Lia achar o Tobi.","p":"","x":"Verdade: primeiro o pão sumiu, depois Lia achou o Tobi.","xp":""},"ma61":{"c":"feiurinha-sequencia","e":"Por que \"Lia achou o Tobi\" fica no fim da história?","p":"","x":"Porque resolve o sumiço do pão. — O fim de uma história de mistério é quando ele se resolve.","xp":""},"ma62":{"c":"feiurinha-misterio","e":"Na história do pão, qual pista levou Lia ao quintal?","p":"","x":"As migalhas no chão. — Lia seguiu as migalhas até o quintal.","xp":""},"ma63":{"c":"feiurinha-misterio","e":"Qual foi a solução do mistério do pão?","p":"","x":"O cachorro Tobi comeu o pão. — A solução é o que explica o mistério: o Tobi pegou o pão.","xp":""},"ma64":{"c":"feiurinha-misterio","e":"Qual cartão não pertence ao grupo?","p":"","x":"Migalhas, pegadas e focinho sujo são pistas. A cor da toalha não ajuda a resolver.","xp":""},"ma65":{"c":"feiurinha-misterio","e":"Por que Lia seguiu as migalhas?","p":"","x":"Elas mostravam o caminho do pão. — As migalhas eram uma pista: mostravam por onde o pão foi.","xp":""},"ma66":{"c":"feiurinha-opiniao","e":"Qual frase é uma opinião com argumento?","p":"","x":"Gostei, porque o fim é engraçado. — O argumento é o porquê. Só a primeira frase diz por que gostou.","xp":""},"ma67":{"c":"feiurinha-opiniao","e":"É fato ou opinião? Coloque cada frase na caixa certa.","p":"","x":"Fato é o que aconteceu na história. Opinião é o que cada um acha.","xp":""},"ma68":{"c":"feiurinha-opiniao","e":"Achei o fim divertido, ___ o Tobi ficou sujo de pão.","p":"","x":"porque mostra o motivo da opinião.","xp":""},"ma69":{"c":"feiurinha-opiniao","e":"Monte a opinião com argumento. As palavras cinza já estão no lugar.","p":"","x":"","xp":""},"ma70":{"c":"feiurinha-opiniao","e":"Minha opinião com argumento: Gostei da história, e pronto.","p":"","x":"Opinião com argumento precisa do porquê. \"E pronto\" não diz o motivo.","xp":""},"caracteristicas-1":{"c":"verbo-subst","e":"Em “sapo verde”, qual palavra mostra a cor?","p":"","x":"verde — Verde diz como é o sapo.","xp":""},"caracteristicas-1~v":{"c":"verbo-subst","e":"Em “a caixa leve caiu”, qual palavra descreve a caixa?","p":"","x":"leve — Leve é o adjetivo que descreve a caixa.","xp":""},"caracteristicas-2":{"c":"verbo-subst","e":"Em “a caixa leve caiu”, qual palavra descreve a caixa?","p":"","x":"leve — Leve é o adjetivo que descreve a caixa.","xp":""},"caracteristicas-2~v":{"c":"verbo-subst","e":"Em “cavalo veloz”, qual palavra é um adjetivo?","p":"","x":"veloz — Veloz mostra uma característica do cavalo.","xp":""},"caracteristicas-3":{"c":"verbo-subst","e":"Em “cavalo veloz”, qual palavra é um adjetivo?","p":"","x":"veloz — Veloz mostra uma característica do cavalo.","xp":""},"caracteristicas-3~v":{"c":"verbo-subst","e":"Em “sapo verde”, qual palavra mostra a cor?","p":"","x":"verde — Verde diz como é o sapo.","xp":""},"vogais-consoantes-1":{"c":"silabas-contar","e":"Qual letra de “lua” é uma consoante?","p":"","x":"L — U e A são vogais. L é consoante.","xp":""},"vogais-consoantes-1~v":{"c":"silabas-contar","e":"Qual é a primeira vogal de “pato”?","p":"","x":"A — P e T são consoantes. A é a primeira vogal.","xp":""},"vogais-consoantes-2":{"c":"silabas-contar","e":"Qual é a primeira vogal de “pato”?","p":"","x":"A — P e T são consoantes. A é a primeira vogal.","xp":""},"vogais-consoantes-2~v":{"c":"silabas-contar","e":"Que letras de “bola” são vogais?","p":"","x":"O e A — O e A são vogais.","xp":""},"vogais-consoantes-3":{"c":"silabas-contar","e":"Que letras de “bola” são vogais?","p":"","x":"O e A — O e A são vogais.","xp":""},"vogais-consoantes-3~v":{"c":"silabas-contar","e":"Qual letra de “lua” é uma consoante?","p":"","x":"L — U e A são vogais. L é consoante.","xp":""},"palavras-derivadas-1":{"c":"palavras-derivadas","e":"Qual palavra vem de “livro”?","p":"","x":"livraria — Livraria vem de livro.","xp":""},"palavras-derivadas-1~v":{"c":"palavras-derivadas","e":"Quem faz sapatos é sapateiro. De que palavra vem “sapateiro”?","p":"","x":"sapato — Sapato e sapateiro são da mesma família.","xp":""},"palavras-derivadas-2":{"c":"palavras-derivadas","e":"Quem faz sapatos é sapateiro. De que palavra vem “sapateiro”?","p":"","x":"sapato — Sapato e sapateiro são da mesma família.","xp":""},"palavras-derivadas-2~v":{"c":"palavras-derivadas","e":"Qual palavra vem de “flor”?","p":"","x":"florista — Florista vem de flor.","xp":""},"palavras-derivadas-3":{"c":"palavras-derivadas","e":"Qual palavra vem de “flor”?","p":"","x":"florista — Florista vem de flor.","xp":""},"palavras-derivadas-3~v":{"c":"palavras-derivadas","e":"Qual palavra vem de “livro”?","p":"","x":"livraria — Livraria vem de livro.","xp":""},"letras-x-z-1":{"c":"letras-x-z","e":"Que letra falta no nome do pássaro: “_exéu”?","p":"","x":"X — Xexéu começa com X.","xp":""},"letras-x-z-1~v":{"c":"letras-x-z","e":"Que letra falta em “_epelim”?","p":"","x":"Z — Zepelim começa com Z.","xp":""},"letras-x-z-2":{"c":"letras-x-z","e":"Que letra falta em “_epelim”?","p":"","x":"Z — Zepelim começa com Z.","xp":""},"letras-x-z-2~v":{"c":"letras-x-z","e":"Qual par está escrito como na cruzadinha?","p":"","x":"xexéu e zepelim — Xexéu começa com X. Zepelim começa com Z.","xp":""},"letras-x-z-3":{"c":"letras-x-z","e":"Qual par está escrito como na cruzadinha?","p":"","x":"xexéu e zepelim — Xexéu começa com X. Zepelim começa com Z.","xp":""},"letras-x-z-3~v":{"c":"letras-x-z","e":"Que letra falta no nome do pássaro: “_exéu”?","p":"","x":"X — Xexéu começa com X.","xp":""},"pista1":{"c":"pistas-texto","e":"O texto diz: “A janela bateu com o vento”. O que causou o barulho?","p":"","x":"O vento na janela. — O texto aponta o vento como causa do barulho.","xp":""},"pista1-variacao":{"c":"pistas-texto","e":"Há farinha no chão e a lata tombou. De onde pode ter vindo a farinha?","p":"","x":"Da lata — A lata caída é a pista.","xp":""},"pista2":{"c":"pistas-texto","e":"“Bia tremia ao ouvir passos”. Qual pista sugere medo?","p":"","x":"O corpo tremendo. — Tremor pode indicar medo; observe a reação da personagem.","xp":""},"pista2-variacao":{"c":"pistas-texto","e":"Ivo sorriu e bateu palmas. O que sua reação sugere?","p":"","x":"Alegria — Sorrir e bater palmas pode mostrar alegria.","xp":""},"pista3":{"c":"pistas-texto","e":"“Era só o gato!”, disse Ana, aliviada. O que podemos concluir?","p":"","x":"Ela ficou mais tranquila. — A palavra aliviada indica que a preocupação diminuiu.","xp":""},"pista3-variacao":{"c":"pistas-texto","e":"O gelo derreteu e a mesa ficou molhada. De onde veio a água?","p":"","x":"Do gelo — Ao derreter, o gelo vira água.","xp":""},"seq1":{"c":"sequencia-narrativa","e":"Lia acendeu a luz depois de ouvir um ruído. O que fez primeiro?","p":"","x":"Ouvir o ruído. — A luz foi acesa depois do ruído.","xp":""},"seq1-variacao":{"c":"sequencia-narrativa","e":"Joana desenhou depois de pegar o lápis. O que veio antes?","p":"","x":"Pegar o lápis — Ela pegou o lápis antes de desenhar.","xp":""},"seq2":{"c":"sequencia-narrativa","e":"Ivo abriu a caixa, tirou um brinquedo e chamou Ana. O que fez antes de chamar Ana?","p":"","x":"Tirou o brinquedo. — Ele tirou o brinquedo antes de chamar Ana.","xp":""},"seq2-variacao":{"c":"sequencia-narrativa","e":"Rui abriu o livro, leu uma página e fechou o livro. O que fez no meio?","p":"","x":"Leu uma página — Rui leu entre abrir e fechar o livro.","xp":""},"seq3":{"c":"sequencia-narrativa","e":"A luz apagou; Rui buscou a lanterna; viu o gato. Qual resumo segue a ordem?","p":"","x":"Apagou, buscou, viu. — Mantenha a ordem dos acontecimentos apresentada no texto.","xp":""},"seq3-variacao":{"c":"sequencia-narrativa","e":"Eva calçou as botas. Saiu no quintal. Voltou com barro. Qual ação veio por último?","p":"","x":"Voltar com barro — Ela voltou por último.","xp":""},"b:feiurinha:0":{"c":"feiurinha-sequencia","e":"O que é contar a ordem dos acontecimentos?","p":"","x":"Dizer o que veio antes e depois. — A ordem dos acontecimentos diz o que veio antes, depois e no fim.","xp":""},"b:feiurinha:0~v":{"c":"feiurinha-sequencia","e":"Numa história, o que vem no fim?","p":"","x":"A parte que fecha a história. — O começo abre a história. O fim fecha: é a última parte.","xp":""},"b:feiurinha-ordem:0":{"c":"feiurinha-sequencia","e":"Ponha a história do pão na ordem: do começo ao fim.","p":"","x":"Primeiro o pão estava na mesa. Depois sumiu. No fim, Lia achou Tobi.","xp":""},"b:feiurinha-ordem:0~v":{"c":"feiurinha-sequencia","e":"O que aconteceu logo depois que o pão sumiu?","p":"","x":"Lia seguiu as migalhas. — Comprar e pôr na mesa vieram antes. Depois do sumiço, Lia seguiu as migalhas.","xp":""},"b:feiurinha-misterio:0":{"c":"feiurinha-misterio","e":"Qual pista levou Lia até a solução?","p":"","x":"As migalhas no chão. — As migalhas mostravam o caminho até o quintal, onde estava o Tobi.","xp":""},"b:feiurinha-misterio:0~v":{"c":"feiurinha-misterio","e":"Que outra pista mostrou que foi o Tobi?","p":"","x":"O focinho sujo de pão. — O focinho sujo de pão mostrou que o Tobi comeu o pão.","xp":""},"b:feiurinha-opiniao:0":{"c":"feiurinha-opiniao","e":"Dar opinião com argumento é...","p":"","x":"Dizer o que acho e o porquê. — O argumento é o porquê da opinião.","xp":""},"b:feiurinha-opiniao:0~v":{"c":"feiurinha-opiniao","e":"Monte a opinião com argumento. As palavras cinza já estão no lugar.","p":"","x":"","xp":""},"caracteristicas-pratica":{"c":"verbo-subst","e":"Em “sapo verde”, qual palavra mostra a cor?","p":"","x":"verde — Verde diz como é o sapo.","xp":""},"caracteristicas-pratica~v":{"c":"verbo-subst","e":"Em “a caixa leve caiu”, qual palavra descreve a caixa?","p":"","x":"leve — Leve é o adjetivo que descreve a caixa.","xp":""},"vogais-consoantes-pratica":{"c":"silabas-contar","e":"Qual letra de “lua” é uma consoante?","p":"","x":"L — U e A são vogais. L é consoante.","xp":""},"vogais-consoantes-pratica~v":{"c":"silabas-contar","e":"Qual é a primeira vogal de “pato”?","p":"","x":"A — P e T são consoantes. A é a primeira vogal.","xp":""},"palavras-derivadas-pratica":{"c":"palavras-derivadas","e":"Qual palavra vem de “livro”?","p":"","x":"livraria — Livraria vem de livro.","xp":""},"palavras-derivadas-pratica~v":{"c":"palavras-derivadas","e":"Quem faz sapatos é sapateiro. De que palavra vem “sapateiro”?","p":"","x":"sapato — Sapato e sapateiro são da mesma família.","xp":""},"letras-x-z-pratica":{"c":"letras-x-z","e":"Que letra falta no nome do pássaro: “_exéu”?","p":"","x":"X — Xexéu começa com X.","xp":""},"letras-x-z-pratica~v":{"c":"letras-x-z","e":"Que letra falta em “_epelim”?","p":"","x":"Z — Zepelim começa com Z.","xp":""},"pratica-pistas":{"c":"pistas-texto","e":"O texto diz: “A janela bateu com o vento”. O que causou o barulho?","p":"","x":"O vento na janela. — O texto aponta o vento como causa do barulho.","xp":""},"pratica-pistas-irma":{"c":"pistas-texto","e":"A gata correu para o pote ao ouvir a ração. O que ela ouviu?","p":"","x":"Ração caindo — O som da ração é a pista.","xp":""},"final-1":{"c":"carta-partes","e":"\"Vossa mercê,\" abre uma carta. Que parte é essa e como fica hoje?","p":"","x":"Saudação: \"Você,\" — Quem abre a carta é a saudação. E vossa mercê hoje é você.","xp":""},"final-2":{"c":"carta-partes","e":"\"Mui obrigado!\" fica no meio da carta. Que parte é e como fica hoje?","p":"","x":"Mensagem: \"Muito obrigado!\" — O que se conta no meio é a mensagem. E mui hoje é muito.","xp":""},"decisao-p1":{"c":"carta-ordem","e":"A carta do Pedro chegou com as partes soltas. Ponha tudo na ordem certa.","p":"","x":"A carta começa pelo local e a data e termina na assinatura.","xp":""},"decisao-p1-conserto":{"c":"carta-ordem","e":"","p":"","x":"","xp":""},"decisao-p2":{"c":"linguagem","e":"A carta traz uma palavra da época: vossa mercê. Troque pelo jeito de hoje.","p":"","x":"Vossa mercê é como se dizia você antigamente.","xp":""},"decisao-p2-conserto":{"c":"linguagem está de frente para N. O que acontece se você virar o ímã do lado N?","x":"They now repel — Turning one magnet brings its other pole around. Now the poles match.","xp":"Agora se repelem — Ao virar um ímã, o outro polo fica de frente. Agora os polos são iguais."},"sg-r2-5":{"c":"campo","e":"A magnetic field is invisible.","p":"Um campo magnético é invisível.","x":"The lines in the picture help us imagine the field. There are no visible lines around the magnet.","xp":"As linhas do desenho ajudam a imaginar o campo. Não há linhas visíveis ao redor do ímã."},"sg-r2-5-v":{"c":"campo","e":"What do the dashed lines around the magnet show?","p":"O que as linhas tracejadas em volta do ímã mostram?","x":"a model of its field — The lines help us represent the invisible magnetic field.","xp":"um desenho do campo — As linhas ajudam a representar o campo magnético invisível."},"sg-r3-1":{"c":"objetos","e":"Tap the card that does not belong.","p":"Toque no cartão que não combina.","x":"The fridge door, the compass and the pencil case have a magnet. Wood does not.","xp":"A porta da geladeira, a bússola e o estojo têm ímã. A madeira não."},"sg-r3-2":{"c":"friccao","e":"What if you push a toy car on a rough carpet, not a smooth floor?","p":"E se você empurrar um carrinho num tapete áspero, não no chão liso?","x":"It slows down sooner — A rough carpet makes more friction, so the car slows down sooner.","xp":"Ele para antes — O tapete áspero faz mais fricção, então o carrinho para antes."},"sg-r3-3":{"c":"estatica","e":"Why does a rubbed balloon pull bits of paper?","p":"Por que o balão esfregado puxa papelzinhos?","x":"It has static electricity. — Rubbing gives the balloon static electricity. That pulls the paper.","xp":"Ele tem eletricidade estática. — Esfregar dá ao balão eletricidade estática. É isso que puxa o papel."},"sg-r3-4":{"c":"gravidade","e":"Which force do these show?","p":"Que força esses exemplos mostram?","x":"All of them fall down: that is gravity.","xp":"Todos caem para baixo: isso é a gravidade."},"sg-r3-5":{"c":"gravidade","e":"Gravity pulls things up to the sky.","p":"A gravidade puxa as coisas para cima, para o céu.","x":"Gravity pulls things down, towards the Earth.","xp":"A gravidade puxa as coisas para baixo, para a Terra."},"sg-r3-5-v":{"c":"gravidade","e":"Gravity pulls a ball back down to the ground.","p":"A gravidade puxa a bola de volta para o chão.","x":"It is true: gravity pulls things down.","xp":"É verdade: a gravidade puxa as coisas para baixo."},"sgb-f1":{"c":"forcas","e":"What is a force?","p":"O que é uma força?","x":"a push or a pull — A force is a push or a pull. It can make things move or stop.","xp":"um empurrão ou um puxão — Uma força é um empurrão ou um puxão. Ela faz as coisas andarem ou pararem."},"sgb-f2":{"c":"forcas","e":"Match each force to an example.","p":"Ligue cada força a um exemplo.","x":"Gravity pulls down. Friction slows. A rubbed balloon uses electric force.","xp":"A gravidade puxa para baixo. A fricção freia. O balão esfregado usa a força elétrica."},"sgb-f3":{"c":"forcas","e":"Gravity, friction, magnetic force and electric force are all forces.","p":"Gravidade, fricção, força magnética e força elétrica são todas forças.","x":"It is true: all four are forces. Each one pushes or pulls.","xp":"É verdade: as quatro são forças. Cada uma empurra ou puxa."},"sgb-f4":{"c":"forcas","e":"Which force makes a magnet pull a nail?","p":"Qual força faz o ímã puxar um prego?","x":"magnetic force — A magnet pulls with magnetic force.","xp":"força magnética — O ímã puxa com a força magnética."},"sgb-c1":{"c":"contato","e":"Sort the examples by whether the force needs contact.","p":"Separe os exemplos pela necessidade de contato.","x":"The shoe and hand touch a surface. Gravity and electric force act without touching.","xp":"O sapato e a mão encostam numa superfície. A gravidade e a força elétrica agem sem encostar."},"sgb-c2":{"c":"contato","e":"Which force works without touching?","p":"Qual força age sem encostar?","x":"gravity — Friction and a push need to touch. Gravity does not.","xp":"gravidade (gravity) — A fricção e o empurrão precisam encostar. A gravidade não."},"sgb-c3":{"c":"contato","e":"Friction is a non-contact force.","p":"A fricção é uma força de não contato.","x":"Friction happens when two surfaces rub. So it is a contact force.","xp":"A fricção acontece quando duas superfícies se esfregam. Então é de contato."},"sgb-c4":{"c":"contato","e":"Why is magnetic force a non-contact force?","p":"Por que a força magnética é de não contato?","x":"It pulls before the clip touches. — A magnet pulls a clip before it touches. That is non-contact.","xp":"Puxa antes de o clipe encostar. — O ímã puxa o clipe antes de encostar. Isso é não contato."},"sgb-i1":{"c":"ima","e":"What is a magnet?","p":"O que é um ímã?","x":"An object that pulls some metal things — A magnet is not glue or a light. It pulls some metal things.","xp":"Um objeto que puxa alguns metais — Ímã não é cola nem luz. Ele puxa algumas coisas de metal."},"sgb-i2":{"c":"ima","e":"To attract means to ___ towards.","p":"Atrair quer dizer ___ para perto.","x":"Attract = pull towards.","xp":"Atrair = puxar para perto."},"sgb-i3":{"c":"ima","e":"Which one will a magnet pull?","p":"Qual o ímã vai puxar?","x":"an iron nail — Magnets pull iron.","xp":"um prego de ferro — Ímãs atraem ferro."},"sgb-i4":{"c":"ima","e":"Which one will a magnet not pull?","p":"Qual objeto o ímã não vai puxar?","x":"a wooden block — The magnet pulls the nail and clip. It does not pull wood.","xp":"um bloco de madeira — O ímã puxa o prego e o clipe. Ele não puxa a madeira."},"sgb-i5":{"c":"ima","e":"Does the magnet pull it or not? Put each thing in the right box.","p":"O ímã puxa ou não puxa? Coloque cada coisa na caixa certa.","x":"Ask: is it iron or steel? Then it is pulled.","xp":"Pergunte: é de ferro ou aço? Então é puxado."},"sgb-i6":{"c":"ima","e":"A magnet pulls a wooden spoon across the table.","p":"Um ímã puxa uma colher de madeira pela mesa.","x":"Wood is not pulled by the magnet.","xp":"A madeira não é atraída pelo ímã."},"sgb-i7":{"c":"ima","e":"A magnet can pull a paper clip without touching it.","p":"O ímã consegue puxar um clipe sem encostar nele.","x":"It is true! The pull is invisible, so the clip moves before it touches.","xp":"É verdade! O puxão é invisível, o clipe se mexe antes de encostar."},"sgb-t1":{"c":"tipos-ima","e":"Which magnet works with electricity?","p":"Qual ímã funciona com eletricidade?","x":"an electromagnet — An electromagnet works with electricity. You can turn it on and off.","xp":"um eletroímã — O eletroímã funciona com eletricidade. Dá para ligar e desligar."},"sgb-t2":{"c":"tipos-ima","e":"A permanent magnet stays a magnet all the time.","p":"Um ímã permanente continua ímã o tempo todo.","x":"It is true: a permanent magnet, like a fridge magnet, is always a magnet.","xp":"É verdade: um ímã permanente, como o de geladeira, é sempre ímã."},"sgb-t3":{"c":"tipos-ima","e":"A nail touches a magnet and picks up a clip. What kind of magnet is the nail?","p":"Um prego encosta no ímã e pega um clipe. Que tipo de ímã é o prego?","x":"temporary magnet — The nail is a magnet only while it touches the magnet: temporary.","xp":"ímã temporário — O prego só é ímã enquanto encosta no ímã: temporário."},"sgb-t4":{"c":"tipos-ima","e":"Match each magnet to what it does.","p":"Ligue cada ímã ao que ele faz.","x":"Permanent: always. Temporary: for a while. Electromagnet: when it is on.","xp":"Permanente: sempre. Temporário: por um tempo. Eletroímã: quando está ligado."},"sgb-t5":{"c":"tipos-ima","e":"A nail holds a clip on a magnet. What if you take the magnet away?","p":"Um prego segura um clipe no ímã. E se você tirar o ímã?","x":"It stops pulling the clip — A temporary magnet works only near a magnet. Away from it, the clip drops.","xp":"Ele para de puxar o clipe — O ímã temporário só funciona perto de um ímã. Longe dele, o clipe cai."},"sgb-p1":{"c":"polos","e":"You see two magnets pull together. Which poles could be facing?","p":"Dois ímãs se atraem. Que polos podem estar frente a frente?","x":"N and S — Attraction tells you that the poles facing are different.","xp":"N e S — A atração mostra que os polos frente a frente são diferentes."},"sgb-p2":{"c":"polos","e":"Same poles attract each other.","p":"Polos iguais se atraem.","x":"Same poles repel: N pushes N away. Different poles attract.","xp":"Polos iguais se repelem: N empurra N. Polos diferentes se atraem."},"sgb-p3":{"c":"polos","e":"Different poles ___ each other.","p":"Polos diferentes se ___.","x":"N and S are different poles, so they attract.","xp":"N e S são polos diferentes, então se atraem."},"sgb-p4":{"c":"polos","e":"Two magnets push apart. Which explanation is right?","p":"Dois ímãs se empurram. Qual explicação está certa?","x":"The same poles are facing. — Pushing apart means the same poles are facing: N and N, or S and S.","xp":"Os polos iguais estão de frente. — Empurrar quer dizer que polos iguais estão de frente: N e N, ou S e S."},"sgb-p5":{"c":"polos","e":"What are the two poles of a magnet?","p":"Quais são os dois polos de um ímã?","x":"north and south — A magnet has a north pole (N) and a south pole (S).","xp":"norte e sul — O ímã tem o polo norte (N) e o polo sul (S)."},"sgb-m1":{"c":"campo","e":"What is the magnetic field?","p":"O que é o campo magnético?","x":"the area around a magnet — The magnetic field is the area around a magnet where its force works.","xp":"a área ao redor do ímã — O campo magnético é a área ao redor do ímã onde a força age."},"sgb-m2":{"c":"campo","e":"A magnet pulls a clip that is very far away, outside its field.","p":"O ímã puxa um clipe muito longe, fora do campo.","x":"The force works only inside the field, close to the magnet.","xp":"A força só age dentro do campo, perto do ímã."},"sgb-m3":{"c":"campo","e":"Which clip is inside the magnetic field?","p":"Qual clipe está dentro do campo magnético?","x":"clip A — The field is the area around the magnet. Clip A is inside it.","xp":"clipe A — O campo é a área ao redor do ímã. O clipe A está dentro dele."},"sgb-m4":{"c":"campo","e":"What if you put a clip inside the field?","p":"E se você puser um clipe dentro do campo?","x":"The magnet pulls it — Inside the field, the magnetic force works. The clip is pulled.","xp":"O ímã puxa o clipe — Dentro do campo, a força magnética age. O clipe é puxado."},"sgb-b1":{"c":"bussola","e":"Which tool has a tiny magnet inside and shows directions?","p":"Qual ferramenta tem um ímã pequeno dentro e mostra direções?","x":"a compass — A compass has a tiny magnet needle that shows directions.","xp":"bússola — A bússola tem uma agulhinha de ímã que mostra as direções."},"sgb-b2":{"c":"bussola","e":"A compass helps us find directions.","p":"A bússola ajuda a achar direções.","x":"It is true: a compass has a tiny magnet needle that shows directions.","xp":"É verdade: a bússola tem uma agulhinha de ímã que mostra as direções."},"sgb-b3":{"c":"bussola","e":"What in a compass is a little magnet?","p":"O que na bússola é um pequeno ímã?","x":"the needle — The needle is the part that turns in Earth’s magnetic field.","xp":"a agulha — A agulha é a parte que gira com o campo magnético da Terra."},"sgb-b4":{"c":"bussola","e":"Homemade compass: what do you rub the needle with?","p":"Bússola caseira: com o que você esfrega a agulha?","x":"a magnet — Rub the needle with a magnet. Then it works like a compass needle.","xp":"um ímã — Esfregue a agulha com um ímã. Aí ela funciona como agulha de bússola."},"sgb-b5":{"c":"bussola","e":"The Earth has a magnetic field.","p":"A Terra tem um campo magnético.","x":"It is true: the Earth is like a giant magnet, with a magnetic field.","xp":"É verdade: a Terra é como um ímã gigante, com campo magnético."},"sgb-e1":{"c":"estatica","e":"What will the rubbed balloon pull?","p":"O que o balão esfregado vai puxar?","x":"paper bits — A rubbed balloon has static electricity. It pulls light things, like paper bits.","xp":"papelzinhos — O balão esfregado tem eletricidade estática. Ele puxa coisas leves, como papelzinhos."},"sgb-e2":{"c":"estatica","e":"Rubbing a balloon on cotton cloth makes static electricity.","p":"Esfregar um balão num pano de algodão faz eletricidade estática.","x":"It is true: in class, you rubbed a balloon on cotton cloth.","xp":"É verdade: na aula, vocês esfregaram um balão num pano de algodão."},"sgb-e3":{"c":"estatica","e":"Which one can pull bits of paper after you rub it?","p":"Qual consegue puxar papelzinhos depois de esfregado?","x":"a comb — A comb rubbed on hair or cloth pulls paper bits, like a balloon.","xp":"um pente — Um pente esfregado no cabelo ou no pano puxa papelzinhos, como o balão."},"sgb-e4":{"c":"estatica","e":"Static electricity can be dangerous.","p":"A eletricidade estática pode ser perigosa.","x":"It is true: lightning is a giant spark of static electricity.","xp":"É verdade: o raio é uma faísca gigante de eletricidade estática."},"sgb-e5":{"c":"estatica","e":"What if you do not rub the balloon?","p":"E se você não esfregar o balão?","x":"It will not pull the paper — Rubbing makes the static electricity. Without it, the paper stays still.","xp":"Ele não vai puxar o papel — Esfregar é o que faz a eletricidade estática. Sem isso, o papel fica parado."},"sgb-g1":{"c":"gravidade","e":"What keeps your feet on the ground when you stand still?","p":"O que mantém seus pés no chão quando você está em pé?","x":"gravity — Gravity acts even when you stand still.","xp":"gravidade (gravity) — A gravidade age mesmo quando você fica parado."},"sgb-g2":{"c":"gravidade","e":"Gravity pulls things down, towards the Earth.","p":"A gravidade puxa as coisas para baixo, para a Terra.","x":"It is true: gravity pulls everything down, towards the Earth.","xp":"É verdade: a gravidade puxa tudo para baixo, para a Terra."},"sgb-g3":{"c":"gravidade","e":"You jump up. Why do you come back down?","p":"Você pula. Por que você volta para baixo?","x":"Gravity pulls me down — Gravity pulls you back to the ground every time you jump.","xp":"A gravidade me puxa — A gravidade puxa você de volta para o chão toda vez que você pula."},"sgb-g4":{"c":"gravidade","e":"Gravity needs to touch things to pull them.","p":"A gravidade precisa encostar nas coisas para puxar.","x":"Gravity pulls a falling apple without touching it: non-contact.","xp":"A gravidade puxa a maçã que cai sem encostar: não contato."},"sgb-r1":{"c":"friccao","e":"What does friction do to a moving thing?","p":"O que a fricção faz com algo em movimento?","x":"It slows it down — Friction makes moving things go slower.","xp":"Deixa mais lento — A fricção faz as coisas em movimento ficarem mais lentas."},"sgb-r2":{"c":"friccao","e":"Friction happens when two surfaces ___ together.","p":"A fricção acontece quando duas superfícies se ___.","x":"Friction is the force when two surfaces rub, like a shoe on the floor.","xp":"Fricção é a força quando duas superfícies se esfregam, como o sapato no chão."},"sgb-r3":{"c":"friccao","e":"A pencil case slides across a desk. What helps slow it down?","p":"Um estojo desliza na mesa. O que ajuda a diminuir a velocidade?","x":"friction with the desk — The case slides against the desk. Friction acts against that sliding.","xp":"a fricção com a mesa — O estojo desliza sobre a mesa. A fricção age contra esse movimento."},"sgb-r4":{"c":"friccao","e":"Friction makes a bike go faster.","p":"A fricção faz a bicicleta ir mais rápido.","x":"Friction makes moving things go slower, not faster.","xp":"A fricção deixa as coisas mais lentas, não mais rápidas."},"sgb-o1":{"c":"objetos","e":"Some pencil cases close with a…","p":"Alguns estojos fecham com um…","x":"magnet — A small magnet in the flap keeps it closed.","xp":"ímã — Um ímã pequeno na tampa mantém o estojo fechado."},"sgb-o2":{"c":"objetos","e":"Which object at home uses a magnet?","p":"Qual objeto de casa usa ímã?","x":"the fridge door — The fridge door has a magnet strip that keeps it closed.","xp":"a porta da geladeira — A porta da geladeira tem uma tira de ímã que a mantém fechada."},"sgb-o3":{"c":"objetos","e":"Match the object to what its magnet does.","p":"Ligue o objeto ao que o ímã dele faz.","x":"Think: does it hold, close, open or show the way?","xp":"Pense: ele segura, fecha, abre ou mostra o caminho?"},"sgb-o4":{"c":"objetos","e":"Has a magnet or is pulled by one? Put each in the right box.","p":"Tem ímã ou é puxado por um? Coloque cada um na caixa certa.","x":"Some objects have a magnet. Iron and steel things are pulled by magnets.","xp":"Alguns objetos têm ímã. Coisas de ferro e aço são puxadas por ímãs."},"sgb-o5":{"c":"objetos","e":"Which object is attracted by a magnet?","p":"Qual objeto é atraído por um ímã?","x":"a magnetic steel key — Magnets attract iron and steel. Glass and paper are not attracted.","xp":"uma chave de aço magnético — Ímãs atraem ferro e aço. Vidro e papel não são atraídos."},"blk-forces":{"c":"forcas","e":"Match each force to what it does.","p":"Ligue cada força ao que ela faz.","x":"Gravity pulls down. Friction slows. Magnets pull iron. A rubbed balloon uses electric force.","xp":"A gravidade puxa para baixo. A fricção freia. O ímã puxa ferro. O balão esfregado usa a força elétrica."},"blk-forces-v":{"c":"forcas","e":"Which force lets a rubbed balloon pull paper?","p":"Qual força faz um balão esfregado puxar papel?","x":"electric force — A rubbed balloon pulls paper by electric force.","xp":"força elétrica — Um balão esfregado puxa papel por força elétrica."},"blk-contact":{"c":"contato","e":"Does it need to touch? Put each force in the right box.","p":"Precisa encostar? Coloque cada força na caixa certa.","x":"Contact forces touch. Gravity, magnetic and electric forces do not.","xp":"Forças de contato encostam. Gravidade, força magnética e elétrica não."},"blk-contact-v":{"c":"contato","e":"Magnetic force works without touching.","p":"A força magnética age sem encostar.","x":"It is true: a magnet pulls a clip before it touches.","xp":"É verdade: o ímã puxa o clipe antes de encostar."},"blk-magnets":{"c":"ima","e":"Does the magnet attract it? Put each thing in the right box.","p":"O ímã atrai? Coloque cada coisa na caixa certa.","x":"A magnet attracts the iron nail and these steel objects.","xp":"O ímã atrai o prego de ferro e estes objetos de aço."},"blk-magnets-v":{"c":"ima","e":"Which one will the magnet attract?","p":"Qual o ímã vai atrair?","x":"nail — Magnets attract iron and steel. Wood and glass are not attracted.","xp":"prego — O ímã atrai ferro e aço. Madeira e vidro não."},"blk-kinds":{"c":"tipos-ima","e":"Match each kind of magnet to what it does.","p":"Ligue cada tipo de ímã ao que ele faz.","x":"Permanent: always. Temporary: for a while. Electromagnet: with electricity.","xp":"Permanente: sempre. Temporário: por um tempo. Eletroímã: com eletricidade."},"blk-kinds-v":{"c":"tipos-ima","e":"A crane lifts a car, then turns off its magnet. Which magnet is it?","p":"Um guindaste levanta um carro e desliga o ímã. Que ímã é esse?","x":"an electromagnet — Only an electromagnet can be turned off. It works with electricity.","xp":"um eletroímã — Só o eletroímã pode ser desligado. Ele funciona com eletricidade."},"blk-poles":{"c":"polos","e":"Attract or repel? Put each pair in the right box.","p":"Atraem ou se repelem? Coloque cada par na caixa certa.","x":"Different poles attract. Same poles repel.","xp":"Polos diferentes se atraem. Polos iguais se repelem."},"blk-poles-v":{"c":"polos","e":"These magnets face S to S. What happens?","p":"Estes ímãs estão S de frente para S. O que acontece?","x":"They repel — S and S are the same poles, so they push apart.","xp":"Eles se repelem — S e S são polos iguais, então se empurram."},"blk-field":{"c":"campo","e":"Tap the clip that is inside the magnetic field.","p":"Toque no clipe que está dentro do campo magnético.","x":"","xp":""},"blk-field-v":{"c":"campo","e":"The magnetic field is the area around a magnet.","p":"O campo magnético é a área ao redor do ímã.","x":"It is true: the field is the area around the magnet where its force works.","xp":"É verdade: o campo é a área ao redor do ímã onde a força age."},"blk-compass":{"c":"bussola","e":"Make a homemade compass. Put the steps in order.","p":"Faça uma bússola caseira. Coloque os passos em ordem.","x":"First make the needle a magnet. Then put it on the floating foam and watch it turn.","xp":"Primeiro a agulha vira ímã. Depois ponha no isopor flutuando e veja girar."},"blk-compass-v":{"c":"bussola","e":"In a homemade compass, what lets the needle turn freely?","p":"Na bússola caseira, o que deixa a agulha girar livremente?","x":"foam floating on water — The needle rests on foam that can turn on the water.","xp":"isopor boiando na água — A agulha fica sobre o isopor que pode girar na água."},"blk-static":{"c":"estatica","e":"What makes a balloon pull paper bits?","p":"O que faz o balão puxar papelzinhos?","x":"rubbing it on hair — Rubbing the balloon makes static electricity. Then it pulls paper.","xp":"esfregar no cabelo — Esfregar o balão faz eletricidade estática. Aí ele puxa o papel."},"blk-static-v":{"c":"estatica","e":"A rubbed comb can pull little bits of paper.","p":"Um pente esfregado consegue puxar papelzinhos.","x":"It is true: in class you used a balloon, a comb and cotton cloth.","xp":"É verdade: na aula vocês usaram balão, pente e pano de algodão."},"blk-gravity":{"c":"gravidade","e":"You drop a ball. Why does it fall down?","p":"Você solta uma bola. Por que ela cai para baixo?","x":"Gravity pulls it — Gravity pulls everything down, towards the Earth.","xp":"A gravidade puxa — A gravidade puxa tudo para baixo, para a Terra."},"blk-gravity-v":{"c":"gravidade","e":"Gravity is a contact force.","p":"A gravidade é uma força de contato.","x":"Gravity pulls a falling apple without touching: it is non-contact.","xp":"A gravidade puxa a maçã sem encostar: é de não contato."},"blk-friction":{"c":"friccao","e":"A ball rolls on grass and on a smooth floor. Where does it stop sooner?","p":"Uma bola rola na grama e no chão liso. Onde ela para antes?","x":"on the grass — Grass is rough: more friction, so the ball slows down sooner.","xp":"na grama — A grama é áspera: mais fricção, então a bola para antes."},"blk-friction-v":{"c":"friccao","e":"Friction makes a moving bike go ___.","p":"A fricção deixa a bicicleta em movimento mais ___.","x":"Friction makes moving things go slower.","xp":"A fricção deixa as coisas em movimento mais lentas."},"blk-objects":{"c":"objetos","e":"Has a magnet or is attracted? Put each in the right box.","p":"Tem ímã ou é atraído? Coloque cada um na caixa certa.","x":"Some objects have a magnet inside. Iron and steel things are attracted.","xp":"Alguns objetos têm ímã dentro. Coisas de ferro e aço são atraídas."},"blk-objects-v":{"c":"objetos","e":"Which object has a magnet inside?","p":"Qual objeto tem ímã dentro?","x":"compass — The compass has a tiny magnet needle. Pencils and glasses do not.","xp":"bússola — A bússola tem uma agulha de ímã. Lápis e copo não."},"sg-final":{"c":"contato","e":"A rubbed balloon pulls paper bits. A magnet pulls a clip. What is the same?","p":"O balão esfregado puxa papel. O ímã puxa um clipe. O que é igual?","x":"Both pull without touching. — The balloon and the magnet both pull without touching: non-contact forces.","xp":"Os dois puxam sem encostar. — O balão e o ímã puxam sem encostar: forças de não contato."},"sg-final-irma":{"c":"contato","e":"An apple falls. A hand pushes a ball. Which force needs contact?","p":"Uma maçã cai. Uma mão empurra a bola. Qual força precisa de contato?","x":"The hand’s push. — The hand pushes by touching the ball. Gravity pulls the apple while it is in the air.","xp":"O empurrão da mão. — A mão empurra tocando na bola. A gravidade puxa a maçã enquanto ela está no ar."},"decisao-p1":{"c":"ima","e":"Oh no! Steel clips fell into the sand. How do you get them out fast?","p":"Ih! Clipes de aço 959d405197c4d56e847d1434de943c934361d41aaf9920c482d9"},{"unidade":"2026-11-science-av3-guia","pergunta":"blk-forces-v","enunciado":"Which force lets a rubbed balloon pull paper?","versao":"41b8a8dceff2824bac9e24c556546fb9e61b0ba1943ce887a30d69f30df741f3"},{"unidade":"2026-11-science-av3-guia","pergunta":"blk-kinds-v","enunciado":"A crane lifts a car, then turns off its magnet. Which magnet is it?","versao":"6f4245a83cf755c08f084d21ae9066337147e614ee1b703544f3da8add545a2b"},{"unidade":"2026-11-science-av3-guia","pergunta":"blk-compass-v","enunciado":"In a homemade compass, what lets the needle turn freely?","versao":"829fe2743d211c1213685e6336a274b80b32df80c3f7c34cd2c0eab85e3d13b4"},{"unidade":"2026-11-science-av3-guia","pergunta":"blk-friction-v","enunciado":"Choose the word that completes the sentence. Friction makes a moving bike go ___.","versao":"bb62bbfb825d06eca604f1697bb714185bfd727d2e85e8b0f1ecb8be87d749f7"}]}}</script>
<script>
(function(){
'use strict';
/* ---- 01-nucleo.js ---- */
/* ================= PAINEL DO RESPONSÁVEL: núcleo =================
   Página separada do portal da criança (build: motor/build-painel.js → build/painel.html → site/painel/index.html).
   - DADOS: o que o build embute (unidades resumidas, calendário sem "fonte", simulados, config pública do servidor).
   - Ajudas: $, esc (todo texto que vem do servidor, do Toddle ou das unidades passa por aqui), linkSeguro (só https, sem usuário/senha).
   - SRV: cliente mínimo do Supabase só com fetch (lógica copiada de motor/src/015-servidor.js, sem perfis nem sincronização):
     login por E-MAIL E SENHA (decisão do Victor em 15/11: entrar, criarConta com confirmação do e-mail UMA vez, recuperar → link
     #type=recovery → salvarNovaSenha; o link antigo #access_token=… continua de reserva e o hash é apagado na hora).
     Sessão: sessionStorage["pj:painel:sessao"] (fechar a aba = sair) ou, com "Manter conectado neste aparelho", localStorage
     ["pj:painel:lembrar"]. Do localStorage o painel só usa as chaves "pj:painel:*" (lembrar e o último e-mail, nunca a senha);
     NUNCA lê nem grava "pj:conta" (a sessão do portal da criança, mesma origem). "Sair" apaga as duas. Renovação antes de vencer
     e ao receber 401; família, crianças, senha de figuras, chave do relatório, roteiros, progresso e respostas (de 1000 em 1000). */
const DADOS=(()=>{try{return JSON.parse(document.getElementById('dados-painel').textContent)}catch(e){return{}}})();
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const hojeISO=()=>{const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
/* link seguro: só https:// com host, sem usuário/senha, sem aspas nem espaços; qualquer outra coisa some (cópia de prLink) */
function linkSeguro(u){u=typeof u==='string'?u.trim():'';if(!/^https:\/\/[^\s"'<>`\\]+$/i.test(u))return null;
  try{const x=new URL(u);if(x.protocol!=='https:'||!x.hostname||x.username||x.password)return null;return x.href}catch(e){return null}}
function linkHTML(u,txt){const h=linkSeguro(u);if(!h)return'';let host='';try{host=new URL(h).hostname}catch(e){}
  return `<a class="lk" href="${esc(h)}" target="_blank" rel="noopener noreferrer">${esc(txt||(/(^|\.)toddleapp\.com$/i.test(host)?'Abrir no Toddle':'Abrir o link'))}</a>`}

const SRV=(()=>{
  const CFG=DADOS.servidor||null;
  const URL0=CFG&&typeof CFG.url==='string'?CFG.url.replace(/\/+$/,''):'';
  const CHAVE=CFG&&typeof CFG.chave_publica==='string'?CFG.chave_publica:'';
  const configurado=()=>!!(URL0&&CHAVE&&/^https:\/\//.test(URL0));
  const K='pj:painel:sessao',KL='pj:painel:lembrar',KE='pj:painel:email';
  const LOC=(()=>{try{return window.localStorage}catch(e){return null}})(),SES=(()=>{try{return window.sessionStorage}catch(e){return null}})();
  const ler=(st,k)=>{try{const v=st&&st.getItem(k);return v?JSON.parse(v):null}catch(e){return null}};
  const tira=(st,k)=>{try{if(st)st.removeItem(k)}catch(e){}};
  const poe=(st,k,v)=>{try{if(!st)return false;st.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
  const chaveDispensas='pj:painel:dispensados';
  const avisosDispensados=()=>{
    const ids=ler(LOC,chaveDispensas);
    return Array.isArray(ids)?ids.filter(id=>typeof id==='string'):[];
  };
  const guardarDispensas=ids=>poe(LOC,chaveDispensas,[...new Set([...avisosDispensados(),...ids])].slice(-100));
  let memoria=null; /* sem storage (modo privado antigo): só na memória da aba */
  const lerS=()=>ler(SES,K)||ler(LOC,KL)||memoria;
  const lembrando=()=>!ler(SES,K)&&!!ler(LOC,KL);
  /* lembrar: true → localStorage (fica neste aparelho); false → sessionStorage (só esta aba); undefined → mantém onde já estava */
  function gravarS(v,lembrar){memoria=null;
    if(v==null){tira(SES,K);tira(LOC,KL);return}
    if(lembrar===undefined)lembrar=lembrando();
    if(lembrar&&poe(LOC,KL,v)){tira(SES,K);return}
    tira(LOC,KL);if(!poe(SES,K,v))memoria=v}
  /* o último e-mail usado (só para preencher o campo; a senha nunca é guardada) */
  const ultimoEmail=()=>{try{const v=LOC&&LOC.getItem(KE);return v&&v.length<=200?v:''}catch(e){return''}};
  const guardarEmail=e=>{try{if(LOC)LOC.setItem(KE,String(e).slice(0,200))}catch(x){}};
  let erroLink=null,recuperacao=null;
  const sessao=()=>{const s=lerS();return s&&typeof s==='object'&&s.access_token&&s.refresh_token?s:null};
  const b64url=s=>{s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))};
  const jwt=t=>{try{return JSON.parse(b64url(String(t).split('.')[1]))}catch(e){return{}}};
  function guardar(d,emailPadrao,lembrar){if(!d||!d.access_token||!d.refresh_token)return null;const p=jwt(d.access_token),u=d.user||{};
    const exp=+d.expires_at||(d.expires_in?Math.floor(Date.now()/1000)+(+d.expires_in):+p.exp||Math.floor(Date.now()/1000)+3600);
    const antes=sessao()||{};const user_id=u.id||p.sub||antes.user_id||null;
    const s={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:exp,user_id,email:u.email||p.email||emailPadrao||antes.email||''};
    gravarS(s,lembrar);erroLink=null;return s}
  function perder(motivo){gravarS(null);if(motivo)erroLink=motivo}

  async function chamar(metodo,caminho,o={}){
    if(!configurado())return{ok:false,status:0,erro:'outro'};
    const h={'apikey':CHAVE};if(o.token)h.Authorization='Bearer '+o.token;if(o.body!==undefined)h['Content-Type']='application/json';Object.assign(h,o.headers||{});
    const ac=typeof AbortController==='function'?new AbortController():null;const t=ac?setTimeout(()=>ac.abort(),o.prazo||15000):null;
    try{const r=await fetch(URL0+caminho,{method:metodo,headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined,signal:ac?ac.signal:undefined,cache:'no-store'});
      let data=null;const txt=await r.text().catch(()=>'');if(txt){try{data=JSON.parse(txt)}catch(e){data=txt}}
      return{ok:r.ok,status:r.status,data}}
    catch(e){return{ok:false,status:0,erro:'rede'}}
    finally{if(t)clearTimeout(t)}}
  const codigoErro=r=>{const d=(r&&r.data&&typeof r.data==='object')?r.data:{};return String(d.error_code||d.code||d.error||'')+' '+String(d.msg||d.message||d.error_description||'')};

  let renovando=null;
  function renovar(){if(renovando)return renovando;
    renovando=(async()=>{const s=sessao();if(!s)return null;
      const r=await chamar('POST','/auth/v1/token?grant_type=refresh_token',{body:{refresh_token:s.refresh_token}});
      if(r.ok)return guardar(r.data,s.email);
      if(r.status===0)return s;
      const atual=sessao();if(atual&&atual.refresh_token!==s.refresh_token)return atual; /* outra aba (com "manter conectado") já renovou */
      if(r.status===400||r.status===401||r.status===403){perder('sessao');aoPerder()}
      return null})().finally(()=>{renovando=null});return renovando}
  async function tokenValido(){let s=sessao();if(!s)return null;if(s.expires_at-60<Date.now()/1000)s=await renovar();return s?s.access_token:null}
  async function api(metodo,caminho,o={}){let tok=await tokenValido();if(!tok)return{ok:false,status:0,erro:'sem_sessao'};
    let r=await chamar(metodo,caminho,Object.assign({},o,{token:tok}));
    if(r.status===401){const s=await renovar();if(s&&s.access_token!==tok)r=await chamar(metodo,caminho,Object.assign({},o,{token:s.access_token}))}
    if(!r.ok&&!r.erro)r.erro=r.status===401?'sem_sessao':'outro';return r}
  /* quem desenha a tela é avisado quando a sessão acaba (renovação recusada) */
  let ouvinte=null;const aoPerder=()=>{try{ouvinte&&ouvinte()}catch(e){}};
  /* renova sozinha: a cada minuto e ao voltar para a aba */
  let relogio=null;
  function vigiar(fn){ouvinte=fn;if(relogio)return;
    const olhar=()=>{const s=sessao();if(s&&s.expires_at-120<Date.now()/1000)renovar()};
    relogio=setInterval(olhar,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)olhar()})}

  const emailOK=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||''))&&String(e).length<=200;
  function voltaPara(){try{return /^https?:$/.test(location.protocol)?location.origin+location.pathname:null}catch(e){return null}}
  async function enviarLink(email){email=String(email||'').trim();if(!emailOK(email))return{ok:false,erro:'email'};
    const v=voltaPara();const r=await chamar('POST','/auth/v1/otp'+(v?'?redirect_to='+encodeURIComponent(v):''),{body:{email,create_user:true}});
    if(r.ok)return{ok:true};if(r.erro==='rede')return{ok:false,erro:'rede'};
    const c=codigoErro(r);
    if(r.status===429||/rate_limit|over_email|too many/i.test(c))return{ok:false,erro:'limite'};
    if(/not_authorized|not authorized|signup_disabled|signups not allowed|otp_disabled/i.test(c))return{ok:false,erro:'nao_autorizado'};
    return{ok:false,erro:'outro'}}
  /* o link do e-mail abre o painel com #access_token=…&refresh_token=…&type=signup|magiclink|recovery (ou #error=…); apaga da barra na hora.
     signup (confirmação da conta nova, uma vez só) e magiclink (reserva): entra nesta aba. recovery ("Esqueci a senha"): o token fica SÓ
     na memória até salvar a senha nova (recarregar antes disso pede outro link). */
  function lerHash(){let h='';try{h=location.hash||''}catch(e){return false}
    if(!/^#.*(access_token=|error_code=|error=)/.test(h))return false;
    const q=new URLSearchParams(h.slice(1));
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){try{location.hash=''}catch(e2){}}
    if(q.get('access_token')&&q.get('refresh_token')){const d={access_token:q.get('access_token'),refresh_token:q.get('refresh_token'),expires_at:q.get('expires_at'),expires_in:q.get('expires_in')};
      if(q.get('type')==='recovery'){recuperacao=d;erroLink=null;return true}
      if(guardar(d))return true}
    erroLink=/expired/i.test(q.get('error_code')||q.get('error_description')||'')?'vencido':'link';return true}

  /* ---------- e-mail e senha: a senha só vai no corpo do fetch (nunca em console, URL, storage ou mensagem) ---------- */
  const senhaOK=s=>typeof s==='string'&&s.length>=8&&s.length<=72;
  function erroAuth(r){if(!r||r.erro==='rede')return'rede';const c=codigoErro(r);
    if(r.status===429||/rate_limit|over_email|over_request|too many/i.test(c))return'limite';
    if(/email_not_confirmed|not confirmed/i.test(c))return'nao_confirmado';
    if(/invalid_credentials|invalid login|invalid_grant/i.test(c))return'senha';
    if(/user_already_exists|already registered|email_exists/i.test(c))return'ja_existe';
    if(/same_password|should be different/i.test(c))return'mesma';
    if(/weak_password|password should/i.test(c))return'senha_fraca';
    if(/not_authorized|not authorized|signup_disabled|signups not allowed|otp_disabled|email_provider_disabled/i.test(c))return'nao_autorizado';
    return'outro'}
  const validar=(email,senha)=>!emailOK(email)?'email':!senhaOK(senha)?'senha_curta':null;
  async function entrar(email,senha,lembrar){email=String(email||'').trim();const v=validar(email,senha);if(v)return{ok:false,erro:v};
    const r=await chamar('POST','/auth/v1/token?grant_type=password',{body:{email,password:senha}});
    if(r.ok&&guardar(r.data,email,!!lembrar))return{ok:true};
    return{ok:false,erro:r.ok?'outro':erroAuth(r)}}
  async function criarConta(email,senha,lembrar){email=String(email||'').trim();const v=validar(email,senha);if(v)return{ok:false,erro:v};
    const volta=voltaPara();const r=await chamar('POST','/auth/v1/signup'+(volta?'?redirect_to='+encodeURIComponent(volta):''),{body:{email,password:senha}});
    if(r.ok){if(r.data&&r.data.access_token&&guardar(r.data,email,!!lembrar))return{ok:true,entrou:true};return{ok:true,confirmar:true}}
    return{ok:false,erro:erroAuth(r)}}
  async function recuperar(email){email=String(email||'').trim();if(!emailOK(email))return{ok:false,erro:'email'};
    const volta=voltaPara();const r=await chamar('POST','/auth/v1/recover'+(volta?'?redirect_to='+encodeURIComponent(volta):''),{body:{email}});
    return r.ok?{ok:true}:{ok:false,erro:erroAuth(r)}}
  async function salvarNovaSenha(senha,lembrar){if(!senhaOK(senha))return{ok:false,erro:'senha_curta'};const rec=recuperacao;if(!rec)return{ok:false,erro:'sem_link'};
    const r=await chamar('PUT','/auth/v1/user',{token:rec.access_token,body:{password:senha}});
    if(r.ok){recuperacao=null;return guardar(Object.assign({},rec,{user:r.data&&typeof r.data==='object'?r.data:{}}),'',!!lembrar)?{ok:true}:{ok:false,erro:'outro'}}
    if(r.status===401||r.status===403){recuperacao=null;erroLink='vencido';return{ok:false,erro:'sem_link'}}
    return{ok:false,erro:erroAuth(r)}}
  function cancelarRecuperacao(){recuperacao=null}
  async function sair(){const s=sessao();perder(null);erroLink=null;recuperacao=null;
    if(s)chamar('POST','/auth/v1/logout?scope=local',{token:s.access_token,prazo:4000}).catch(()=>{});return{ok:true}}

  async function familia(){const s=sessao();if(!s)throw new Error('sem_sessao');
    const g=await api('GET','/rest/v1/familias?select=id,codigo&dono=eq.'+encodeURIComponent(s.user_id));
    if(!g.ok)throw new Error(g.erro||'outro');
    let f=Array.isArray(g.data)&&g.data[0];
    if(!f){const p=await api('POST','/rest/v1/familias?select=id,codigo',{body:{dono:s.user_id},headers:{Prefer:'return=representation'}});
      if(p.ok)f=Array.isArray(p.data)?p.data[0]:p.data;
      else if(p.status===409||/23505/.test(codigoErro(p))){const g2=await api('GET','/rest/v1/familias?select=id,codigo&dono=eq.'+encodeURIComponent(s.user_id));f=g2.ok&&Array.isArray(g2.data)&&g2.data[0]}
      if(!f)throw new Error(p.erro||'outro')}
    return{id:f.id,codigo:f.codigo}}
  async function criancas(){const r=await api('GET','/rest/v1/criancas?select=id,apelido,bicho,serie,turno&order=criado_em.asc');
    if(!r.ok)throw new Error(r.erro||'outro');return Array.isArray(r.data)?r.data.filter(c=>c&&c.id):[]}
  async function criarCrianca(o){o=o||{};const senha=String(o.figuras||'');if(!senha)throw new Error('sem senha');
    const fam=await familia();
    const r=await api('POST','/rest/v1/criancas?select=id',{body:{familia:fam.id,apelido:String(o.apelido||'').slice(0,20),bicho:String(o.bicho||''),serie:o.serie||'Year 3',turno:o.turno||'Manhã',senha_hash:'x'},headers:{Prefer:'return=representation'}});
    const c=r.ok&&(Array.isArray(r.data)?r.data[0]:r.data);if(!c||!c.id)throw new Error(r.erro||'outro');
    const d=await api('POST','/rest/v1/rpc/definir_senha',{body:{p_crianca:c.id,p_senha:senha}});
    if(!d.ok){await api('DELETE','/rest/v1/criancas?id=eq.'+encodeURIComponent(c.id));throw new Error(d.erro||'outro')}
    return{id:c.id}}
  async function mudarFiguras(id,senha){if(!id||!senha)return{ok:false,erro:'outro'};

/* Catálogo geral, curado à parte dos roteiros de cada família. */
const AC = (() => {
  const campos = new Set(['titulo','publicado','publico','resumo','importancia','prazo','acao','ate']);
  function data(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const d = new Date(s + 'T00:00:00Z');
    return !isNaN(d) && d.toISOString().slice(0,10) === s;
  }
  const texto = (s,max) => typeof s === 'string' && !!s.trim() && s.length <= max &&
    !/[<>]|https?:|www\.|\S@\S/i.test(s);
  function validar(lista) {
    if (!Array.isArray(lista)) throw new Error('Esperava uma lista de avisos compartilhados.');
    lista.forEach((a,i) => {
      if (!a || typeof a !== 'object' || Object.keys(a).some(k=>!campos.has(k)) ||
          !texto(a.titulo,100) || !texto(a.publico,100) || !texto(a.resumo,360) ||
          !data(a.publicado) || !['alta','normal'].includes(a.importancia) ||
          (a.acao != null && !texto(a.acao,180)) ||
          (a.prazo != null && (!data(a.prazo) || a.prazo < a.publicado)) ||
          (a.ate != null && (!data(a.ate) || a.ate < (a.prazo || a.publicado)))) {
        throw new Error('Aviso compartilhado inválido na posição ' + (i+1) + '. Use somente os campos e resumos do catálogo.');
      }
    });
    return lista;
  }
  function priorizar(lista,hoje) {
    const amanha = new Date(hoje+'T00:00:00Z');
    amanha.setUTCDate(amanha.getUTCDate()+1);
    const limite = amanha.toISOString().slice(0,10);
    return lista.filter(a=>a.publicado<=hoje&&(!(a.ate||a.prazo)||(a.ate||a.prazo)>=hoje))
      .map(a=>({...a,peso:a.prazo&&a.prazo>=hoje&&a.prazo<=limite?0:
        a.importancia==='alta'||(a.acao&&(!a.prazo||a.prazo>=hoje))?1:2}))
      .sort((a,b)=>a.peso-b.peso || (a.prazo||'9999').localeCompare(b.prazo||'9999') ||
        b.publicado.localeCompare(a.publicado));
  }
  return {validar,priorizar};
})();
if (typeof module !== 'undefined' && module.exports) module.exports = AC;
